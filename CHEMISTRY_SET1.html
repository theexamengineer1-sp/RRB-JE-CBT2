नायन", "6; ऋणायन", "2; ऋणायन"], "e": "इसमें 6 संयोजी इलेक्ट्रॉन हैं, अतः अष्टक पूरा करने के लिए 2 और चाहिए। यह 2 इलेक्ट्रॉन ग्रहण करता है, अतः संयोजकता 2 और यह ऋणायन बनाता है (S²⁻ – तत्व सल्फ़र है)।", "r": "संयोजी इलेक्ट्रॉन 1–3 → खोता (धनायन); 5–7 → ग्रहण (ऋणायन); संयोजकता = 8 − संयोजी इलेक्ट्रॉन।"}}, {"s": "Atom & Mole Concept", "a": 2, "en": {"q": "Protium, deuterium and tritium are the three isotopes of hydrogen. Which statement about them is correct?", "o": ["They differ in the number of protons", "They have the same number of neutrons", "They have the same chemical properties but different masses", "They have different numbers of electrons"], "e": "All three have 1 proton and 1 electron, so their chemical properties are the same. They have 0, 1 and 2 neutrons respectively, so their mass numbers (1, 2, 3) and physical properties differ.", "r": "Isotopes: same Z, different A; same chemistry, different physical properties."}, "hi": {"q": "प्रोटियम, ड्यूटेरियम और ट्राइटियम हाइड्रोजन के तीन समस्थानिक हैं। इनके बारे में कौन-सा कथन सही है?", "o": ["इनमें प्रोटॉनों की संख्या भिन्न होती है", "इनमें न्यूट्रॉनों की संख्या समान होती है", "इनके रासायनिक गुण समान पर द्रव्यमान भिन्न होते हैं", "इनमें इलेक्ट्रॉनों की संख्या भिन्न होती है"], "e": "तीनों में 1 प्रोटॉन और 1 इलेक्ट्रॉन है, अतः रासायनिक गुण समान हैं। इनमें क्रमशः 0, 1 और 2 न्यूट्रॉन हैं, अतः द्रव्यमान संख्याएँ (1, 2, 3) और भौतिक गुण भिन्न हैं।", "r": "समस्थानिक: समान Z, भिन्न A; समान रासायनिक गुण, भिन्न भौतिक गुण।"}}, {"s": "Atom & Mole Concept", "a": 0, "en": {"q": "How many molecules are present in 22 g of carbon dioxide? (C = 12 u, O = 16 u, Nₐ = 6.022 × 10²³)", "o": ["3.011 × 10²³", "6.022 × 10²³", "1.204 × 10²⁴", "1.5 × 10²³"], "e": "Molar mass of CO₂ = 12 + 2 × 16 = 44 g/mol. Moles = 22/44 = 0.5 mol. Molecules = 0.5 × 6.022 × 10²³ = 3.011 × 10²³.", "r": "Number of particles = moles × 6.022 × 10²³."}, "hi": {"q": "22 g कार्बन डाइऑक्साइड में कितने अणु होते हैं? (C = 12 u, O = 16 u, Nₐ = 6.022 × 10²³)", "o": ["3.011 × 10²³", "6.022 × 10²³", "1.204 × 10²⁴", "1.5 × 10²³"], "e": "CO₂ का मोलर द्रव्यमान = 12 + 2 × 16 = 44 g/mol। मोल = 22/44 = 0.5 मोल। अणु = 0.5 × 6.022 × 10²³ = 3.011 × 10²³।", "r": "कणों की संख्या = मोल × 6.022 × 10²³।"}}, {"s": "Atom & Mole Concept", "a": 2, "en": {"q": "The valency of calcium is 2 and that of the nitrate ion (NO₃⁻) is 1. What is the correct formula of calcium nitrate?", "o": ["CaNO₃", "Ca₂NO₃", "Ca(NO₃)₂", "Ca₂(NO₃)₃"], "e": "Cross the valencies: Ca gets 1 and NO₃ gets 2. Since the polyatomic ion repeats, it is written in brackets: Ca(NO₃)₂. Charges balance: +2 and 2 × (−1).", "r": "Put a polyatomic ion in brackets when it appears more than once."}, "hi": {"q": "कैल्सियम की संयोजकता 2 और नाइट्रेट आयन (NO₃⁻) की 1 है। कैल्सियम नाइट्रेट का सही सूत्र क्या है?", "o": ["CaNO₃", "Ca₂NO₃", "Ca(NO₃)₂", "Ca₂(NO₃)₃"], "e": "संयोजकताएँ क्रॉस करें: Ca को 1 और NO₃ को 2। बहुपरमाणुक आयन दोहराया गया है, अतः कोष्ठक में: Ca(NO₃)₂। आवेश संतुलित: +2 और 2 × (−1)।", "r": "बहुपरमाणुक आयन एक से अधिक बार आए तो उसे कोष्ठक में लिखें।"}}, {"s": "Atom & Mole Concept", "a": 3, "en": {"q": "What is the molecular mass of sulphuric acid, H₂SO₄? (H = 1 u, S = 32 u, O = 16 u)", "o": ["49 u", "96 u", "82 u", "98 u"], "e": "Molecular mass = 2 × 1 + 32 + 4 × 16 = 2 + 32 + 64 = 98 u.", "r": "Molecular mass = sum of atomic masses of all atoms in the formula."}, "hi": {"q": "सल्फ़्यूरिक अम्ल H₂SO₄ का आण्विक द्रव्यमान क्या है? (H = 1 u, S = 32 u, O = 16 u)", "o": ["49 u", "96 u", "82 u", "98 u"], "e": "आण्विक द्रव्यमान = 2 × 1 + 32 + 4 × 16 = 2 + 32 + 64 = 98 u।", "r": "आण्विक द्रव्यमान = सूत्र के सभी परमाणुओं के परमाणु द्रव्यमानों का योग।"}}, {"s": "Atom & Mole Concept", "a": 0, "en": {"q": "When 12 g of carbon burns completely in 32 g of oxygen, exactly 44 g of carbon dioxide is formed. Which law does this illustrate?", "o": ["Law of conservation of mass", "Law of constant proportions", "Avogadro's law", "Law of multiple proportions"], "e": "Total mass of reactants (12 + 32 = 44 g) equals the mass of the product (44 g). Mass is neither created nor destroyed in a chemical reaction (Lavoisier).", "r": "Conservation of mass: mass of reactants = mass of products."}, "hi": {"q": "12 g कार्बन 32 g ऑक्सीजन में पूरी तरह जलकर ठीक 44 g कार्बन डाइऑक्साइड बनाता है। यह किस नियम को दर्शाता है?", "o": ["द्रव्यमान संरक्षण का नियम", "स्थिर अनुपात का नियम", "आवोगाद्रो का नियम", "गुणित अनुपात का नियम"], "e": "अभिकारकों का कुल द्रव्यमान (12 + 32 = 44 g) उत्पाद के द्रव्यमान (44 g) के बराबर है। रासायनिक अभिक्रिया में द्रव्यमान न बनता है न नष्ट होता है (लेवोज़िए)।", "r": "द्रव्यमान संरक्षण: अभिकारकों का द्रव्यमान = उत्पादों का द्रव्यमान।"}}, {"s": "Reactions & Acids-Bases", "a": 1, "en": {"q": "A person suffering from acidity after a heavy meal is given an antacid. Which substance is commonly used as the antacid?", "o": ["Vinegar", "Milk of magnesia", "Lemon juice", "Common salt"], "e": "Acidity means excess hydrochloric acid in the stomach. Milk of magnesia, Mg(OH)₂, is a mild base that neutralises the extra acid. Vinegar and lemon juice are acids; common salt is neutral.", "r": "Antacids are mild bases: Mg(OH)₂, NaHCO₃."}, "hi": {"q": "भारी भोजन के बाद अम्लता से पीड़ित व्यक्ति को ऐंटैसिड दिया जाता है। सामान्यतः कौन-सा पदार्थ ऐंटैसिड के रूप में प्रयुक्त होता है?", "o": ["सिरका", "मिल्क ऑफ़ मैग्नीशिया", "नींबू का रस", "साधारण नमक"], "e": "अम्लता का अर्थ आमाशय में अधिक हाइड्रोक्लोरिक अम्ल। मिल्क ऑफ़ मैग्नीशिया, Mg(OH)₂, हल्का क्षारक है जो अतिरिक्त अम्ल को उदासीन करता है। सिरका और नींबू अम्ल हैं; साधारण नमक उदासीन है।", "r": "ऐंटैसिड हल्के क्षारक हैं: Mg(OH)₂, NaHCO₃।"}}, {"s": "Reactions & Acids-Bases", "a": 2, "en": {"q": "Rainwater with a pH below 5.6 is called acid rain. Which acids are mainly responsible for it?", "o": ["Acetic acid and citric acid", "Hydrochloric acid and lactic acid", "Sulphuric acid and nitric acid", "Carbonic acid and formic acid"], "e": "Sulphur dioxide and nitrogen oxides from fuels and industries dissolve in rainwater to form sulphuric acid and nitric acid. These lower the pH below 5.6 and damage buildings (marble cancer), soil and aquatic life.", "r": "Acid rain: SO₂ → H₂SO₄, NO₂ → HNO₃; pH < 5.6."}, "hi": {"q": "5.6 से कम pH वाले वर्षा जल को अम्ल वर्षा कहते हैं। इसके लिए मुख्यतः कौन-से अम्ल उत्तरदायी हैं?", "o": ["ऐसीटिक अम्ल और सिट्रिक अम्ल", "हाइड्रोक्लोरिक अम्ल और लैक्टिक अम्ल", "सल्फ़्यूरिक अम्ल और नाइट्रिक अम्ल", "कार्बोनिक अम्ल और फॉर्मिक अम्ल"], "e": "ईंधन और उद्योगों से निकली सल्फ़र डाइऑक्साइड और नाइट्रोजन ऑक्साइड वर्षा जल में घुलकर सल्फ़्यूरिक और नाइट्रिक अम्ल बनाती हैं। ये pH को 5.6 से नीचे कर इमारतों (संगमरमर कैंसर), मिट्टी और जलीय जीवों को हानि पहुँचाते हैं।", "r": "अम्ल वर्षा: SO₂ → H₂SO₄, NO₂ → HNO₃; pH < 5.6।"}}, {"s": "Reactions & Acids-Bases", "a": 1, "en": {"q": "Doctors use Plaster of Paris to support fractured bones. Which property of Plaster of Paris makes this possible?", "o": ["It dissolves completely in water", "It sets into a hard mass when mixed with water", "It releases oxygen when moistened", "It becomes soft when heated"], "e": "Plaster of Paris (CaSO₄·½H₂O) combines with water and changes into gypsum (CaSO₄·2H₂O), which sets into a hard solid mass. This holds the broken bone in place.", "r": "CaSO₄·½H₂O + 1½H₂O → CaSO₄·2H₂O (hard gypsum)."}, "hi": {"q": "डॉक्टर टूटी हड्डियों को सहारा देने के लिए प्लास्टर ऑफ़ पेरिस का प्रयोग करते हैं। प्लास्टर ऑफ़ पेरिस का कौन-सा गुण इसे संभव बनाता है?", "o": ["यह पानी में पूरी तरह घुल जाता है", "पानी मिलाने पर यह कठोर पिंड में जम जाता है", "नमी मिलने पर यह ऑक्सीजन छोड़ता है", "गर्म करने पर यह नरम हो जाता है"], "e": "प्लास्टर ऑफ़ पेरिस (CaSO₄·½H₂O) पानी से जुड़कर जिप्सम (CaSO₄·2H₂O) बनता है, जो कठोर ठोस पिंड में जम जाता है। यह टूटी हड्डी को स्थिर रखता है।", "r": "CaSO₄·½H₂O + 1½H₂O → CaSO₄·2H₂O (कठोर जिप्सम)।"}}, {"s": "Reactions & Acids-Bases", "a": 0, "en": {"q": "Dilute HCl conducts electricity, but a glucose solution does not, though both compounds contain hydrogen. Why?", "o": ["HCl gives H⁺ ions in water; glucose does not", "Glucose contains more hydrogen than HCl", "HCl is a solid but glucose is a liquid", "Glucose gives OH⁻ ions in water"], "e": "In water, HCl ionises to give H⁺ (H₃O⁺) and Cl⁻ ions, which carry current. Glucose is a covalent compound that does not ionise, so its solution has no free ions. So all acids contain hydrogen, but not all hydrogen compounds are acids.", "r": "Acidic nature = release of H⁺ ions in water, not just the presence of hydrogen."}, "hi": {"q": "तनु HCl विद्युत का चालन करता है, पर ग्लूकोज़ का विलयन नहीं, जबकि दोनों यौगिकों में हाइड्रोजन है। क्यों?", "o": ["HCl पानी में H⁺ आयन देता है; ग्लूकोज़ नहीं", "ग्लूकोज़ में HCl से अधिक हाइड्रोजन है", "HCl ठोस है पर ग्लूकोज़ द्रव है", "ग्लूकोज़ पानी में OH⁻ आयन देता है"], "e": "पानी में HCl आयनित होकर H⁺ (H₃O⁺) और Cl⁻ आयन देता है, जो धारा ले जाते हैं। ग्लूकोज़ सहसंयोजक यौगिक है जो आयनित नहीं होता, अतः उसके विलयन में मुक्त आयन नहीं होते। सभी अम्लों में हाइड्रोजन है, पर हाइड्रोजन वाले सभी यौगिक अम्ल नहीं।", "r": "अम्लीय गुण = पानी में H⁺ आयन मुक्त करना, केवल हाइड्रोजन होना नहीं।"}}, {"s": "Metals & Carbon", "a": 2, "en": {"q": "Zinc blende (ZnS) is an ore of zinc. Which process first converts it into zinc oxide?", "o": ["Calcination in limited air", "Electrolytic refining", "Roasting in excess air", "Reduction with carbon"], "e": "Sulphide ores are heated strongly in excess air (roasting): 2ZnS + 3O₂ → 2ZnO + 2SO₂. Carbonate ores are heated in limited air (calcination). The oxide is then reduced to the metal with carbon.", "r": "Sulphide ore → roasting; carbonate ore → calcination."}, "hi": {"q": "ज़िंक ब्लेंड (ZnS) ज़िंक का एक अयस्क है। कौन-सी प्रक्रिया इसे सबसे पहले ज़िंक ऑक्साइड में बदलती है?", "o": ["सीमित वायु में निस्तापन", "विद्युत अपघटनी परिष्करण", "अधिक वायु में भर्जन", "कार्बन से अपचयन"], "e": "सल्फ़ाइड अयस्कों को अधिक वायु में तेज़ गर्म किया जाता है (भर्जन): 2ZnS + 3O₂ → 2ZnO + 2SO₂। कार्बोनेट अयस्कों को सीमित वायु में गर्म करते हैं (निस्तापन)। फिर ऑक्साइड को कार्बन से धातु में अपचयित करते हैं।", "r": "सल्फ़ाइड अयस्क → भर्जन; कार्बोनेट अयस्क → निस्तापन।"}}, {"s": "Metals & Carbon", "a": 1, "en": {"q": "Most non-metals are poor conductors of electricity. Which of the following non-metals is a good conductor?", "o": ["Sulphur", "Graphite", "Phosphorus", "Iodine"], "e": "In graphite each carbon atom uses only 3 of its 4 valence electrons for bonding. The fourth electron is free to move within the layers, so graphite conducts electricity and is used for electrodes.", "r": "Exceptions: graphite – conducting non-metal; iodine – lustrous non-metal."}, "hi": {"q": "अधिकांश अधातुएँ विद्युत की कुचालक हैं। निम्न में से कौन-सी अधातु सुचालक है?", "o": ["सल्फ़र", "ग्रेफ़ाइट", "फ़ॉस्फ़ोरस", "आयोडीन"], "e": "ग्रेफ़ाइट में हर कार्बन परमाणु अपने 4 में से केवल 3 संयोजी इलेक्ट्रॉन आबंधन में प्रयोग करता है। चौथा इलेक्ट्रॉन परतों में मुक्त रूप से चलता है, इसलिए ग्रेफ़ाइट विद्युत चालन करता है और इलेक्ट्रोड में प्रयुक्त होता है।", "r": "अपवाद: ग्रेफ़ाइट – चालक अधातु; आयोडीन – चमकीली अधातु।"}}, {"s": "Metals & Carbon", "a": 3, "en": {"q": "Which pair of metals will not give hydrogen gas when added to dilute hydrochloric acid?", "o": ["Zinc and iron", "Magnesium and aluminium", "Iron and magnesium", "Copper and silver"], "e": "Only metals placed above hydrogen in the reactivity series can displace hydrogen from dilute acids. Copper and silver lie below hydrogen, so they do not react with dilute HCl.", "r": "Below H in the reactivity series: Cu, Hg, Ag, Au – no H₂ from dilute acids."}, "hi": {"q": "तनु हाइड्रोक्लोरिक अम्ल में डालने पर कौन-सा धातु युग्म हाइड्रोजन गैस नहीं देगा?", "o": ["ज़िंक और लोहा", "मैग्नीशियम और ऐलुमिनियम", "लोहा और मैग्नीशियम", "ताँबा और चाँदी"], "e": "केवल सक्रियता श्रेणी में हाइड्रोजन से ऊपर की धातुएँ तनु अम्लों से हाइड्रोजन विस्थापित कर सकती हैं। ताँबा और चाँदी हाइड्रोजन से नीचे हैं, अतः तनु HCl से क्रिया नहीं करते।", "r": "सक्रियता श्रेणी में H से नीचे: Cu, Hg, Ag, Au – तनु अम्ल से H₂ नहीं।"}}, {"s": "Metals & Carbon", "a": 1, "en": {"q": "A copper wire kept in silver nitrate solution makes the solution turn blue. Which statement explains this?", "o": ["Silver is more reactive and displaces copper", "Copper is more reactive and displaces silver", "Copper and silver form a blue alloy", "Nitrate ions turn blue on standing"], "e": "Copper is above silver in the reactivity series, so it displaces silver: Cu + 2AgNO₃ → Cu(NO₃)₂ + 2Ag. Copper nitrate in solution is blue, and shiny silver deposits on the wire.", "r": "A more reactive metal displaces a less reactive metal from its salt solution."}, "hi": {"q": "सिल्वर नाइट्रेट विलयन में रखा ताँबे का तार विलयन को नीला कर देता है। इसकी व्याख्या कौन-सा कथन करता है?", "o": ["चाँदी अधिक क्रियाशील है और ताँबे को विस्थापित करती है", "ताँबा अधिक क्रियाशील है और चाँदी को विस्थापित करता है", "ताँबा और चाँदी नीली मिश्रधातु बनाते हैं", "नाइट्रेट आयन रखे रहने पर नीले हो जाते हैं"], "e": "सक्रियता श्रेणी में ताँबा चाँदी से ऊपर है, अतः वह चाँदी को विस्थापित करता है: Cu + 2AgNO₃ → Cu(NO₃)₂ + 2Ag। विलयन में कॉपर नाइट्रेट नीला होता है और तार पर चमकीली चाँदी जमती है।", "r": "अधिक क्रियाशील धातु कम क्रियाशील धातु को उसके लवण विलयन से विस्थापित करती है।"}}, {"s": "Reactions & Acids-Bases", "a": 0, "en": {"q": "In the reaction ZnO + C → Zn + CO, which substance is oxidised and which is reduced?", "o": ["C is oxidised; ZnO is reduced", "ZnO is oxidised; C is reduced", "Zn is oxidised; CO is reduced", "Both C and ZnO are oxidised"], "e": "Carbon gains oxygen to form CO, so it is oxidised (and acts as the reducing agent). Zinc oxide loses oxygen to give zinc, so it is reduced (and acts as the oxidising agent).", "r": "Gain of oxygen = oxidation; loss of oxygen = reduction."}, "hi": {"q": "अभिक्रिया ZnO + C → Zn + CO में कौन-सा पदार्थ ऑक्सीकृत और कौन-सा अपचयित होता है?", "o": ["C ऑक्सीकृत; ZnO अपचयित", "ZnO ऑक्सीकृत; C अपचयित", "Zn ऑक्सीकृत; CO अपचयित", "C और ZnO दोनों ऑक्सीकृत"], "e": "कार्बन ऑक्सीजन लेकर CO बनाता है, अतः ऑक्सीकृत होता है (अपचायक)। ज़िंक ऑक्साइड ऑक्सीजन खोकर ज़िंक बनता है, अतः अपचयित होता है (ऑक्सीकारक)।", "r": "ऑक्सीजन जुड़ना = ऑक्सीकरण; ऑक्सीजन निकलना = अपचयन।"}}, {"s": "Reactions & Acids-Bases", "a": 3, "en": {"q": "On heating, lead nitrate gives off brown fumes of nitrogen dioxide. What type of reaction is this?", "o": ["Combination reaction", "Displacement reaction", "Double displacement reaction", "Thermal decomposition reaction"], "e": "2Pb(NO₃)₂ → 2PbO + 4NO₂ + O₂. A single compound breaks down into simpler substances on heating, so it is a thermal decomposition reaction. NO₂ gives the brown fumes.", "r": "One reactant → several products on heating = thermal decomposition."}, "hi": {"q": "गर्म करने पर लेड नाइट्रेट नाइट्रोजन डाइऑक्साइड की भूरी धुआँ छोड़ता है। यह किस प्रकार की अभिक्रिया है?", "o": ["संयोजन अभिक्रिया", "विस्थापन अभिक्रिया", "द्विविस्थापन अभिक्रिया", "तापीय अपघटन अभिक्रिया"], "e": "2Pb(NO₃)₂ → 2PbO + 4NO₂ + O₂। एक यौगिक गर्म करने पर सरल पदार्थों में टूटता है, अतः यह तापीय अपघटन है। NO₂ भूरी धुआँ देती है।", "r": "एक अभिकारक → गर्म करने पर कई उत्पाद = तापीय अपघटन।"}}, {"s": "Reactions & Acids-Bases", "a": 0, "en": {"q": "A chemical equation is balanced so that:", "o": ["the number of atoms of each element is the same on both sides", "the number of molecules is the same on both sides", "the reactants and products have the same physical state", "the total volume of gases is the same on both sides"], "e": "Atoms are neither created nor destroyed in a reaction (law of conservation of mass), so each element must have the same number of atoms on both sides. The number of molecules or the volume of gases can be different.", "r": "Balance by changing coefficients only, never the subscripts of a formula."}, "hi": {"q": "रासायनिक समीकरण को इस प्रकार संतुलित किया जाता है कि:", "o": ["दोनों ओर हर तत्व के परमाणुओं की संख्या समान हो", "दोनों ओर अणुओं की संख्या समान हो", "अभिकारकों और उत्पादों की भौतिक अवस्था समान हो", "दोनों ओर गैसों का कुल आयतन समान हो"], "e": "अभिक्रिया में परमाणु न बनते हैं न नष्ट होते हैं (द्रव्यमान संरक्षण नियम), अतः दोनों ओर हर तत्व के परमाणु समान होने चाहिए। अणुओं की संख्या या गैसों का आयतन भिन्न हो सकता है।", "r": "केवल गुणांक बदलकर संतुलित करें, सूत्र के पादांक कभी नहीं।"}}, {"s": "Metals & Carbon", "a": 2, "en": {"q": "Which of the following hydrocarbons is unsaturated?", "o": ["CH₄", "C₂H₆", "C₃H₆", "C₄H₁₀"], "e": "C₃H₆ fits the general formula CₙH₂ₙ (alkene) and has a C=C double bond, so it is unsaturated. CH₄, C₂H₆ and C₄H₁₀ fit CₙH₂ₙ₊₂ (alkanes) and have only single bonds.", "r": "Alkane CₙH₂ₙ₊₂ (saturated); alkene CₙH₂ₙ and alkyne CₙH₂ₙ₋₂ (unsaturated)."}, "hi": {"q": "निम्न में से कौन-सा हाइड्रोकार्बन असंतृप्त है?", "o": ["CH₄", "C₂H₆", "C₃H₆", "C₄H₁₀"], "e": "C₃H₆ सामान्य सूत्र CₙH₂ₙ (ऐल्कीन) में आता है और इसमें C=C द्विआबंध है, अतः असंतृप्त है। CH₄, C₂H₆ और C₄H₁₀ CₙH₂ₙ₊₂ (ऐल्केन) हैं, केवल एकल आबंध वाले।", "r": "ऐल्केन CₙH₂ₙ₊₂ (संतृप्त); ऐल्कीन CₙH₂ₙ और ऐल्काइन CₙH₂ₙ₋₂ (असंतृप्त)।"}}, {"s": "Metals & Carbon", "a": 1, "en": {"q": "Graphite is used as a dry lubricant in machines. Which structural feature makes this possible?", "o": ["Each carbon is bonded to four others in a rigid network", "Its layers are held by weak forces and slide easily", "It has free ions that move through the solid", "Its atoms form a hollow football-shaped cage"], "e": "In graphite, carbon atoms form hexagonal layers. The layers are held together by weak forces, so they slide over one another easily, making graphite soft and slippery. Option (a) describes diamond and (d) describes fullerene.", "r": "Diamond – 4 bonds, hardest; graphite – 3 bonds, layers, slippery, conductor."}, "hi": {"q": "ग्रेफ़ाइट मशीनों में शुष्क स्नेहक के रूप में प्रयुक्त होता है। कौन-सी संरचनात्मक विशेषता इसे संभव बनाती है?", "o": ["हर कार्बन चार अन्य से दृढ़ जाल में जुड़ा है", "इसकी परतें दुर्बल बलों से जुड़ी हैं और आसानी से फिसलती हैं", "इसमें मुक्त आयन हैं जो ठोस में चलते हैं", "इसके परमाणु खोखला फ़ुटबॉल जैसा पिंजरा बनाते हैं"], "e": "ग्रेफ़ाइट में कार्बन परमाणु षट्कोणीय परतें बनाते हैं। परतें दुर्बल बलों से जुड़ी होती हैं, इसलिए आसानी से एक-दूसरे पर फिसलती हैं और ग्रेफ़ाइट मुलायम व चिकना होता है। विकल्प (a) हीरे और (d) फ़ुलरीन का वर्णन है।", "r": "हीरा – 4 आबंध, सबसे कठोर; ग्रेफ़ाइट – 3 आबंध, परतें, चिकना, चालक।"}}, {"s": "Matter & Periodic Table", "a": 2, "en": {"q": "Which of the following is a colloid?", "o": ["Common salt solution", "Sugar solution", "Milk", "Copper sulphate solution"], "e": "Milk is an emulsion – a colloid of tiny fat droplets dispersed in water. It shows the Tyndall effect. Salt, sugar and copper sulphate solutions are true solutions with particles smaller than 1 nm.", "r": "Colloid examples: milk, fog, smoke, jelly, butter, blood."}, "hi": {"q": "निम्न में से कौन-सा कोलॉइड है?", "o": ["साधारण नमक का विलयन", "चीनी का विलयन", "दूध", "कॉपर सल्फेट का विलयन"], "e": "दूध एक पायस है – पानी में परिक्षिप्त सूक्ष्म वसा बूँदों का कोलॉइड। यह टिंडल प्रभाव दिखाता है। नमक, चीनी और कॉपर सल्फेट के विलयन वास्तविक विलयन हैं जिनके कण 1 nm से छोटे हैं।", "r": "कोलॉइड उदाहरण: दूध, कोहरा, धुआँ, जेली, मक्खन, रक्त।"}}, {"s": "Matter & Periodic Table", "a": 0, "en": {"q": "Moving down group 1 from lithium to caesium, what happens to metallic character?", "o": ["It increases", "It decreases", "It first increases, then decreases", "It remains the same"], "e": "Down a group, a new shell is added at each step, so the atomic size increases and the outermost electron is held less tightly. The atom loses electrons more easily, so metallic character increases.", "r": "Down a group: size ↑, metallic character ↑; across a period: size ↓, metallic character ↓."}, "hi": {"q": "समूह 1 में लीथियम से सीज़ियम की ओर नीचे जाने पर धात्विक गुण का क्या होता है?", "o": ["बढ़ता है", "घटता है", "पहले बढ़ता है, फिर घटता है", "समान रहता है"], "e": "समूह में नीचे हर चरण में एक नया कोश जुड़ता है, अतः परमाणु का आकार बढ़ता है और बाहरी इलेक्ट्रॉन कम मज़बूती से बँधा रहता है। परमाणु आसानी से इलेक्ट्रॉन खोता है, अतः धात्विक गुण बढ़ता है।", "r": "समूह में नीचे: आकार ↑, धात्विक गुण ↑; आवर्त में आगे: आकार ↓, धात्विक गुण ↓।"}}, {"s": "Matter & Periodic Table", "a": 3, "en": {"q": "Camphor kept in an open dish slowly disappears without leaving any residue. This is because camphor:", "o": ["melts and soaks into the dish", "reacts with oxygen in the air", "dissolves in the moisture of air", "changes directly from solid to vapour"], "e": "Camphor sublimes: it changes directly from the solid state to vapour without becoming a liquid. Naphthalene balls, ammonium chloride, iodine and dry ice also sublime.", "r": "Sublimation: solid → gas directly (camphor, naphthalene, NH₄Cl, iodine, dry ice)."}, "hi": {"q": "खुली प्लेट में रखा कपूर बिना कोई अवशेष छोड़े धीरे-धीरे गायब हो जाता है। इसका कारण है कि कपूर:", "o": ["पिघलकर प्लेट में सोख लिया जाता है", "वायु की ऑक्सीजन से क्रिया करता है", "वायु की नमी में घुल जाता है", "ठोस से सीधे वाष्प में बदल जाता है"], "e": "कपूर ऊर्ध्वपातित होता है: वह द्रव बने बिना सीधे ठोस से वाष्प बनता है। नेफ़्थलीन की गोलियाँ, अमोनियम क्लोराइड, आयोडीन और शुष्क बर्फ़ भी ऊर्ध्वपातित होते हैं।", "r": "ऊर्ध्वपातन: ठोस → सीधे गैस (कपूर, नेफ़्थलीन, NH₄Cl, आयोडीन, शुष्क बर्फ़)।"}}];
const T={en:{start:'Choose a mode',test:'Test mode',testd:'Timed exam: '+META.mins+' min, +1 / −1/3, result and solutions at the end.',prac:'Practice mode',pracd:'No timer. See the answer and explanation right after each question.',rules:['1 mark for a correct answer, 1/3 mark deducted for a wrong one, 0 for skipped.','The test submits automatically when time runs out.','Switch between English and हिंदी at any time.'],q:'Question',prev:'← Previous',next:'Next →',clear:'Clear',submit:'Submit test',confirm:'Submit the test now?',res:'Result',sc:'Score',cor:'Correct',wr:'Wrong',sk:'Skipped',acc:'Accuracy',secw:'Section-wise',secn:'Section',all:'All',sol:'Solutions',ans:'Answer',rem:'Remember: ',your:'Your answer',retry:'Try again',home:'Home',pscore:'Practice score',finish:'Finish',skipped:'Not answered',pal:'Question palette'},
hi:{start:'मोड चुनें',test:'टेस्ट मोड',testd:'समयबद्ध परीक्षा: '+META.mins+' मिनट, +1 / −1/3, अंत में परिणाम और हल।',prac:'प्रैक्टिस मोड',pracd:'कोई टाइमर नहीं। हर प्रश्न के बाद तुरंत उत्तर और व्याख्या देखें।',rules:['सही उत्तर पर 1 अंक, गलत पर 1/3 अंक कटेगा, छोड़े गए पर 0।','समय समाप्त होते ही टेस्ट अपने आप सबमिट होगा।','कभी भी English और हिंदी के बीच बदलें।'],q:'प्रश्न',prev:'← पिछला',next:'अगला →',clear:'हटाएँ',submit:'टेस्ट सबमिट करें',confirm:'क्या अभी टेस्ट सबमिट करें?',res:'परिणाम',sc:'अंक',cor:'सही',wr:'गलत',sk:'छोड़े',acc:'सटीकता',secw:'खंडवार',secn:'खंड',all:'सभी',sol:'हल',ans:'उत्तर',rem:'याद रखें: ',your:'आपका उत्तर',retry:'फिर से प्रयास',home:'होम',pscore:'प्रैक्टिस स्कोर',finish:'समाप्त',skipped:'उत्तर नहीं दिया',pal:'प्रश्न पैलेट'}};
const SECHI={'Atom & Mole Concept':'परमाणु और मोल संकल्पना','Reactions & Acids-Bases':'अभिक्रियाएँ और अम्ल-क्षारक','Metals & Carbon':'धातुएँ और कार्बन','Matter & Periodic Table':'पदार्थ और आवर्त सारणी'};
let L='en',mode=null,cur=0,resp=[],done=false,left=META.mins*60,tick=null,filt='all';
const $=s=>document.querySelector(s),app=$('#app');
const t=k=>T[L][k],sec=s=>L==='hi'?(SECHI[s]||s):s,K='abcd';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function setLang(x){L=x;$('#lEN').classList.toggle('on',x==='en');$('#lHI').classList.toggle('on',x==='hi');document.documentElement.lang=x;render()}
$('#lEN').onclick=()=>setLang('en');$('#lHI').onclick=()=>setLang('hi');
function home(){mode=null;done=false;clearInterval(tick);$('#timer').classList.add('hide');render()}
function start(m){mode=m;cur=0;resp=Array(Q.length).fill(null);done=false;filt='all';clearInterval(tick);$('#timer').classList.add('hide');
 if(m==='test'){left=META.mins*60;$('#timer').classList.remove('hide');showTime();tick=setInterval(()=>{left--;showTime();if(left<=0){finish()}},1000)}
 render();window.scrollTo(0,0)}
function showTime(){const m=Math.max(0,Math.floor(left/60)),s=Math.max(0,left%60);$('#timer').textContent='⏱ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function finish(){done=true;clearInterval(tick);$('#timer').classList.add('hide');render();window.scrollTo(0,0)}
function stats(){let c=0,w=0,s=0,by={};Q.forEach((q,i)=>{const b=by[q.s]=by[q.s]||{n:0,c:0,w:0};b.n++;if(resp[i]===null){s++}else if(resp[i]===q.a){c++;b.c++}else{w++;b.w++}});return{c,w,s,by,score:+(c-w/3).toFixed(2)}}
function qcard(i,showAns,tag){const q=Q[i],d=q[L],r=resp[i];
 let h=`<div class="card"><div class="qhead"><span class="qno">${t('q')} ${i+1} / ${Q.length}</span><span>${tag||''} <span class="sec">${sec(q.s)}</span></span></div><div class="qt">${esc(d.q)}</div>`;
 d.o.forEach((o,j)=>{let c='';if(showAns){if(j===q.a)c='ok';else if(r===j)c='bad'}else if(r===j)c='sel';
  h+=`<button class="opt ${c}" data-j="${j}" ${showAns?'disabled':''}><span class="k">(${K[j]})</span><span>${esc(o)}</span></button>`});
 if(showAns)h+=`<div class="exp"><b>${t('ans')}: (${K[q.a]})</b> ${esc(d.e)}<div class="rm">💡 ${t('rem')}${esc(d.r)}</div></div>`;
 return h+'</div>'}
function render(){
 if(!mode){app.innerHTML=`<div class="card"><div class="sub">${META.kicker}</div><h1>${META.title}</h1><div class="sub">${L==='hi'?META.subhi:META.sub}</div>
 <div class="chips"><span>${Q.length} Qs</span><span>⏱ ${META.mins} min</span><span>+1 / −1/3</span><span>EN | हिंदी</span></div>
 <h2>${t('start')}</h2><div class="modes"><button class="mode" id="mT"><b>📝 ${t('test')}</b>${t('testd')}</button><button class="mode" id="mP"><b>🎯 ${t('prac')}</b>${t('pracd')}</button></div>
 <ul class="rules">${t('rules').map(x=>'<li>'+x+'</li>').join('')}</ul></div>`;$('#mT').onclick=()=>start('test');$('#mP').onclick=()=>start('prac');return}
 if(done)return result();
 const showAns=mode==='prac'&&resp[cur]!==null;
 let h=qcard(cur,showAns);
 h+=`<div class="nav"><button class="btn s" id="bP" ${cur===0?'disabled':''}>${t('prev')}</button>`+(mode==='test'?`<button class="btn s" id="bC">${t('clear')}</button>`:'')+(cur<Q.length-1?`<button class="btn p" id="bN">${t('next')}</button>`:`<button class="btn d" id="bF">${mode==='test'?t('submit'):t('finish')}</button>`)+`</div>`;
 h+=`<div class="card" style="margin-top:14px"><div class="qhead"><b>${t('pal')}</b>`+(mode==='prac'?`<span class="sec">${t('pscore')}: ${stats().score}</span>`:'')+`</div><div class="pal">${Q.map((q,i)=>{let c='';if(mode==='prac'&&resp[i]!==null)c=resp[i]===q.a?'ok':'bad';else if(resp[i]!==null)c='ans';return `<button class="${c} ${i===cur?'cur':''}" data-i="${i}">${i+1}</button>`}).join('')}</div>`+(mode==='test'?`<div class="nav"><span></span><button class="btn d" id="bS">${t('submit')}</button></div>`:'')+`</div>`;
 app.innerHTML=h;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(mode==='prac'&&resp[cur]!==null)return;resp[cur]=+b.dataset.j;render()});
 app.querySelectorAll('.pal button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render()});
 const go=d=>{cur+=d;render();window.scrollTo(0,0)};
 if($('#bP'))$('#bP').onclick=()=>go(-1);if($('#bN'))$('#bN').onclick=()=>go(1);
 if($('#bC'))$('#bC').onclick=()=>{resp[cur]=null;render()};
 const sub=()=>{if(confirm(t('confirm')))finish()};
 if($('#bS'))$('#bS').onclick=sub;
 if($('#bF'))$('#bF').onclick=mode==='test'?sub:()=>finish();
}
function result(){const st=stats(),att=st.c+st.w,acc=att?Math.round(st.c/att*100):0;
 let h=`<div class="card"><h2>${t('res')} · ${META.title}</h2><div class="score"><div><b>${st.score} / ${Q.length}</b>${t('sc')}</div><div><b style="color:var(--ok)">${st.c}</b>${t('cor')}</div><div><b style="color:var(--bad)">${st.w}</b>${t('wr')}</div><div><b>${st.s}</b>${t('sk')}</div></div>
 <p class="sub">${t('acc')}: ${acc}%</p><h2>${t('secw')}</h2><table><tr><th>${t('secn')}</th><th>Qs</th><th>${t('cor')}</th><th>${t('wr')}</th><th>${t('sc')}</th></tr>${Object.entries(st.by).map(([k,b])=>`<tr><td>${sec(k)}</td><td>${b.n}</td><td>${b.c}</td><td>${b.w}</td><td>${+(b.c-b.w/3).toFixed(2)}</td></tr>`).join('')}</table>
 <div class="nav"><button class="btn p" id="bR">${t('retry')}</button><button class="btn s" id="bH">${t('home')}</button></div></div>
 <div class="card"><h2>${t('sol')}</h2><div class="filters">${[['all',t('all')],['ok',t('cor')],['bad',t('wr')],['sk',t('sk')]].map(([k,n])=>`<button data-f="${k}" class="${filt===k?'on':''}">${n}</button>`).join('')}</div></div>`;
 Q.forEach((q,i)=>{const r=resp[i],s2=r===null?'sk':(r===q.a?'ok':'bad');if(filt!=='all'&&filt!==s2)return;
  const tg=s2==='ok'?`<span class="tag ok">✔ ${t('cor')}</span>`:s2==='bad'?`<span class="tag bad">✘ ${t('your')}: (${K[r]})</span>`:`<span class="tag sk">${t('skipped')}</span>`;
  h+=qcard(i,true,tg)});
 app.innerHTML=h;$('#bR').onclick=()=>start(mode);$('#bH').onclick=home;
 app.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filt=b.dataset.f;render()})}
render();
</script></body></html>
