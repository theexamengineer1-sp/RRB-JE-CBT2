cos 30° = 0.866, cos 45° = 0.707, cos 60° = 0.5।"}}, {"s": "Mechanics", "a": 3, "en": {"q": "A pump lifts 300 kg of water into a tank 10 m high in 1 minute. If the pump is 75% efficient, the power it draws is about (g = 10 m/s²):", "o": ["375 W", "500 W", "750 W", "667 W"], "e": "Useful output power = mgh/t = 300 × 10 × 10 / 60 = 500 W. Input power = output / efficiency = 500 / 0.75 ≈ 667 W.", "r": "Efficiency = output / input, so input is always more than output."}, "hi": {"q": "एक पंप 1 मिनट में 300 kg पानी को 10 m ऊँची टंकी तक पहुँचाता है। यदि पंप की दक्षता 75% है, तो वह लगभग कितनी शक्ति लेता है? (g = 10 m/s²)", "o": ["375 W", "500 W", "750 W", "667 W"], "e": "उपयोगी निर्गत शक्ति = mgh/t = 300 × 10 × 10 / 60 = 500 W। निवेशी शक्ति = निर्गत / दक्षता = 500 / 0.75 ≈ 667 W।", "r": "दक्षता = निर्गत / निवेश, इसलिए निवेश सदैव निर्गत से अधिक।"}}, {"s": "Mechanics", "a": 0, "en": {"q": "A boy carries his schoolbag up the stairs to the first floor. The work done by him on the bag against gravity is:", "o": ["positive, since the bag is raised", "zero, since he walks at uniform speed", "negative, since gravity acts downward", "zero, since the bag is held still"], "e": "He applies an upward force on the bag and the bag moves upward through the height of the floor, so the work done against gravity is positive (= mgh).", "r": "Work against gravity is zero only when there is no vertical displacement (walking on level ground)."}, "hi": {"q": "एक लड़का अपना स्कूल बैग लेकर सीढ़ियों से पहली मंज़िल तक चढ़ता है। गुरुत्व के विरुद्ध बैग पर उसके द्वारा किया गया कार्य है:", "o": ["धनात्मक, क्योंकि बैग ऊपर उठा", "शून्य, क्योंकि वह एकसमान चाल से चलता है", "ऋणात्मक, क्योंकि गुरुत्व नीचे लगता है", "शून्य, क्योंकि बैग स्थिर पकड़ा है"], "e": "वह बैग पर ऊपर की ओर बल लगाता है और बैग मंज़िल की ऊँचाई तक ऊपर जाता है, अतः गुरुत्व के विरुद्ध कार्य धनात्मक (= mgh) है।", "r": "गुरुत्व के विरुद्ध कार्य तभी शून्य जब ऊर्ध्वाधर विस्थापन न हो (समतल पर चलना)।"}}, {"s": "Mechanics", "a": 2, "en": {"q": "When a moving car brakes and comes to a stop, most of its kinetic energy changes into:", "o": ["chemical energy in the fuel", "potential energy of the car", "heat in the brakes and tyres", "electrical energy in the battery"], "e": "Friction between the brake pads and the wheels (and between tyres and road) converts the kinetic energy mainly into heat. Brakes become hot after a long downhill ride.", "r": "Energy is never lost; friction converts it into heat."}, "hi": {"q": "चलती कार ब्रेक लगाकर रुकती है, तो उसकी अधिकांश गतिज ऊर्जा किसमें बदल जाती है?", "o": ["ईंधन की रासायनिक ऊर्जा", "कार की स्थितिज ऊर्जा", "ब्रेक और टायरों में ऊष्मा", "बैटरी की विद्युत ऊर्जा"], "e": "ब्रेक पैड और पहियों (तथा टायर और सड़क) के बीच घर्षण गतिज ऊर्जा को मुख्यतः ऊष्मा में बदल देता है। लंबी ढलान के बाद ब्रेक गर्म हो जाते हैं।", "r": "ऊर्जा नष्ट नहीं होती; घर्षण उसे ऊष्मा में बदल देता है।"}}, {"s": "Sound & Matter", "a": 1, "en": {"q": "A ship's sonar sends ultrasound of frequency 50 kHz into sea water, where sound travels at 1500 m/s. The wavelength of this ultrasound is:", "o": ["30 cm", "3 cm", "0.3 cm", "7.5 cm"], "e": "λ = v / f = 1500 / 50,000 = 0.03 m = 3 cm.", "r": "Convert kHz to Hz before using v = f λ."}, "hi": {"q": "एक जहाज़ का सोनार 50 kHz आवृत्ति की पराश्रव्य तरंग समुद्री जल में भेजता है, जहाँ ध्वनि की चाल 1500 m/s है। इस तरंग की तरंगदैर्ध्य है:", "o": ["30 cm", "3 cm", "0.3 cm", "7.5 cm"], "e": "λ = v / f = 1500 / 50,000 = 0.03 m = 3 cm।", "r": "v = f λ लगाने से पहले kHz को Hz में बदलें।"}}, {"s": "Sound & Matter", "a": 2, "en": {"q": "Two guitar strings are plucked, and one gives a higher pitch. Compared with the other, that string vibrates with a greater:", "o": ["amplitude", "wavelength in air", "frequency", "speed in air"], "e": "Pitch depends on frequency: higher frequency gives a higher (shriller) pitch. Amplitude decides loudness, and the speed of sound in air is the same for both.", "r": "Pitch ↔ frequency, loudness ↔ amplitude, quality ↔ waveform."}, "hi": {"q": "गिटार के दो तार छेड़े जाते हैं और एक का तारत्व अधिक है। दूसरे की तुलना में वह तार अधिक किसके साथ कंपन करता है?", "o": ["आयाम", "वायु में तरंगदैर्ध्य", "आवृत्ति", "वायु में चाल"], "e": "तारत्व आवृत्ति पर निर्भर करता है: अधिक आवृत्ति = अधिक (तीखा) तारत्व। आयाम प्रबलता तय करता है, और वायु में ध्वनि की चाल दोनों के लिए समान है।", "r": "तारत्व ↔ आवृत्ति, प्रबलता ↔ आयाम, गुणता ↔ तरंग का रूप।"}}, {"s": "Light", "a": 1, "en": {"q": "In a scooter's rear-view mirror, the image of a car coming from behind is always:", "o": ["real, inverted and diminished", "virtual, erect and diminished", "virtual, erect and enlarged", "real, erect and same size"], "e": "Rear-view mirrors are convex. A convex mirror always forms a virtual, erect and diminished image between the pole and the focus, and gives a wide field of view.", "r": "Convex mirror image: always virtual, erect, diminished – for every object position."}, "hi": {"q": "स्कूटर के पश्च-दृश्य दर्पण में पीछे से आ रही कार का प्रतिबिंब सदैव होता है:", "o": ["वास्तविक, उल्टा और छोटा", "आभासी, सीधा और छोटा", "आभासी, सीधा और बड़ा", "वास्तविक, सीधा और समान आकार"], "e": "पश्च-दृश्य दर्पण उत्तल होता है। उत्तल दर्पण सदैव ध्रुव और फोकस के बीच आभासी, सीधा और छोटा प्रतिबिंब बनाता है और दृष्टि-क्षेत्र बड़ा देता है।", "r": "उत्तल दर्पण: हर स्थिति में आभासी, सीधा, छोटा प्रतिबिंब।"}}, {"s": "Light", "a": 0, "en": {"q": "Two convex lenses are made of the same glass. Their focal lengths are 10 cm and 25 cm. Which statement is correct?", "o": ["The 10 cm lens is more curved and more powerful", "The 25 cm lens is more curved and more powerful", "Both have equal power, being the same glass", "The 10 cm lens is less curved but more powerful"], "e": "A more strongly curved lens bends light more and has a shorter focal length. P = 100/f: the 10 cm lens has +10 D, the 25 cm lens has +4 D.", "r": "More curvature → shorter focal length → greater power."}, "hi": {"q": "एक ही काँच से बने दो उत्तल लेंसों की फोकस दूरियाँ 10 cm और 25 cm हैं। कौन-सा कथन सही है?", "o": ["10 cm वाला अधिक वक्रित और अधिक क्षमता वाला है", "25 cm वाला अधिक वक्रित और अधिक क्षमता वाला है", "एक ही काँच होने से दोनों की क्षमता समान है", "10 cm वाला कम वक्रित पर अधिक क्षमता वाला है"], "e": "अधिक वक्रित लेंस प्रकाश को अधिक मोड़ता है और उसकी फोकस दूरी कम होती है। P = 100/f: 10 cm वाला +10 D, 25 cm वाला +4 D।", "r": "अधिक वक्रता → कम फोकस दूरी → अधिक क्षमता।"}}, {"s": "Light", "a": 3, "en": {"q": "A reading lens of power +4 D is replaced by a lens of focal length 20 cm. The power of the new lens is:", "o": ["+4 D", "+0.2 D", "+2 D", "+5 D"], "e": "P = 100 / f (in cm) = 100 / 20 = +5 D. (The old lens had f = 100/4 = 25 cm.)", "r": "Use f in metres (P = 1/f) or in cm (P = 100/f)."}, "hi": {"q": "+4 D क्षमता वाले पढ़ने के लेंस को 20 cm फोकस दूरी वाले लेंस से बदला जाता है। नए लेंस की क्षमता है:", "o": ["+4 D", "+0.2 D", "+2 D", "+5 D"], "e": "P = 100 / f (cm में) = 100 / 20 = +5 D। (पुराने लेंस की f = 100/4 = 25 cm थी।)", "r": "f मीटर में (P = 1/f) या cm में (P = 100/f) लें।"}}, {"s": "Light", "a": 1, "en": {"q": "A coin lies at the bottom of a bucket filled with water to a depth of 60 cm. The refractive index of water is 4/3. The coin appears to be at a depth of:", "o": ["80 cm", "45 cm", "60 cm", "30 cm"], "e": "Apparent depth = real depth ÷ refractive index = 60 ÷ (4/3) = 45 cm. Light bends away from the normal as it leaves water, so the coin looks raised.", "r": "Objects under water look shallower – the reason a lifeguard must not dive at the apparent position."}, "hi": {"q": "एक बाल्टी में 60 cm गहराई तक पानी भरा है और तली में एक सिक्का पड़ा है। पानी का अपवर्तनांक 4/3 है। सिक्का कितनी गहराई पर दिखाई देगा?", "o": ["80 cm", "45 cm", "60 cm", "30 cm"], "e": "आभासी गहराई = वास्तविक गहराई ÷ अपवर्तनांक = 60 ÷ (4/3) = 45 cm। पानी से निकलते समय प्रकाश अभिलंब से दूर मुड़ता है, इसलिए सिक्का ऊपर उठा दिखता है।", "r": "पानी के अंदर की वस्तुएँ उथली दिखती हैं – इसीलिए लाइफ़गार्ड आभासी स्थिति पर गोता नहीं लगाता।"}}, {"s": "Light", "a": 0, "en": {"q": "A convex lens forms a virtual and erect image of an object. Using the Cartesian sign convention, the signs of the object distance (u) and the image distance (v) are:", "o": ["both negative", "both positive", "u negative, v positive", "u positive, v negative"], "e": "A real object is always on the left, so u is negative. A virtual image formed by a convex lens lies on the same side as the object, so v is also negative.", "r": "Lens: real image → v positive; virtual image → v negative. u is always negative."}, "hi": {"q": "एक उत्तल लेंस किसी वस्तु का आभासी और सीधा प्रतिबिंब बनाता है। कार्तीय चिह्न परिपाटी के अनुसार वस्तु दूरी (u) और प्रतिबिंब दूरी (v) के चिह्न हैं:", "o": ["दोनों ऋणात्मक", "दोनों धनात्मक", "u ऋणात्मक, v धनात्मक", "u धनात्मक, v ऋणात्मक"], "e": "वास्तविक वस्तु सदैव बाईं ओर होती है, अतः u ऋणात्मक। उत्तल लेंस का आभासी प्रतिबिंब वस्तु की ओर ही बनता है, अतः v भी ऋणात्मक।", "r": "लेंस: वास्तविक प्रतिबिंब → v धनात्मक; आभासी → v ऋणात्मक। u सदैव ऋणात्मक।"}}, {"s": "Light", "a": 2, "en": {"q": "An elderly person needs a convex lens to read a newspaper and a concave lens to see distant objects. The defect and the correct remedy are:", "o": ["myopia; concave lens only", "hypermetropia; convex lens only", "presbyopia; bifocal lens", "astigmatism; cylindrical lens"], "e": "With age the ciliary muscles weaken and the eye lens loses flexibility (presbyopia). When both near and far vision are affected, a bifocal lens is used: the upper part is concave, the lower part convex.", "r": "Bifocal = myopia + hypermetropia together, usually in old age."}, "hi": {"q": "एक वृद्ध व्यक्ति को अख़बार पढ़ने के लिए उत्तल लेंस और दूर की वस्तुएँ देखने के लिए अवतल लेंस चाहिए। दोष और सही उपचार हैं:", "o": ["निकटदृष्टि; केवल अवतल लेंस", "दीर्घदृष्टि; केवल उत्तल लेंस", "जरादूरदृष्टिता; द्विफोकसी लेंस", "अबिंदुकता; बेलनाकार लेंस"], "e": "उम्र के साथ पक्ष्माभी पेशियाँ कमज़ोर होती हैं और नेत्र लेंस का लचीलापन घटता है (जरादूरदृष्टिता)। जब निकट और दूर दोनों दृष्टि प्रभावित हों, तो द्विफोकसी लेंस: ऊपरी भाग अवतल, निचला उत्तल।", "r": "द्विफोकसी = निकटदृष्टि + दीर्घदृष्टि एक साथ, प्रायः वृद्धावस्था में।"}}, {"s": "Light", "a": 3, "en": {"q": "In a rainbow, red appears on the outer edge and violet on the inner edge. The colours get separated because:", "o": ["the drops absorb blue light more strongly", "red travels slower than violet in water", "clouds reflect each colour at a different height", "each colour bends by a different amount in the drops"], "e": "Water drops refract and disperse sunlight. The refractive index is different for different colours (wavelengths), so each colour bends by a different angle; internal reflection then sends them back to the observer.", "r": "Rainbow = refraction + dispersion + internal reflection; seen with the Sun behind you."}, "hi": {"q": "इंद्रधनुष में बाहरी किनारे पर लाल और भीतरी किनारे पर बैंगनी रंग दिखता है। रंग अलग होते हैं क्योंकि:", "o": ["बूँदें नीला प्रकाश अधिक सोखती हैं", "पानी में लाल रंग बैंगनी से धीमा चलता है", "बादल हर रंग को अलग ऊँचाई पर परावर्तित करते हैं", "बूँदों में हर रंग अलग मात्रा में मुड़ता है"], "e": "पानी की बूँदें सूर्य प्रकाश का अपवर्तन और वर्ण-विक्षेपण करती हैं। अलग-अलग रंगों (तरंगदैर्ध्यों) का अपवर्तनांक अलग होता है, इसलिए हर रंग अलग कोण पर मुड़ता है; फिर आंतरिक परावर्तन उन्हें प्रेक्षक तक लौटाता है।", "r": "इंद्रधनुष = अपवर्तन + वर्ण-विक्षेपण + आंतरिक परावर्तन; सूर्य पीछे हो तब दिखता है।"}}, {"s": "Light", "a": 0, "en": {"q": "Stars twinkle at night, but planets do not. The main reason is that:", "o": ["stars are point-sized sources, so air refraction flickers their light", "planets give out their own light, but stars only reflect light", "planets are much farther from the Earth than the stars are", "stars move across the night sky much faster than planets"], "e": "Starlight passes through moving air layers of changing density, so atmospheric refraction keeps changing its path and brightness. A star is a point source, so the flicker is noticeable. A planet is an extended source; the variations average out.", "r": "Twinkling, advance sunrise and a star's raised position are all due to atmospheric refraction."}, "hi": {"q": "रात में तारे टिमटिमाते हैं, पर ग्रह नहीं। इसका मुख्य कारण है कि:", "o": ["तारे बिंदु स्रोत हैं, इसलिए वायु में अपवर्तन उनका प्रकाश हिलाता है", "ग्रह स्वयं प्रकाश देते हैं, पर तारे केवल प्रकाश परावर्तित करते हैं", "ग्रह पृथ्वी से तारों की तुलना में बहुत अधिक दूर हैं", "तारे रात के आकाश में ग्रहों से बहुत तेज़ी से चलते हैं"], "e": "तारे का प्रकाश बदलते घनत्व वाली गतिशील वायु परतों से गुजरता है, इसलिए वायुमंडलीय अपवर्तन उसके पथ और चमक को बदलता रहता है। तारा बिंदु स्रोत है, अतः टिमटिमाना दिखता है; ग्रह विस्तृत स्रोत है, उतार-चढ़ाव औसत हो जाते हैं।", "r": "टिमटिमाना, सूर्योदय का पहले दिखना और तारे का ऊपर दिखना – सब वायुमंडलीय अपवर्तन से।"}}, {"s": "Electricity & Magnetism", "a": 1, "en": {"q": "The length of a wire is tripled and its area of cross-section is doubled, the material remaining the same. Its new resistance is how many times the old one?", "o": ["6 times", "1.5 times", "0.67 times", "3 times"], "e": "R = ρL/A, so R ∝ L/A. New R = (3L)/(2A) × ρ = 3/2 of the old value = 1.5 times. Resistivity does not change because the material is the same.", "r": "Resistivity depends only on the material and temperature, not on length or area."}, "hi": {"q": "एक तार की लंबाई तीन गुना और अनुप्रस्थ काट का क्षेत्रफल दोगुना कर दिया जाता है, पदार्थ वही रहता है। नया प्रतिरोध पुराने का कितना गुना है?", "o": ["6 गुना", "1.5 गुना", "0.67 गुना", "3 गुना"], "e": "R = ρL/A, अतः R ∝ L/A। नया R = (3L)/(2A) × ρ = पुराने का 3/2 = 1.5 गुना। पदार्थ वही है, इसलिए प्रतिरोधकता नहीं बदलती।", "r": "प्रतिरोधकता केवल पदार्थ और ताप पर निर्भर, लंबाई या क्षेत्रफल पर नहीं।"}}, {"s": "Electricity & Magnetism", "a": 2, "en": {"q": "Two room heaters are rated 1000 W, 220 V and 2000 W, 220 V. Which statement about their resistances is correct?", "o": ["The 1000 W heater has half the resistance", "Both have equal resistance at 220 V", "The 2000 W heater has half the resistance", "The 2000 W heater has doubl
