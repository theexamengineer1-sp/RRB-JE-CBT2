<script>
const META={"title": "RRB JE CBT-2 · Physics · Mixed Set 3", "kicker": "THE EXAM ENGINEER · CBT-2 Physics Series", "sub": "25 most-likely questions based on RRB JE PYQs (CBT-1 & CBT-2 pattern).", "subhi": "RRB JE PYQs (CBT-1 और CBT-2 पैटर्न) पर आधारित 25 सर्वाधिक संभावित प्रश्न।", "mins": 25};
const Q=[{"s": "Mechanics", "a": 1, "en": {"q": "A car moving at 72 km/h applies its brakes and comes to rest with uniform retardation in 4 s. How far does the car travel after the brakes are applied?", "o": ["80 m", "40 m", "20 m", "160 m"], "e": "72 km/h = 20 m/s. With uniform retardation, average speed = (20 + 0)/2 = 10 m/s. Distance = 10 × 4 = 40 m. (Also: a = −5 m/s², s = 20 × 4 − ½ × 5 × 16 = 40 m.)", "r": "km/h × 5/18 = m/s; for uniform change, distance = average speed × time."}, "hi": {"q": "72 km/h से चलती एक कार ब्रेक लगाती है और एकसमान मंदन से 4 s में रुक जाती है। ब्रेक लगाने के बाद कार कितनी दूरी तय करती है?", "o": ["80 m", "40 m", "20 m", "160 m"], "e": "72 km/h = 20 m/s। एकसमान मंदन में औसत चाल = (20 + 0)/2 = 10 m/s। दूरी = 10 × 4 = 40 m। (या: a = −5 m/s², s = 20 × 4 − ½ × 5 × 16 = 40 m।)", "r": "km/h × 5/18 = m/s; एकसमान परिवर्तन में दूरी = औसत चाल × समय।"}}, {"s": "Mechanics", "a": 0, "en": {"q": "A tourist bus covers exactly 2 km in every 3 minutes, but the hill road has many sharp curves. Which statement about the bus's motion is correct?", "o": ["Its speed is uniform, but its velocity keeps changing", "Both its speed and its velocity are uniform", "Its velocity is uniform, but its speed changes", "Neither speed nor velocity has any fixed value"], "e": "Equal distances in equal time intervals mean uniform speed. On the curves the direction of motion keeps changing, so the velocity (speed with direction) changes – the motion is accelerated.", "r": "Uniform speed + changing direction = non-uniform velocity (e.g. uniform circular motion)."}, "hi": {"q": "एक पर्यटक बस हर 3 मिनट में ठीक 2 km तय करती है, पर पहाड़ी सड़क पर कई तीखे मोड़ हैं। बस की गति के बारे में कौन-सा कथन सही है?", "o": ["उसकी चाल एकसमान है, पर वेग बदलता रहता है", "उसकी चाल और वेग दोनों एकसमान हैं", "उसका वेग एकसमान है, पर चाल बदलती है", "न चाल और न वेग का कोई निश्चित मान है"], "e": "समान समय में समान दूरी का अर्थ एकसमान चाल। मोड़ों पर गति की दिशा बदलती रहती है, अतः वेग (दिशा सहित चाल) बदलता है – गति त्वरित है।", "r": "एकसमान चाल + बदलती दिशा = असमान वेग (जैसे एकसमान वृत्तीय गति)।"}}, {"s": "Mechanics", "a": 3, "en": {"q": "A helicopter hovers at a fixed height above a helipad. Which statement best explains how it stays in the air without rising or falling?", "o": ["The rotor makes the helicopter weightless in air", "Air below pushes up by Archimedes' principle alone", "Gravity becomes zero above the helipad", "The rotor pushes air down; air pushes it up equally"], "e": "The rotor blades push a large mass of air downward (action). The air pushes the rotor upward with an equal force (reaction). When this upward force equals the weight, the net force is zero and the helicopter hovers.", "r": "Third law: rockets, drones, helicopters, swimming – push something one way, get pushed the other way."}, "hi": {"q": "एक हेलिकॉप्टर हेलिपैड के ऊपर एक निश्चित ऊँचाई पर मँडराता है। वह बिना ऊपर-नीचे हुए हवा में कैसे रुका रहता है, इसकी सबसे अच्छी व्याख्या कौन-सी है?", "o": ["रोटर हेलिकॉप्टर को हवा में भारहीन बना देता है", "केवल आर्किमिडीज़ सिद्धांत से नीचे की हवा उसे ऊपर धकेलती है", "हेलिपैड के ऊपर गुरुत्व शून्य हो जाता है", "रोटर हवा को नीचे धकेलता है; हवा उसे बराबर बल से ऊपर धकेलती है"], "e": "रोटर की पंखुड़ियाँ बहुत-सी हवा नीचे धकेलती हैं (क्रिया)। हवा रोटर को बराबर बल से ऊपर धकेलती है (प्रतिक्रिया)। जब यह ऊपरी बल भार के बराबर होता है, नेट बल शून्य होता है और हेलिकॉप्टर मँडराता है।", "r": "तीसरा नियम: रॉकेट, ड्रोन, हेलिकॉप्टर, तैरना – किसी को एक ओर धकेलो, दूसरी ओर धक्का मिलता है।"}}, {"s": "Mechanics", "a": 1, "en": {"q": "A child sitting on a spinning merry-go-round lets go of a ball held at arm's length. In which direction does the ball move just after it is released?", "o": ["Towards the centre of the merry-go-round", "Along the tangent at the point of release", "Straight outward along the radius", "Along with the merry-go-round in a circle"], "e": "While in the hand, the ball moves in a circle and its velocity is along the tangent. Once released, no centripetal force acts, so by inertia of direction it moves straight along the tangent at that point.", "r": "String breaks / object released in circular motion → moves along the tangent."}, "hi": {"q": "घूमते झूले (मेरी-गो-राउंड) पर बैठा बच्चा हाथ फैलाकर पकड़ी गेंद छोड़ देता है। छोड़ने के ठीक बाद गेंद किस दिशा में जाती है?", "o": ["झूले के केंद्र की ओर", "छोड़ने के बिंदु पर स्पर्शरेखा के अनुदिश", "त्रिज्या के अनुदिश सीधे बाहर", "झूले के साथ वृत्त में"], "e": "हाथ में रहते गेंद वृत्त में चलती है और उसका वेग स्पर्शरेखा के अनुदिश होता है। छोड़ते ही अभिकेंद्र बल नहीं रहता, अतः दिशा के जड़त्व से वह उस बिंदु की स्पर्शरेखा पर सीधी जाती है।", "r": "वृत्तीय गति में डोरी टूटे / वस्तु छूटे → स्पर्शरेखा के अनुदिश जाती है।"}}, {"s": "Mechanics", "a": 0, "en": {"q": "Cricket helmets, car dashboards and airbags are padded with soft material. How does this padding protect a person during an impact?", "o": ["It increases the time of impact, so the force is less", "It reduces the momentum of the person to zero instantly", "It increases the mass, so the force becomes smaller", "It absorbs all the momentum without any force at all"], "e": "The change in momentum during the impact is fixed. Force = change in momentum ÷ time. Soft padding stretches the stopping time, so the force on the body becomes much smaller.", "r": "Catching a ball with hands pulled back, sand pits and shock absorbers use the same idea."}, "hi": {"q": "क्रिकेट हेलमेट, कार के डैशबोर्ड और एयरबैग में मुलायम गद्दी लगी होती है। टक्कर के समय यह गद्दी व्यक्ति की रक्षा कैसे करती है?", "o": ["यह टक्कर का समय बढ़ाती है, इसलिए बल कम होता है", "यह व्यक्ति का संवेग तुरंत शून्य कर देती है", "यह द्रव्यमान बढ़ाती है, इसलिए बल छोटा हो जाता है", "यह बिना किसी बल के पूरा संवेग सोख लेती है"], "e": "टक्कर में संवेग परिवर्तन निश्चित है। बल = संवेग परिवर्तन ÷ समय। मुलायम गद्दी रुकने का समय बढ़ाती है, इसलिए शरीर पर बल बहुत कम हो जाता है।", "r": "हाथ पीछे खींचकर गेंद पकड़ना, रेत का गड्ढा और शॉक एब्ज़ॉर्बर इसी सिद्धांत पर।"}}, {"s": "Mechanics", "a": 2, "en": {"q": "A girl of mass 40 kg runs up a flight of 30 steps, each 20 cm high, in 12 seconds. What power does she develop? (g = 10 m/s²)", "o": ["2400 W", "100 W", "200 W", "400 W"], "e": "Height = 30 × 0.2 = 6 m. Work = mgh = 40 × 10 × 6 = 2400 J. Power = 2400/12 = 200 W.", "r": "Convert cm to m before using mgh; P = W/t."}, "hi": {"q": "40 kg की एक लड़की 20 cm ऊँची 30 सीढ़ियाँ 12 सेकंड में दौड़कर चढ़ती है। वह कितनी शक्ति विकसित करती है? (g = 10 m/s²)", "o": ["2400 W", "100 W", "200 W", "400 W"], "e": "ऊँचाई = 30 × 0.2 = 6 m। कार्य = mgh = 40 × 10 × 6 = 2400 J। शक्ति = 2400/12 = 200 W।", "r": "mgh लगाने से पहले cm को m में बदलें; P = W/t।"}}, {"s": "Mechanics", "a": 3, "en": {"q": "A cyclist on a level road applies the brakes, and a constant frictional force of 150 N brings the bicycle to rest in 12 m. What is the work done by friction?", "o": ["+1800 J", "−12.5 J", "zero", "−1800 J"], "e": "Friction acts opposite to the displacement (θ = 180°, cos 180° = −1). W = F s cos θ = 150 × 12 × (−1) = −1800 J. This equals the loss in kinetic energy of the cyclist.", "r": "Friction and brakes always do negative work; the KE lost turns into heat."}, "hi": {"q": "समतल सड़क पर एक साइकिल सवार ब्रेक लगाता है और 150 N का नियत घर्षण बल साइकिल को 12 m में रोक देता है। घर्षण द्वारा किया गया कार्य क्या है?", "o": ["+1800 J", "−12.5 J", "शून्य", "−1800 J"], "e": "घर्षण विस्थापन के विपरीत लगता है (θ = 180°, cos 180° = −1)। W = F s cos θ = 150 × 12 × (−1) = −1800 J। यह साइकिल सवार की गतिज ऊर्जा में कमी के बराबर है।", "r": "घर्षण और ब्रेक सदैव ऋणात्मक कार्य करते हैं; खोई गतिज ऊर्जा ऊष्मा बनती है।"}}, {"s": "Mechanics", "a": 0, "en": {"q": "A battery-operated toy car runs along a track and climbs a small slope. Which sequence correctly shows the energy changes that make the car move up?", "o": ["Chemical → electrical → kinetic → potential", "Electrical → chemical → kinetic → potential", "Kinetic → chemical → electrical → potential", "Potential → electrical → chemical → kinetic"], "e": "The cell turns stored chemical energy into electrical energy. The motor turns this into kinetic (mechanical) energy, and as the car climbs, part of it is stored as gravitational potential energy.", "r": "Cell: chemical → electrical; motor: electrical → mechanical; generator: mechanical → electrical."}, "hi": {"q": "बैटरी से चलने वाली खिलौना कार पटरी पर चलती है और एक छोटी ढलान पर चढ़ती है। कार को ऊपर ले जाने वाले ऊर्जा परिवर्तनों का सही क्रम कौन-सा है?", "o": ["रासायनिक → विद्युत → गतिज → स्थितिज", "विद्युत → रासायनिक → गतिज → स्थितिज", "गतिज → रासायनिक → विद्युत → स्थितिज", "स्थितिज → विद्युत → रासायनिक → गतिज"], "e": "सेल संचित रासायनिक ऊर्जा को विद्युत ऊर्जा में बदलता है। मोटर इसे गतिज (यांत्रिक) ऊर्जा में बदलती है, और चढ़ते समय इसका कुछ भाग गुरुत्वीय स्थितिज ऊर्जा के रूप में संचित होता है।", "r": "सेल: रासायनिक → विद्युत; मोटर: विद्युत → यांत्रिक; जनित्र: यांत्रिक → विद्युत।"}}, {"s": "Mechanics", "a": 3, "en": {"q": "A man climbs the stairs to the third floor. His identical twin reaches the same floor by lift. Compare the work done against gravity in raising each of them:", "o": ["More for the man who climbs the stairs", "More for the man who uses the lift", "Zero for the man who uses the lift", "Equal for both, as height and weight are the same"], "e": "Work done against gravity = mgh depends only on the weight and the vertical height gained, not on the path or the means. Both have the same weight and rise the same height, so the work is equal. (The power may differ, as the times differ.)", "r": "Work against gravity is path-independent: W = mgh."}, "hi": {"q": "एक व्यक्ति सीढ़ियों से तीसरी मंज़िल तक चढ़ता है। उसका हूबहू जुड़वाँ भाई उसी मंज़िल तक लिफ़्ट से पहुँचता है। दोनों को ऊपर उठाने में गुरुत्व के विरुद्ध किए गए कार्य की तुलना कीजिए:", "o": ["सीढ़ी चढ़ने वाले के लिए अधिक", "लिफ़्ट वाले के लिए अधिक", "लिफ़्ट वाले के लिए शून्य", "दोनों के लिए बराबर, क्योंकि ऊँचाई और भार समान हैं"], "e": "गुरुत्व के विरुद्ध कार्य = mgh केवल भार और प्राप्त ऊर्ध्वाधर ऊँचाई पर निर्भर है, पथ या साधन पर नहीं। दोनों का भार और ऊँचाई समान है, अतः कार्य बराबर। (समय अलग होने से शक्ति अलग हो सकती है।)", "r": "गुरुत्व के विरुद्ध कार्य पथ पर निर्भर नहीं: W = mgh।"}}, {"s": "Sound & Matter", "a": 1, "en": {"q": "A guitarist tightens one of the strings by turning its peg and then plucks it again. The note now sounds shriller. This happens because tightening the string increases the:", "o": ["amplitude of the sound wave", "frequency of vibration", "speed of sound in air", "loudness of the note"], "e": "A tighter string vibrates faster, so its frequency increases. Shrillness (pitch) depends on frequency. Loudness depends on amplitude, and the speed of sound in air does not change.", "r": "Pitch ↔ frequency; loudness ↔ amplitude."}, "hi": {"q": "एक गिटार वादक खूँटी घुमाकर एक तार को कसता है और फिर उसे छेड़ता है। अब स्वर अधिक तीखा सुनाई देता है। ऐसा इसलिए होता है क्योंकि तार कसने से बढ़ती है:", "o": ["ध्वनि तरंग का आयाम", "कंपन की आवृत्ति", "वायु में ध्वनि की चाल", "स्वर की प्रबलता"], "e": "कसा हुआ तार तेज़ी से कंपन करता है, अतः आवृत्ति बढ़ती है। तीखापन (तारत्व) आवृत्ति पर निर्भर है। प्रबलता आयाम पर निर्भर है और वायु में ध्वनि की चाल नहीं बदलती।", "r": "तारत्व ↔ आवृत्ति; प्रबलता ↔ आयाम।"}}, {"s": "Sound & Matter", "a": 2, "en": {"q": "Sound is called a mechanical wave, while light is an electromagnetic wave. Which property makes sound a mechanical wave?", "o": ["It always travels faster than light", "It can travel through a perfect vacuum", "It needs a material medium to travel", "It cannot be reflected from any surface"], "e": "Sound travels by the vibration of particles of a medium (solid, liquid or gas), so it cannot travel through vacuum. Light needs no medium. Sound is much slower than light and is reflected (echo).", "r": "No medium, no sound – that is why astronauts talk by radio."}, "hi": {"q": "ध्वनि को यांत्रिक तरंग कहा जाता है, जबकि प्रकाश विद्युतचुंबकीय तरंग है। कौन-सा गुण ध्वनि को यांत्रिक तरंग बनाता है?", "o": ["यह सदैव प्रकाश से तेज़ चलती है", "यह पूर्ण निर्वात में चल सकती है", "इसे चलने के लिए भौतिक माध्यम चाहिए", "यह किसी भी सतह से परावर्तित नहीं होती"], "e": "ध्वनि माध्यम (ठोस, द्रव या गैस) के कणों के कंपन से चलती है, इसलिए निर्वात में नहीं चल सकती। प्रकाश को माध्यम नहीं चाहिए। ध्वनि प्रकाश से बहुत धीमी है और परावर्तित होती है (प्रतिध्वनि)।", "r": "माध्यम नहीं, तो ध्वनि नहीं – इसीलिए अंतरिक्ष यात्री रेडियो से बात करते हैं।"}}, {"s": "Light", "a": 1, "en": {"q": "A concave mirror forms a real image of a candle on a screen placed in front of the mirror. In the mirror formula, the image distance (v) for this case is taken as:", "o": ["positive, as the image is real", "negative, as it is in front of the mirror", "zero, as the image is on a screen", "infinite, as the image is real"], "e": "In the Cartesian sign convention, distances measured in front of the mirror (against the direction of incident light) are negative. A real image formed by a concave mirror lies in front of it, so v is negative.", "r": "Mirror: real image → v negative; virtual image (behind) → v positive. u is always negative."}, "hi": {"q": "एक अवतल दर्पण दर्पण के सामने रखे पर्दे पर मोमबत्ती का वास्तविक प्रतिबिंब बनाता है। दर्पण सूत्र में इस स्थिति के लिए प्रतिबिंब दूरी (v) ली जाती है:", "o": ["धनात्मक, क्योंकि प्रतिबिंब वास्तविक है", "ऋणात्मक, क्योंकि वह दर्पण के सामने है", "शून्य, क्योंकि प्रतिबिंब पर्दे पर है", "अनंत, क्योंकि प्रतिबिंब वास्तविक है"], "e": "कार्तीय चिह्न परिपाटी में दर्पण के सामने (आपतित प्रकाश के विपरीत) मापी गई दूरियाँ ऋणात्मक होती हैं। अवतल दर्पण का वास्तविक प्रतिबिंब सामने बनता है, अतः v ऋणात्मक।", "r": "दर्पण: वास्तविक प्रतिबिंब → v ऋणात्मक; आभासी (पीछे) → v धनात्मक। u सदैव ऋणात्मक।"}}, {"s": "Light", "a": 0, "en": {"q": "Light enters a glass slab of refractive index 1.5 and thickness 3 cm along the normal. How long does it take to cross the slab? (c = 3 × 10⁸ m/s)", "o": ["1.5 × 10⁻¹⁰ s", "1 × 10⁻¹⁰ s", "2 × 10⁻¹⁰ s", "0.5 × 10⁻¹⁰ s"], "e": "Speed in glass v = c/n = 3 × 10⁸ / 1.5 = 2 × 10⁸ m/s. Time = 0.03 m / (2 × 10⁸ m/s) = 1.5 × 10⁻¹⁰ s.", "r": "n = c/v: higher refractive index → slower light."}, "hi": {"q": "प्रकाश 1.5 अपवर्तनांक और 3 cm मोटाई वाली काँच की सिल्ली में अभिलंब के अनुदिश प्रवेश करता है। सिल्ली पार करने में उसे कितना समय लगेगा? (c = 3 × 10⁸ m/s)", "o": ["1.5 × 10⁻¹⁰ s", "1 × 10⁻¹⁰ s", "2 × 10⁻¹⁰ s", "0.5 × 10⁻¹⁰ s"], "e": "काँच में चाल v = c/n = 3 × 10⁸ / 1.5 = 2 × 10⁸ m/s। समय = 0.03 m / (2 × 10⁸ m/s) = 1.5 × 10⁻¹⁰ s।", "r": "n = c/v: अधिक अपवर्तनांक → धीमा प्रकाश।"}}, {"s": "Light", "a": 2, "en": {"q": "On a hot, sunny day, a stretch of road far ahead looks wet, as if covered with water, though it is completely dry. This illusion is caused by:", "o": ["dispersion of sunlight in hot air", "scattering of light by dust particles", "total internal reflection in hot air layers", "reflection of the sky by the road paint"], "e": "Air just above the hot road is hotter and rarer than the air above it. Light from the sky bends more and more away from the normal and is finally totally internally reflected upward, so we see an image of the sky on the road – it looks like water (mirage).", "r": "Mirage, sparkling diamond and optical fibres all use total internal reflection."}, "hi": {"q": "गर्म, धूप वाले दिन आगे दूर की सड़क गीली दिखती है, मानो पानी भरा हो, जबकि वह पूरी तरह सूखी होती है। यह भ्रम किसके कारण होता है?", "o": ["गर्म वायु में सूर्य प्रकाश का वर्ण-विक्षेपण", "धूल के कणों द्वारा प्रकाश का प्रकीर्णन", "गर्म वायु परतों में पूर्ण आंतरिक परावर्तन", "सड़क के पेंट द्वारा आकाश का परावर्तन"], "e": "गर्म सड़क के ठीक ऊपर की वायु अधिक गर्म और विरल होती है। आकाश से आता प्रकाश अभिलंब से अधिकाधिक दूर मुड़कर अंत में ऊपर की ओर पूर्ण आंतरिक परावर्तित हो जाता है, इसलिए सड़क पर आकाश का प्रतिबिंब पानी जैसा दिखता है (मरीचिका)।", "r": "मरीचिका, हीरे की चमक और ऑप्टिकल फाइबर – सब पूर्ण आंतरिक परावर्तन से।"}}, {"s": "Light", "a": 1, "en": {"q": "Two thin lenses of powers +3 D and −3 D are placed in contact with each other. How does this combination behave?", "o": ["Like a convex lens of power +6 D", "Like a plane glass plate with zero power", "Like a concave lens of power −6 D", "Like a convex lens of power +3 D"], "e": "For lenses in contact, P = P₁ + P₂ = +3 − 3 = 0 D. Zero power means infinite focal length, so the combination neither converges nor diverges light – it acts like a plane glass plate.", "r": "Lenses in contact: powers add algebraically."}, "hi": {"q": "+3 D और −3 D क्षमता वाले दो पतले लेंस एक-दूसरे के संपर्क में रखे हैं। यह संयोजन कैसा व्यवहार करेगा?", "o": ["+6 D क्षमता वाले उत्तल लेंस जैसा", "शून्य क्षमता वाली समतल काँच की प्लेट जैसा", "−6 D क्षमता वाले अवतल लेंस जैसा", "+3 D क्षमता वाले उत्तल लेंस जैसा"], "e": "संपर्क में लेंसों के लिए P = P₁ + P₂ = +3 − 3 = 0 D। शून्य क्षमता का अर्थ अनंत फोकस दूरी, अतः संयोजन प्रकाश को न अभिसारित करता है न अपसारित – समतल काँच की प्लेट जैसा।", "r": "संपर्क में लेंस: क्षमताएँ बीजगणितीय रूप से जुड़ती हैं।"}}, {"s": "Light", "a": 3, "en": {"q": "A photographer wants a convex lens to form a real image exactly the same size as the object. Where must the object be placed?", "o": ["At the principal focus F", "Between F and 2F", "Beyond 2F", "At 2F"], "e": "When the object is at 2F (twice the focal length), the real, inverted image is formed at 2F on the other side, and the magnification is −1, i.e. the same size.", "r": "Convex lens: object at 2F → image at 2F, same size; beyond 2F → smaller (camera)."}, "hi": {"q": "एक फ़ोटोग्राफ़र चाहता है कि उत्तल लेंस वस्तु के ठीक समान आकार का वास्तविक प्रतिबिंब बनाए। वस्तु कहाँ रखनी होगी?", "o": ["मुख्य फोकस F पर", "F और 2F के बीच", "2F से परे", "2F पर"], "e": "वस्तु 2F (दोगुनी फोकस दूरी) पर हो तो दूसरी ओर 2F पर वास्तविक, उल्टा प्रतिबिंब बनता है और आवर्धन −1 होता है, अर्थात समान आकार।", "r": "उत्तल लेंस: वस्तु 2F पर → प्रतिबिंब 2F पर, समान आकार; 2F से परे → छोटा (कैमरा)।"}}, {"s": "Light", "a": 1, "en": {"q": "A student reads the blackboard clearly but finds it hard to read a textbook held at the normal reading distance. Which defect does he have, and which lens corrects it?", "o": ["Myopia; concave lens", "Hypermetropia; convex lens", "Presbyopia; concave lens", "Cataract; cylindrical lens"], "e": "He sees far objects clearly but not near ones, so his near point has moved beyond 25 cm – hypermetropia (long-sightedness). The image of a near object falls behind the retina; a convex (converging) lens corrects it.", "r": "Far clear, near blurred → hypermetropia → convex. Near clear, far blurred → myopia → concave."}, "hi": {"q": "एक छात्र ब्लैकबोर्ड स्पष्ट पढ़ लेता है, पर सामान्य दूरी पर रखी पाठ्यपुस्तक पढ़ने में कठिनाई होती है। उसे कौन-सा दोष है और कौन-सा लेंस इसे ठीक करेगा?", "o": ["निकटदृष्टि; अवतल लेंस", "दीर्घदृष्टि; उत्तल लेंस", "जरादूरदृष्टिता; अवतल लेंस", "मोतियाबिंद; बेलनाकार लेंस"], "e": "उसे दूर की वस्तुएँ स्पष्ट दिखती हैं पर पास की नहीं, अतः निकट बिंदु 25 cm से आगे चला गया है – दीर्घदृष्टि। पास की वस्तु का प्रतिबिंब रेटिना के पीछे बनता है; उत्तल (अभिसारी) लेंस इसे ठीक करता है।", "r": "दूर स्पष्ट, पास धुँधला → दीर्घदृष्टि → उत्तल। पास स्पष्ट, दूर धुँधला → निकटदृष्टि → अवतल।"}}, {"s": "Light", "a": 0, "en": {"q": "Because of atmospheric refraction, how does a star close to the horizon appear to an observer on the Earth, compared with its actual position?", "o": ["Slightly higher than its actual position", "Slightly lower than its actual position", "Exactly at its actual position", "Shifted sideways to the east"], "e": "Starlight enters denser and denser layers of air and bends towards the normal. The eye sees the star along the final direction of the ray, so the star appears slightly raised above its true position.", "r": "Atmospheric refraction: stars appear higher, they twinkle, and the Sun is seen about 2 min before sunrise."}, "hi": {"q": "वायुमंडलीय अपवर्तन के कारण क्षितिज के पास का तारा पृथ्वी पर प्रेक्षक को अपनी वास्तविक स्थिति की तुलना में कैसा दिखता है?", "o": ["अपनी वास्तविक स्थिति से थोड़ा ऊपर", "अपनी वास्तविक स्थिति से थोड़ा नीचे", "ठीक अपनी वास्तविक स्थिति पर", "पूर्व की ओर बगल में खिसका हुआ"], "e": "तारे का प्रकाश अधिकाधिक सघन वायु परतों में प्रवेश कर अभिलंब की ओर मुड़ता है। आँख तारे को किरण की अंतिम दिशा में देखती है, इसलिए तारा अपनी वास्तविक स्थिति से थोड़ा ऊपर दिखता है।", "r": "वायुमंडलीय अपवर्तन: तारे ऊपर दिखते हैं, टिमटिमाते हैं, और सूर्य लगभग 2 मिनट पहले दिखता है।"}}, {"s": "Light", "a": 2, "en": {"q": "White light passes through a glass prism and forms a spectrum on a screen. Which colour appears closest to the base of the prism?", "o": ["Red", "Yellow", "Violet", "Green"], "e": "A prism bends light towards its base. Violet has the shortest wavelength and the highest refractive index in glass, so it deviates the most and lies closest to the base; red deviates the least and lies on top.", "r": "VIBGYOR: violet deviates most, red least."}, "hi": {"q": "श्वेत प्रकाश काँच के प्रिज़्म से गुजरकर पर्दे पर स्पेक्ट्रम बनाता है। प्रिज़्म के आधार के सबसे निकट कौन-सा रंग दिखता है?", "o": ["लाल", "पीला", "बैंगनी", "हरा"], "e": "प्रिज़्म प्रकाश को अपने आधार की ओर मोड़ता है। बैंगनी की तरंगदैर्ध्य सबसे कम और काँच में अपवर्तनांक सबसे अधिक है, अतः वह सबसे अधिक विचलित होकर आधार के सबसे निकट रहता है; लाल सबसे कम विचलित होकर ऊपर।", "r": "VIBGYOR (बैंनीआहपीनाला): बैंगनी सर्वाधिक, लाल न्यूनतम विचलित।"}}, {"s": "Electricity & Magnetism", "a": 1, "en": {"q": "An electric iron rated 1000 W is used for 30 minutes daily for 30 days. If one unit costs ₹8, what is the cost of the energy used?", "o": ["₹240", "₹120", "₹60", "₹1200"], "e": "Daily energy = 1 kW × 0.5 h = 0.5 kWh. For 30 days = 15 kWh = 15 units. Cost = 15 × 8 = ₹120.", "r": "1 unit = 1 kWh; convert W to kW and minutes to hours."}, "hi": {"q": "1000 W अंकित एक विद्युत इस्त्री प्रतिदिन 30 मिनट तक 30 दिन प्रयोग होती है। एक यूनिट का मूल्य ₹8 हो, तो प्रयुक्त ऊर्जा का खर्च कितना है?", "o": ["₹240", "₹120", "₹60", "₹1200"], "e": "दैनिक ऊर्जा = 1 kW × 0.5 h = 0.5 kWh। 30 दिन में = 15 kWh = 15 यूनिट। खर्च = 15 × 8 = ₹120।", "r": "1 यूनिट = 1 kWh; W को kW और मिनट को घंटे में बदलें।"}}, {"s": "Electricity & Magnetism", "a": 0, "en": {"q": "House wiring uses copper wires, while heater coils use nichrome wire. Copper is chosen for connecting wires mainly because it:", "o": ["has very low resistivity, so little heat is wasted", "has a very high melting point compared with nichrome", "gets red hot quickly when current passes", "has a very high resistivity, so it is safer"], "e": "Connecting wires should carry current with as little loss as possible. Copper has very low resistivity, so very little energy is wasted as heat (H = I²Rt). Nichrome has high resistivity, so it is used where heat is wanted.", "r": "Connecting wires: copper, aluminium (low ρ). Heating elements: nichrome (high ρ, high m.p.)."}, "hi": {"q": "घरेलू वायरिंग में ताँबे के तार और हीटर की कुंडली में नाइक्रोम तार प्रयुक्त होते हैं। जोड़ने वाले तारों के लिए ताँबा मुख्यतः इसलिए चुना जाता है क्योंकि यह:", "o": ["बहुत कम प्रतिरोधकता रखता है, इसलिए कम ऊष्मा व्यर्थ होती है", "नाइक्रोम की तुलना में बहुत उच्च गलनांक रखता है", "धारा बहने पर जल्दी लाल गर्म हो जाता है", "बहुत अधिक प्रतिरोधकता रखता है, इसलिए सुरक्षित है"], "e": "जोड़ने वाले तारों को कम से कम हानि के साथ धारा ले जानी चाहिए। ताँबे की प्रतिरोधकता बहुत कम है, अतः ऊष्मा के रूप में बहुत कम ऊर्जा व्यर्थ होती है (H = I²Rt)। नाइक्रोम की प्रतिरोधकता अधिक है, इसलिए जहाँ ऊष्मा चाहिए वहाँ प्रयुक्त।", "r": "जोड़ने वाले तार: ताँबा, ऐलुमिनियम (कम ρ)। तापन अवयव: नाइक्रोम (अधिक ρ, उच्च गलनांक)।"}}, {"s": "Electricity & Magnetism", "a": 2, "en": {"q": "Two bulbs are joined in series across the mains supply and both glow. If one bulb is removed from its holder, what happens to the other bulb?", "o": ["It glows brighter than before", "It glows with the same brightness", "It goes off, as the circuit is broken", "It glows dimmer but stays on"], "e": "In a series circuit there is only one path for current. Removing one bulb breaks the path, so no current flows and the other bulb goes off. This is why house wiring uses parallel connections.", "r": "Series: one fails, all stop. Parallel: others keep working."}, "hi": {"q": "दो बल्ब मुख्य आपूर्ति से श्रेणी में जुड़े हैं और दोनों जल रहे हैं। यदि एक बल्ब होल्डर से निकाल दिया जाए, तो दूसरे बल्ब का क्या होगा?", "o": ["पहले से अधिक चमकेगा", "उतनी ही चमक से जलेगा", "बुझ जाएगा, क्योंकि परिपथ टूट गया", "धीमा होकर जलता रहेगा"], "e": "श्रेणी परिपथ में धारा का केवल एक पथ होता है। एक बल्ब निकालने से पथ टूट जाता है, धारा नहीं बहती और दूसरा बल्ब बुझ जाता है। इसीलिए घरेलू वायरिंग समांतर में होती है।", "r": "श्रेणी: एक बंद, सब बंद। समांतर: बाकी चलते रहते हैं।"}}, {"s": "Electricity & Magnetism", "a": 0, "en": {"q": "An engineer wants to find the direction of the current induced in the rotating coil of a dynamo. Which rule should he use?", "o": ["Fleming's right-hand rule", "Fleming's left-hand rule", "Right-hand thumb rule", "Maxwell's corkscrew rule"], "e": "A dynamo (generator) produces induced current when a conductor moves in a magnetic field. Fleming's right-hand rule gives its direction: thumb – motion, forefinger – field, middle finger – induced current.", "r": "Right hand → generator; left hand → motor; thumb rule → field around a wire."}, "hi": {"q": "एक इंजीनियर डायनेमो की घूमती कुंडली में प्रेरित धारा की दिशा ज्ञात करना चाहता है। उसे कौन-सा नियम प्रयोग करना चाहिए?", "o": ["फ्लेमिंग का दक्षिण-हस्त नियम", "फ्लेमिंग का वाम-हस्त नियम", "दक्षिण-हस्त अंगूठा नियम", "मैक्सवेल का कॉर्कस्क्रू नियम"], "e": "डायनेमो (जनित्र) में चालक के चुंबकीय क्षेत्र में घूमने से प्रेरित धारा बनती है। इसकी दिशा फ्लेमिंग का दक्षिण-हस्त नियम देता है: अंगूठा – गति, तर्जनी – क्षेत्र, मध्यमा – प्रेरित धारा।", "r": "दक्षिण हस्त → जनित्र; वाम हस्त → मोटर; अंगूठा नियम → तार के चारों ओर क्षेत्र।"}}, {"s": "Electricity & Magnetism", "a": 3, "en": {"q": "The current through a long straight wire is doubled, while the distance of a point from the wire stays the same. The magnetic field at that point:", "o": ["becomes half", "becomes four times", "stays the same", "becomes double"], "e": "The magnetic field around a straight current-carrying wire is directly proportional to the current and inversely proportional to the distance (B ∝ I/r). Doubling the current at the same distance doubles the field.", "r": "Field of a straight wire: B ∝ I and B ∝ 1/r."}, "hi": {"q": "एक लंबे सीधे तार में धारा दोगुनी कर दी जाती है, जबकि तार से एक बिंदु की दूरी समान रहती है। उस बिंदु पर चुंबकीय क्षेत्र:", "o": ["आधा हो जाएगा", "चार गुना हो जाएगा", "समान रहेगा", "दोगुना हो जाएगा"], "e": "सीधे धारावाही तार के चारों ओर चुंबकीय क्षेत्र धारा के समानुपाती और दूरी के व्युत्क्रमानुपाती होता है (B ∝ I/r)। समान दूरी पर धारा दोगुनी करने से क्षेत्र दोगुना।", "r": "सीधे तार का क्षेत्र: B ∝ I और B ∝ 1/r।"}}, {"s": "Mechanics", "a": 2, "en": {"q": "An astronaut has a mass of 70 kg on the Earth. What is his weight on the Moon, where the acceleration due to gravity is 1.6 m/s²?", "o": ["70 N", "686 N", "112 N", "11.7 N"], "e": "Mass does not change from place to place, so it is still 70 kg on the Moon. Weight = mg = 70 × 1.6 = 112 N (on the Earth it is 70 × 9.8 = 686 N).", "r": "Mass: same everywhere (kg). Weight: changes with g (newton); on the Moon about 1/6."}, "hi": {"q": "पृथ्वी पर एक अंतरिक्ष यात्री का द्रव्यमान 70 kg है। चंद्रमा पर, जहाँ गुरुत्वीय त्वरण 1.6 m/s² है, उसका भार कितना होगा?", "o": ["70 N", "686 N", "112 N", "11.7 N"], "e": "द्रव्यमान स्थान के साथ नहीं बदलता, अतः चंद्रमा पर भी 70 kg। भार = mg = 70 × 1.6 = 112 N (पृथ्वी पर 70 × 9.8 = 686 N)।", "r": "द्रव्यमान: हर जगह समान (kg)। भार: g के साथ बदलता है (न्यूटन); चंद्रमा पर लगभग 1/6।"}}];

function showTime(){const m=Math.max(0,Math.floor(left/60)),s=Math.max(0,left%60);$('#timer').textContent='⏱ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function finish(){done=true;clearInterval(tick);$('#timer').classList.add('hide');render();window.scrollTo(0,0)}
function stats(){let c=0,w=0,s=0,by={};Q.forEach((q,i)=>{const b=by[q.s]=by[q.s]||{n:0,c:0,w:0};b.n++;if(resp[i]===null){s++}else if(resp[i]===q.a){c++;b.c++}else{w++;b.w++}});return{c,w,s,by,score:+(c-w/3).toFixed(2)}}
function qcard(i,showAns,tag){const q=Q[i],d=q[L],r=resp[i];
 let h=`<div class="card"><div class="qhead"><span class="qno">${t('q')} ${i+1} / ${Q.length}</span><span>${tag||''} <span class="sec">${sec(q.s)}</span></span></div><div class="qt">${esc(d.q)}</div>`;
 d.o.forEach((o,j)=>{let c='';if(showAns){if(j===q.a)c='ok';else if(r===j)c='bad'}else if(r===j)c='sel';
  h+=`<button class="opt ${c}" data-j="${j}" ${showAns?'disabled':''}><span class="k">(${K[j]})</span><span>${esc(o)}</span></button>`});
 if(showAns)h+=`<div class="exp"><b>${t('ans')}: (${K[q.a]})</b> ${esc(d.e)}<div class="rm">💡 ${t('rem')}${esc(d.r)}</div></div>`;
 return h+'</div>'}
function render(){
 if(!mode){app.innerHTML=`<div class="card"><div class="sub">${META.kicker}</div><h1>${META.title}</h1><div class="sub">${L==='hi'?META.subhi:META.sub}</div>
 <div class="chips"><span>${Q.length} Qs</span><span>⏱ ${META.mins} min</span><span>+1 / −1/3</span><span>EN | हिंदी</span></div>
 <h2>${t('start')}</h2><div class="modes"><button class="mode" id="mT"><b>📝 ${t('test')}</b>${t('testd')}</button><button class="mode" id="mP"><b>🎯 ${t('prac')}</b>${t('pracd')}</button></div>
 <ul class="rules">${t('rules').map(x=>'<li>'+x+'</li>').join('')}</ul></div>`;$('#mT').onclick=()=>start('test');$('#mP').onclick=()=>start('prac');return}
 if(done)return result();
 const showAns=mode==='prac'&&resp[cur]!==null;
 let h=qcard(cur,showAns);
 h+=`<div class="nav"><button class="btn s" id="bP" ${cur===0?'disabled':''}>${t('prev')}</button>`+(mode==='test'?`<button class="btn s" id="bC">${t('clear')}</button>`:'')+(cur<Q.length-1?`<button class="btn p" id="bN">${t('next')}</button>`:`<button class="btn d" id="bF">${mode==='test'?t('submit'):t('finish')}</button>`)+`</div>`;
 h+=`<div class="card" style="margin-top:14px"><div class="qhead"><b>${t('pal')}</b>`+(mode==='prac'?`<span class="sec">${t('pscore')}: ${stats().score}</span>`:'')+`</div><div class="pal">${Q.map((q,i)=>{let c='';if(mode==='prac'&&resp[i]!==null)c=resp[i]===q.a?'ok':'bad';else if(resp[i]!==null)c='ans';return `<button class="${c} ${i===cur?'cur':''}" data-i="${i}">${i+1}</button>`}).join('')}</div>`+(mode==='test'?`<div class="nav"><span></span><button class="btn d" id="bS">${t('submit')}</button></div>`:'')+`</div>`;
 app.innerHTML=h;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(mode==='prac'&&resp[cur]!==null)return;resp[cur]=+b.dataset.j;render()});
 app.querySelectorAll('.pal button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render()});
 const go=d=>{cur+=d;render();window.scrollTo(0,0)};
 if($('#bP'))$('#bP').onclick=()=>go(-1);if($('#bN'))$('#bN').onclick=()=>go(1);
 if($('#bC'))$('#bC').onclick=()=>{resp[cur]=null;render()};
 const sub=()=>{if(confirm(t('confirm')))finish()};
 if($('#bS'))$('#bS').onclick=sub;
 if($('#bF'))$('#bF').onclick=mode==='test'?sub:()=>finish();
}
function result(){const st=stats(),att=st.c+st.w,acc=att?Math.round(st.c/att*100):0;
 let h=`<div class="card"><h2>${t('res')} · ${META.title}</h2><div class="score"><div><b>${st.score} / ${Q.length}</b>${t('sc')}</div><div><b style="color:var(--ok)">${st.c}</b>${t('cor')}</div><div><b style="color:var(--bad)">${st.w}</b>${t('wr')}</div><div><b>${st.s}</b>${t('sk')}</div></div>
 <p class="sub">${t('acc')}: ${acc}%</p><h2>${t('secw')}</h2><table><tr><th>${t('secn')}</th><th>Qs</th><th>${t('cor')}</th><th>${t('wr')}</th><th>${t('sc')}</th></tr>${Object.entries(st.by).map(([k,b])=>`<tr><td>${sec(k)}</td><td>${b.n}</td><td>${b.c}</td><td>${b.w}</td><td>${+(b.c-b.w/3).toFixed(2)}</td></tr>`).join('')}</table>
 <div class="nav"><button class="btn p" id="bR">${t('retry')}</button><button class="btn s" id="bH">${t('home')}</button></div></div>
 <div class="card"><h2>${t('sol')}</h2><div class="filters">${[['all',t('all')],['ok',t('cor')],['bad',t('wr')],['sk',t('sk')]].map(([k,n])=>`<button data-f="${k}" class="${filt===k?'on':''}">${n}</button>`).join('')}</div></div>`;
 Q.forEach((q,i)=>{const r=resp[i],s2=r===null?'sk':(r===q.a?'ok':'bad');if(filt!=='all'&&filt!==s2)return;
  const tg=s2==='ok'?`<span class="tag ok">✔ ${t('cor')}</span>`:s2==='bad'?`<span class="tag bad">✘ ${t('your')}: (${K[r]})</span>`:`<span class="tag sk">${t('skipped')}</span>`;
  h+=qcard(i,true,tg)});
 app.innerHTML=h;$('#bR').onclick=()=>start(mode);$('#bH').onclick=home;
 app.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filt=b.dataset.f;render()})}
render();
</script></body></html>
