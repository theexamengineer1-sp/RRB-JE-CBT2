*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;line-height:1.5}

<script>
const META={"title": "RRB JE CBT-2 · Physics · Mixed Set 4", "kicker": "THE EXAM ENGINEER · CBT-2 Physics Series", "sub": "25 most-likely questions based on RRB JE PYQs (CBT-1 & CBT-2 pattern).", "subhi": "RRB JE PYQs (CBT-1 और CBT-2 पैटर्न) पर आधारित 25 सर्वाधिक संभावित प्रश्न।", "mins": 25};
const Q=[{"s": "Mechanics", "a": 2, "en": {"q": "A boy throws a ball vertically upward and catches it again at the same point exactly 4 s later. Ignoring air resistance, what maximum height does the ball reach? (g = 10 m/s²)", "o": ["40 m", "10 m", "20 m", "80 m"], "e": "Time up = time down = 2 s. At the top v = 0, so u = g × t = 10 × 2 = 20 m/s. H = u²/2g = 400/20 = 20 m.", "r": "Without air resistance, time of ascent = time of descent."}, "hi": {"q": "एक लड़का गेंद को ऊर्ध्वाधर ऊपर फेंकता है और ठीक 4 s बाद उसी बिंदु पर पकड़ लेता है। वायु प्रतिरोध नगण्य मानें, तो गेंद अधिकतम कितनी ऊँचाई तक जाती है? (g = 10 m/s²)", "o": ["40 m", "10 m", "20 m", "80 m"], "e": "ऊपर जाने का समय = नीचे आने का समय = 2 s। शीर्ष पर v = 0, अतः u = g × t = 10 × 2 = 20 m/s। H = u²/2g = 400/20 = 20 m।", "r": "वायु प्रतिरोध न हो तो ऊपर जाने का समय = नीचे आने का समय।"}}, {"s": "Mechanics", "a": 1, "en": {"q": "A stone is dropped from the top of a cliff and falls freely. Which quantity remains constant throughout its fall, ignoring air resistance?", "o": ["Its velocity", "Its acceleration", "Its kinetic energy", "Its momentum"], "e": "In free fall the only force is gravity, so the acceleration is g (about 9.8 m/s², downward) all the time. Velocity, momentum and kinetic energy all keep increasing as the stone falls.", "r": "Free fall: a = g constant; v, p and KE increase."}, "hi": {"q": "एक पत्थर चट्टान की चोटी से गिराया जाता है और मुक्त रूप से गिरता है। वायु प्रतिरोध नगण्य मानें, तो गिरते समय कौन-सी राशि नियत रहती है?", "o": ["उसका वेग", "उसका त्वरण", "उसकी गतिज ऊर्जा", "उसका संवेग"], "e": "मुक्त पतन में केवल गुरुत्व बल लगता है, अतः त्वरण पूरे समय g (लगभग 9.8 m/s², नीचे की ओर) रहता है। वेग, संवेग और गतिज ऊर्जा गिरते समय बढ़ते रहते हैं।", "r": "मुक्त पतन: a = g नियत; v, p और KE बढ़ते हैं।"}}, {"s": "Mechanics", "a": 0, "en": {"q": "A tennis ball and a cricket ball move towards a fielder with the same speed. It is much harder to stop the cricket ball. Which statement best explains this?", "o": ["The cricket ball has a greater mass and hence greater momentum", "The tennis ball has more inertia due to its fuzzy surface", "Both have equal momentum, but the cricket ball has more force", "The cricket ball travels faster in air than the tennis ball"], "e": "Momentum p = mv. At the same speed, the heavier cricket ball has more momentum, so a larger force (or longer time) is needed to bring it to rest.", "r": "More mass → more inertia and more momentum at the same speed."}, "hi": {"q": "एक टेनिस गेंद और एक क्रिकेट गेंद समान चाल से क्षेत्ररक्षक की ओर आ रही हैं। क्रिकेट गेंद को रोकना बहुत कठिन है। इसकी सबसे अच्छी व्याख्या कौन-सा कथन करता है?", "o": ["क्रिकेट गेंद का द्रव्यमान अधिक है, अतः संवेग अधिक है", "रोएँदार सतह के कारण टेनिस गेंद का जड़त्व अधिक है", "दोनों का संवेग बराबर है, पर क्रिकेट गेंद का बल अधिक है", "क्रिकेट गेंद वायु में टेनिस गेंद से तेज़ चलती है"], "e": "संवेग p = mv। समान चाल पर भारी क्रिकेट गेंद का संवेग अधिक होता है, अतः उसे रोकने के लिए अधिक बल (या अधिक समय) चाहिए।", "r": "अधिक द्रव्यमान → समान चाल पर अधिक जड़त्व और अधिक संवेग।"}}, {"s": "Mechanics", "a": 2, "en": {"q": "A magician pulls a tablecloth out very quickly, and the dishes on it stay almost in place on the table. This trick works mainly because of:", "o": ["inertia of motion of the cloth", "the third law of motion", "inertia of rest of the dishes", "the large friction on the dishes"], "e": "The cloth is pulled away so quickly that friction acts on the dishes only for a very short time. Due to inertia of rest, the dishes tend to stay at rest, so they barely move.", "r": "Inertia of rest: coin falls into the glass when the card is flicked; dust leaves a beaten carpet."}, "hi": {"q": "एक जादूगर मेज़पोश को बहुत तेज़ी से खींच लेता है और उस पर रखे बर्तन लगभग अपनी जगह पर मेज़ पर रह जाते हैं। यह करतब मुख्यतः किसके कारण होता है?", "o": ["कपड़े के गति के जड़त्व के कारण", "गति के तीसरे नियम के कारण", "बर्तनों के विराम के जड़त्व के कारण", "बर्तनों पर अधिक घर्षण के कारण"], "e": "कपड़ा इतनी तेज़ी से खींचा जाता है कि घर्षण बर्तनों पर बहुत कम समय के लिए लगता है। विराम के जड़त्व के कारण बर्तन विराम में रहना चाहते हैं, इसलिए वे मुश्किल से हिलते हैं।", "r": "विराम का जड़त्व: कार्ड झटकने पर सिक्का गिलास में गिरता है; पीटने पर कालीन से धूल निकलती है।"}}, {"s": "Mechanics", "a": 1, "en": {"q": "Machines use ball bearings between moving parts such as axles and wheels. How do ball bearings help the machine run smoothly?", "o": ["They increase the mass of the parts", "They replace sliding friction with rolling friction", "They remove all friction from the machine", "They convert friction into extra motion"], "e": "Rolling friction is much smaller than sliding friction. Ball bearings make the surfaces roll over each other instead of sliding, so less energy is lost as heat and wear is reduced. Friction is reduced, not removed.", "r": "Static > sliding (kinetic) > rolling friction."}, "hi": {"q": "मशीनों में धुरी और पहियों जैसे गतिशील भागों के बीच बॉल बेयरिंग लगाए जाते हैं। बॉल बेयरिंग मशीन को सुचारु चलाने में कैसे मदद करते हैं?", "o": ["वे भागों का द्रव्यमान बढ़ाते हैं", "वे सर्पी घर्षण को लोटनिक घर्षण में बदलते हैं", "वे मशीन से सारा घर्षण हटा देते हैं", "वे घर्षण को अतिरिक्त गति में बदलते हैं"], "e": "लोटनिक घर्षण सर्पी घर्षण से बहुत कम होता है। बॉल बेयरिंग सतहों को फिसलने के बजाय लुढ़कने देते हैं, अतः ऊष्मा के रूप में कम ऊर्जा व्यर्थ होती है और घिसाव घटता है। घर्षण कम होता है, समाप्त नहीं।", "r": "स्थैतिक > सर्पी (गतिज) > लोटनिक घर्षण।"}}, {"s": "Mechanics", "a": 3, "en": {"q": "The engine of a 1500 kg car increases its speed from 10 m/s to 20 m/s on a level road. Ignoring friction, how much work is done by the engine?", "o": ["75 kJ", "150 kJ", "300 kJ", "225 kJ"], "e": "Work–energy theorem: W = change in KE = ½ × 1500 × (20² − 10²) = 750 × (400 − 100) = 750 × 300 = 225,000 J = 225 kJ.", "r": "W = ½m(v² − u²) – square the speeds first, then subtract."}, "hi": {"q": "1500 kg की एक कार का इंजन समतल सड़क पर उसकी चाल 10 m/s से 20 m/s कर देता है। घर्षण नगण्य मानें, तो इंजन द्वारा कितना कार्य किया गया?", "o": ["75 kJ", "150 kJ", "300 kJ", "225 kJ"], "e": "कार्य–ऊर्जा प्रमेय: W = गतिज ऊर्जा में परिवर्तन = ½ × 1500 × (20² − 10²) = 750 × (400 − 100) = 750 × 300 = 225,000 J = 225 kJ।", "r": "W = ½m(v² − u²) – पहले चालों का वर्ग करें, फिर घटाएँ।"}}, {"s": "Mechanics", "a": 0, "en": {"q": "Two bodies of masses m and 4m are moving with equal kinetic energies. What is the ratio of their linear momenta?", "o": ["1 : 2", "1 : 4", "2 : 1", "1 : 16"], "e": "KE = p²/2m, so p = √(2mK). With equal K, p ∝ √m. Ratio = √m : √(4m) = 1 : 2. The heavier body has more momentum.", "r": "Equal KE → p ∝ √m; equal momentum → KE ∝ 1/m."}, "hi": {"q": "m और 4m द्रव्यमान वाली दो वस्तुएँ समान गतिज ऊर्जा से चल रही हैं। उनके रैखिक संवेगों का अनुपात क्या है?", "o": ["1 : 2", "1 : 4", "2 : 1", "1 : 16"], "e": "KE = p²/2m, अतः p = √(2mK)। K समान होने पर p ∝ √m। अनुपात = √m : √(4m) = 1 : 2। भारी वस्तु का संवेग अधिक।", "r": "समान KE → p ∝ √m; समान संवेग → KE ∝ 1/m।"}}, {"s": "Mechanics", "a": 2, "en": {"q": "A simple pendulum is set swinging. Ignoring air friction, at which position does the bob have maximum kinetic energy and minimum potential energy?", "o": ["At either extreme position of the swing", "Halfway between the mean and the extreme", "At the lowest (mean) position of the swing", "At every position, as total energy is fixed"], "e": "At the extreme positions the bob stops for an instant (KE = 0, PE maximum). As it swings down, PE changes into KE, so at the lowest (mean) position the speed and KE are maximum and PE is minimum. The total stays constant.", "r": "Pendulum: mean position – max KE; extreme position – max PE."}, "hi": {"q": "एक सरल लोलक झुलाया जाता है। वायु घर्षण नगण्य मानें, तो किस स्थिति में गोलक की गतिज ऊर्जा अधिकतम और स्थितिज ऊर्जा न्यूनतम होती है?", "o": ["झूले की किसी भी चरम स्थिति पर", "माध्य और चरम स्थिति के बीचोंबीच", "झूले की सबसे निचली (माध्य) स्थिति पर", "हर स्थिति पर, क्योंकि कुल ऊर्जा नियत है"], "e": "चरम स्थितियों पर गोलक क्षण भर रुकता है (KE = 0, PE अधिकतम)। नीचे आते समय PE, KE में बदलती है, अतः सबसे निचली (माध्य) स्थिति पर चाल और KE अधिकतम तथा PE न्यूनतम होती है। कुल ऊर्जा नियत रहती है।", "r": "लोलक: माध्य स्थिति – अधिकतम KE; चरम स्थिति – अधिकतम PE।"}}, {"s": "Mechanics", "a": 3, "en": {"q": "Shears for cutting metal sheets have long handles and short blades, while scissors for cutting cloth have short handles and long blades. Why do metal-cutting shears have long handles?", "o": ["To make the blades move faster and farther", "To keep the fulcrum away from the load", "To reduce the work done in cutting the sheet", "To get a larger mechanical advantage with less effort"], "e": "Shears are Class I levers. Long handles (long effort arm) and short blades (short load arm) give a large mechanical advantage, so a small effort produces a large cutting force. The work done is not reduced – the effort moves through a larger distance.", "r": "No machine reduces work; it only lowers the effort or changes its direction."}, "hi": {"q": "धातु की चादर काटने वाली कैंची के हत्थे लंबे और फलक छोटे होते हैं, जबकि कपड़ा काटने वाली कैंची के हत्थे छोटे और फलक लंबे। धातु काटने वाली कैंची के हत्थे लंबे क्यों होते हैं?", "o": ["ताकि फलक तेज़ और अधिक दूर चलें", "ताकि आलंब भार से दूर रहे", "ताकि चादर काटने में किया गया कार्य कम हो", "ताकि कम प्रयास से अधिक यांत्रिक लाभ मिले"], "e": "कैंची वर्ग I उत्तोलक है। लंबे हत्थे (लंबी प्रयास-भुजा) और छोटे फलक (छोटी भार-भुजा) अधिक यांत्रिक लाभ देते हैं, अतः कम प्रयास से अधिक काटने वाला बल मिलता है। कार्य कम नहीं होता – प्रयास अधिक दूरी तय करता है।", "r": "कोई मशीन कार्य कम नहीं करती; केवल प्रयास घटाती या उसकी दिशा बदलती है।"}}, {"s": "Sound & Matter", "a": 0, "en": {"q": "During a storm, a person hears the thunder 3 s after seeing the lightning flash. If the speed of sound in air is 340 m/s, how far away did the lightning strike?", "o": ["1020 m", "340 m", "113 m", "2040 m"], "e": "Light travels so fast (3 × 10⁸ m/s) that the flash is seen almost instantly. The delay is the time taken by sound: d = v × t = 340 × 3 = 1020 m. (No factor of 2 – the sound travels one way, not as an echo.)", "r": "Echo: 2d = vt; one-way sound (thunder): d = vt."}, "hi": {"q": "तूफ़ान के दौरान एक व्यक्ति बिजली की चमक देखने के 3 s बाद गड़गड़ाहट सुनता है। वायु में ध्वनि की चाल 340 m/s हो, तो बिजली कितनी दूर गिरी?", "o": ["1020 m", "340 m", "113 m", "2040 m"], "e": "प्रकाश इतना तेज़ (3 × 10⁸ m/s) है कि चमक लगभग तुरंत दिखती है। देरी ध्वनि के समय की है: d = v × t = 340 × 3 = 1020 m। (2 का गुणक नहीं – ध्वनि एक ही दिशा में चलती है, प्रतिध्वनि नहीं।)", "r": "प्रतिध्वनि: 2d = vt; एक-तरफ़ा ध्वनि (गड़गड़ाहट): d = vt।"}}, {"s": "Sound & Matter", "a": 1, "en": {"q": "Some animals become restless a little before an earthquake, though people notice nothing. This is believed to be because these animals can hear:", "o": ["ultrasonic sound from rocks", "infrasonic sound from the earth", "echoes of their own calls", "supersonic waves in the air"], "e": "Earthquakes produce low-frequency infrasonic waves (below 20 Hz) before the main shock waves. Humans cannot hear them, but some animals can, so they get disturbed. Elephants and whales also communicate using infrasound.", "r": "Infrasonic < 20 Hz < audible < 20 kHz < ultrasonic."}, "hi": {"q": "भूकंप से थोड़ा पहले कुछ जानवर बेचैन हो जाते हैं, जबकि मनुष्यों को कुछ पता नहीं चलता। माना जाता है कि ऐसा इसलिए है क्योंकि ये जानवर सुन सकते हैं:", "o": ["चट्टानों से निकली पराश्रव्य ध्वनि", "पृथ्वी से निकली अवश्रव्य ध्वनि", "अपनी ही आवाज़ की प्रतिध्वनि", "वायु में पराध्वनिक तरंगें"], "e": "भूकंप मुख्य झटकों से पहले कम आवृत्ति की अवश्रव्य तरंगें (20 Hz से कम) उत्पन्न करता है। मनुष्य इन्हें नहीं सुन सकते, पर कुछ जानवर सुन लेते हैं, इसलिए बेचैन होते हैं। हाथी और व्हेल भी अवश्रव्य ध्वनि से संवाद करते हैं।", "r": "अवश्रव्य < 20 Hz < श्रव्य < 20 kHz < पराश्रव्य।"}}, {"s": "Light", "a": 2, "en": {"q": "Solar furnaces use large concave mirrors to produce very high temperatures. Which property of a concave mirror makes this possible?", "o": ["It forms a virtual image of the Sun behind it", "It spreads sunlight over a wide area", "It converges sunlight to a point at its focus", "It reflects only infrared rays of sunlight"], "e": "Rays from the Sun arrive parallel to the principal axis. A concave (converging) mirror reflects them to meet at its focus, concentrating the energy at one small spot and producing a very high temperature.", "r": "Concave mirror: solar furnace/cooker, headlights, shaving and dentist mirrors."}, "hi": {"q": "सौर भट्ठियों में बहुत उच्च ताप पाने के लिए बड़े अवतल दर्पण प्रयुक्त होते हैं। अवतल दर्पण का कौन-सा गुण इसे संभव बनाता है?", "o": ["यह अपने पीछे सूर्य का आभासी प्रतिबिंब बनाता है", "यह सूर्य प्रकाश को बड़े क्षेत्र में फैलाता है", "यह सूर्य प्रकाश को अपने फोकस पर एक बिंदु पर केंद्रित करता है", "यह सूर्य प्रकाश की केवल अवरक्त किरणें परावर्तित करता है"], "e": "सूर्य की किरणें मुख्य अक्ष के समांतर आती हैं। अवतल (अभिसारी) दर्पण उन्हें परावर्तित कर अपने फोकस पर मिलाता है, जिससे ऊर्जा एक छोटे स्थान पर केंद्रित होकर बहुत उच्च ताप देती है।", "r": "अवतल दर्पण: सौर भट्ठी/कुकर, हेडलाइट, शेविंग और दंत दर्पण।"}}, {"s": "Light", "a": 0, "en": {"q": "An object 4 cm tall is placed 15 cm in front of a concave lens of focal length 10 cm. What is the height of the image formed?", "o": ["1.6 cm", "2.4 cm", "6.0 cm", "10 cm"], "e": "f = −10 cm, u = −15 cm. 1/v = 1/f + 1/u = −1/10 − 1/15 = −1/6 ⇒ v = −6 cm. m = v/u = (−6)/(−15) = 0.4. Image height = 0.4 × 4 = 1.6 cm (virtual, erect, diminished).", "r": "Concave lens always gives a virtual, erect, diminished image."}, "hi": {"q": "4 cm ऊँची एक वस्तु 10 cm फोकस दूरी वाले अवतल लेंस के सामने 15 cm पर रखी है। बने प्रतिबिंब की ऊँचाई क्या है?", "o": ["1.6 cm", "2.4 cm", "6.0 cm", "10 cm"], "e": "f = −10 cm, u = −15 cm। 1/v = 1/f + 1/u = −1/10 − 1/15 = −1/6 ⇒ v = −6 cm। m = v/u = (−6)/(−15) = 0.4। प्रतिबिंब की ऊँचाई = 0.4 × 4 = 1.6 cm (आभासी, सीधा, छोटा)।", "r": "अवतल लेंस सदैव आभासी, सीधा, छोटा प्रतिबिंब बनाता है।"}}, {"s": "Light", "a": 2, "en": {"q": "A ray of light passes obliquely from medium A into medium B and bends away from the normal. Which conclusion about the two media is correct?", "o": ["Medium B is optically denser than medium A", "Light travels slower in medium B than in A", "Medium A is optically denser than medium B", "Both media have the same refractive index"], "e": "Light bends away from the normal when it goes from an optically denser medium to a rarer one, i.e. it speeds up. So A is denser (higher refractive index) and light travels faster in B.", "r": "Towards the normal → entering denser (slower); away from the normal → entering rarer (faster)."}, "hi": {"q": "प्रकाश की एक किरण माध्यम A से माध्यम B में तिरछी जाती है और अभिलंब से दूर मुड़ती है। दोनों माध्यमों के बारे में कौन-सा निष्कर्ष सही है?", "o": ["माध्यम B, माध्यम A से प्रकाशतः सघन है", "प्रकाश माध्यम B में A से धीमा चलता है", "माध्यम A, माध्यम B से प्रकाशतः सघन है", "दोनों माध्यमों का अपवर्तनांक समान है"], "e": "प्रकाश प्रकाशतः सघन से विरल माध्यम में जाने पर अभिलंब से दूर मुड़ता है, अर्थात तेज़ हो जाता है। अतः A सघन (अधिक अपवर्तनांक) है और B में प्रकाश तेज़ चलता है।", "r": "अभिलंब की ओर → सघन में प्रवेश (धीमा); अभिलंब से दूर → विरल में प्रवेश (तेज़)।"}}, {"s": "Light", "a": 0, "en": {"q": "A convex glass lens is taken from air and completely immersed in water. Compared with its value in air, the focal length of the lens:", "o": ["increases, so the lens becomes weaker", "decreases, so the lens becomes stronger", "stays the same, as the lens is unchanged", "becomes zero, so the lens stops working"], "e": "The difference between the refractive indices of glass (1.5) and water (1.33) is much less than between glass and air (1.0). So light bends less at the lens surfaces, the focal length increases and the power decreases.", "r": "Bending depends on the difference in refractive index of the two media."}, "hi": {"q": "काँच का एक उत्तल लेंस वायु से निकालकर पूरी तरह पानी में डुबो दिया जाता है। वायु की तुलना में लेंस की फोकस दूरी:", "o": ["बढ़ जाती है, अतः लेंस कमज़ोर हो जाता है", "घट जाती है, अतः लेंस प्रबल हो जाता है", "समान रहती है, क्योंकि लेंस वही है", "शून्य हो जाती है, अतः लेंस काम करना बंद कर देता है"], "e": "काँच (1.5) और पानी (1.33) के अपवर्तनांकों का अंतर, काँच और वायु (1.0) के अंतर से बहुत कम है। अतः लेंस की सतहों पर प्रकाश कम मुड़ता है, फोकस दूरी बढ़ती है और क्षमता घटती है।", "r": "मुड़ना दोनों माध्यमों के अपवर्तनांक के अंतर पर निर्भर करता है।"}}, {"s": "Light", "a": 3, "en": {"q": "Total internal reflection is used in optical fibres. Which pair of conditions is necessary for total internal reflection to occur?", "o": ["Rarer to denser medium; angle more than critical", "Denser to rarer medium; angle less than critical", "Rarer to denser medium; angle less than critical", "Denser to rarer medium; angle more than critical"], "e": "TIR needs (1) light travelling from an optically denser medium to a rarer medium and (2) the angle of incidence greater than the critical angle. Then all the light is reflected back into the denser medium.", "r": "sin C = 1/n; diamond (n ≈ 2.42) has a small critical angle, so it sparkles."}, "hi": {"q": "ऑप्टिकल फाइबर में पूर्ण आंतरिक परावर्तन का उपयोग होता है। पूर्ण आंतरिक परावर्तन होने के लिए कौन-सी दो शर्तें आवश्यक हैं?", "o": ["विरल से सघन माध्यम; कोण क्रांतिक से अधिक", "सघन से विरल माध्यम; कोण क्रांतिक से कम", "विरल से सघन माध्यम; कोण क्रांतिक से कम", "सघन से विरल माध्यम; कोण क्रांतिक से अधिक"], "e": "पूर्ण आंतरिक परावर्तन के लिए (1) प्रकाश प्रकाशतः सघन से विरल माध्यम में जा रहा हो और (2) आपतन कोण क्रांतिक कोण से अधिक हो। तब सारा प्रकाश सघन माध्यम में वापस परावर्तित होता है।", "r": "sin C = 1/n; हीरे (n ≈ 2.42) का क्रांतिक कोण छोटा है, इसलिए वह चमकता है।"}}, {"s": "Light", "a": 1, "en": {"q": "On entering a dark cinema hall from bright sunlight, we cannot see clearly for some time. Which part of the eye takes time to adjust, causing this?", "o": ["The cornea takes time to become clear", "The iris takes time to widen the pupil", "The retina takes time to grow new cells", "The eye lens takes time to become flat"], "e": "In bright light the iris keeps the pupil small. In the dark, the iris slowly widens the pupil to let in more light; until it does, too little light reaches the retina and we cannot see clearly.", "r": "Iris controls the size of the pupil, i.e. the amount of light entering the eye."}, "hi": {"q": "तेज़ धूप से अँधेरे सिनेमा हॉल में जाने पर कुछ देर तक हमें स्पष्ट दिखाई नहीं देता। आँख का कौन-सा भाग समायोजन में समय लेता है, जिससे ऐसा होता है?", "o": ["कॉर्निया को साफ़ होने में समय लगता है", "परितारिका को पुतली फैलाने में समय लगता है", "रेटिना को नई कोशिकाएँ बनाने में समय लगता है", "नेत्र लेंस को चपटा होने में समय लगता है"], "e": "तेज़ प्रकाश में परितारिका पुतली को छोटा रखती है। अँधेरे में परितारिका धीरे-धीरे पुतली को फैलाती है ताकि अधिक प्रकाश आए; तब तक रेटिना तक कम प्रकाश पहुँचता है और स्पष्ट नहीं दिखता।", "r": "परितारिका पुतली का आकार, अर्थात आँख में आने वाले प्रकाश की मात्रा नियंत्रित करती है।"}}, {"s": "Light", "a": 0, "en": {"q": "Humans have two eyes placed side by side instead of one. What is the main advantage of having two eyes?", "o": ["A wider field of view and a sense of depth", "The ability to see in complete darkness", "Double the number of colours we see", "No need for accommodation by the eye lens"], "e": "Two eyes give a wider field of view (about 180° compared with about 150° for one eye). Each eye sees a slightly different picture, and the brain combines them to judge depth and distance (three-dimensional vision).", "r": "Two eyes → wider view + depth (3-D) perception."}, "hi": {"q": "मनुष्य की एक नहीं, बल्कि अगल-बगल दो आँखें होती हैं। दो आँखें होने का मुख्य लाभ क्या है?", "o": ["विस्तृत दृष्टि-क्षेत्र और गहराई का बोध", "पूर्ण अँधेरे में देखने की क्षमता", "दिखने वाले रंगों की संख्या दोगुनी", "नेत्र लेंस द्वारा समंजन की आवश्यकता नहीं"], "e": "दो आँखें विस्तृत दृष्टि-क्षेत्र देती हैं (एक आँख के लगभग 150° की तुलना में लगभग 180°)। हर आँख थोड़ा अलग चित्र देखती है और मस्तिष्क दोनों को मिलाकर गहराई और दूरी का अनुमान लगाता है (त्रिविमीय दृष्टि)।", "r": "दो आँखें → विस्तृत दृश्य + गहराई (3-D) बोध।"}}, {"s": "Light", "a": 3, "en": {"q": "When white light is dispersed by a glass prism, which colour has the longest wavelength and is deviated the least?", "o": ["Violet", "Green", "Blue", "Red"], "e": "Red light has the longest wavelength in the visible spectrum and the lowest refractive index in glass, so it bends the least. Violet has the shortest wavelength and bends the most.", "r": "Longer wavelength → less deviation and less scattering (that is why danger signals are red)."}, "hi": {"q": "काँच के प्रिज़्म द्वारा श्वेत प्रकाश के वर्ण-विक्षेपण में किस रंग की तरंगदैर्ध्य सबसे अधिक होती है और वह सबसे कम विचलित होता है?", "o": ["बैंगनी", "हरा", "नीला", "लाल"], "e": "दृश्य स्पेक्ट्रम में लाल प्रकाश की तरंगदैर्ध्य सबसे अधिक और काँच में अपवर्तनांक सबसे कम है, अतः वह सबसे कम मुड़ता है। बैंगनी की तरंगदैर्ध्य सबसे कम है और वह सबसे अधिक मुड़ता है।", "r": "अधिक तरंगदैर्ध्य → कम विचलन और कम प्रकीर्णन (इसीलिए खतरे के संकेत लाल)।"}}, {"s": "Electricity & Magnetism", "a": 1, "en": {"q": "A current of 2 A flows through a resistor of 10 Ω for 5 minutes. How much heat is produced in the resistor?", "o": ["100 J", "12,000 J", "6000 J", "1200 J"], "e": "Joule's law of heating: H = I²Rt = 2² × 10 × (5 × 60) = 4 × 10 × 300 = 12,000 J.", "r": "H = I²Rt – square the current and take time in seconds."}, "hi": {"q": "10 Ω के एक प्रतिरोधक में 5 मिनट तक 2 A धारा बहती है। प्रतिरोधक में कितनी ऊष्मा उत्पन्न होगी?", "o": ["100 J", "12,000 J", "6000 J", "1200 J"], "e": "जूल का तापन नियम: H = I²Rt = 2² × 10 × (5 × 60) = 4 × 10 × 300 = 12,000 J।", "r": "H = I²Rt – धारा का वर्ग करें और समय सेकंड में लें।"}}, {"s": "Electricity & Magnetism", "a": 2, "en": {"q": "An electric fuse protects household circuits. Which description of a fuse wire and its connection is correct?", "o": ["High melting point; connected in the neutral wire", "Low melting point; connected in parallel with the load", "Low melting point; in series with the live wire", "High melting point; in series with the earth wire"], "e": "A fuse wire is made of an alloy with a low melting point. It is connected in series with the live wire, so when an excess current flows (short circuit or overload), it melts and breaks the circuit before the appliances are damaged.", "r": "Fuse: low melting point, series, live wire. Rating just above normal current."}, "hi": {"q": "विद्युत फ्यूज़ घरेलू परिपथों की रक्षा करता है। फ्यूज़ तार और उसके संयोजन का कौन-सा वर्णन सही है?", "o": ["उच्च गलनांक; उदासीन तार में जुड़ा", "निम्न गलनांक; लोड के समांतर जुड़ा", "निम्न गलनांक; विद्युन्मय तार के श्रेणी में", "उच्च गलनांक; भू-संपर्क तार के श्रेणी में"], "e": "फ्यूज़ तार निम्न गलनांक वाली मिश्रधातु का बना होता है। यह विद्युन्मय तार के श्रेणी में जुड़ा होता है, अतः अत्यधिक धारा (लघुपथन या अतिभारण) बहने पर पिघलकर उपकरणों के क्षतिग्रस्त होने से पहले परिपथ तोड़ देता है।", "r": "फ्यूज़: निम्न गलनांक, श्रेणी में, विद्युन्मय तार। रेटिंग सामान्य धारा से थोड़ी अधिक।"}}, {"s": "Electricity & Magnetism", "a": 3, "en": {"q": "In a house, the fan, the tube light and the TV are connected in parallel, not in series. What is the main advantage of this arrangement?", "o": ["The total resistance of the circuit increases", "The same current flows through every appliance", "Each appliance draws exactly the same power", "Each gets full voltage and works independently"], "e": "In parallel, every appliance is connected directly across the mains, so each gets the full 220 V. Each has its own path and switch, so it can be used independently, and one failing does not affect the others.", "r": "Parallel: same voltage, independent working, lower total resistance."}, "hi": {"q": "एक घर में पंखा, ट्यूबलाइट और टीवी श्रेणी में नहीं, बल्कि समांतर में जुड़े हैं। इस व्यवस्था का मुख्य लाभ क्या है?", "o": ["परिपथ का कुल प्रतिरोध बढ़ जाता है", "हर उपकरण में समान धारा बहती है", "हर उपकरण ठीक समान शक्ति लेता है", "हर एक को पूरी वोल्टता, स्वतंत्र रूप से चलता है"], "e": "समांतर में हर उपकरण सीधे मुख्य आपूर्ति से जुड़ा होता है, अतः हर एक को पूरे 220 V मिलते हैं। हर एक का अपना पथ और स्विच है, इसलिए वह स्वतंत्र रूप से चलता है, और एक के खराब होने से बाकी प्रभावित नहीं होते।", "r": "समांतर: समान वोल्टता, स्वतंत्र कार्य, कम कुल प्रतिरोध।"}}, {"s": "Electricity & Magnetism", "a": 0, "en": {"q": "A compass needle kept close to a straight wire deflects as soon as the current in the wire is switched on. What does this observation show?", "o": ["An electric current produces a magnetic field around it", "A magnet produces an electric current in the wire", "The wire itself becomes a permanent magnet", "The compass needle conducts current from the wire"], "e": "This is Oersted's experiment (1820). The needle deflects because the current sets up a magnetic field around the wire. When the current is switched off, the needle returns, so the wire does not become a permanent magnet.", "r": "Current → magnetic field (Oersted); changing magnetic field → current (Faraday)."}, "hi": {"q": "सीधे तार के पास रखी दिक्सूचक सुई तार में धारा चालू करते ही विक्षेपित हो जाती है। यह प्रेक्षण क्या दर्शाता है?", "o": ["विद्युत धारा अपने चारों ओर चुंबकीय क्षेत्र उत्पन्न करती है", "चुंबक तार में विद्युत धारा उत्पन्न करता है", "तार स्वयं स्थायी चुंबक बन जाता है", "दिक्सूचक सुई तार से धारा का चालन करती है"], "e": "यह ओर्स्टेड का प्रयोग (1820) है। सुई इसलिए विक्षेपित होती है क्योंकि धारा तार के चारों ओर चुंबकीय क्षेत्र बनाती है। धारा बंद करने पर सुई लौट आती है, अतः तार स्थायी चुंबक नहीं बनता।", "r": "धारा → चुंबकीय क्षेत्र (ओर्स्टेड); बदलता चुंबकीय क्षेत्र → धारा (फैराडे)।"}}, {"s": "Electricity & Magnetism", "a": 1, "en": {"q": "Which device works on the principle that a current-carrying coil placed in a magnetic field experiences a force and rotates?", "o": ["Electric generator", "Electric motor", "Transformer", "Electric fuse"], "e": "An electric motor converts electrical energy into mechanical energy. The current-carrying coil in the magnetic field experiences forces (Fleming's left-hand rule) that rotate it; a split-ring commutator keeps it turning in one direction.", "r": "Motor: electrical → mechanical (left hand). Generator: mechanical → electrical (right hand)."}, "hi": {"q": "कौन-सा उपकरण इस सिद्धांत पर कार्य करता है कि चुंबकीय क्षेत्र में रखी धारावाही कुंडली बल अनुभव कर घूमती है?", "o": ["विद्युत जनित्र", "विद्युत मोटर", "ट्रांसफॉर्मर", "विद्युत फ्यूज़"], "e": "विद्युत मोटर विद्युत ऊर्जा को यांत्रिक ऊर्जा में बदलती है। चुंबकीय क्षेत्र में धारावाही कुंडली पर बल लगते हैं (फ्लेमिंग वाम-हस्त नियम) जो उसे घुमाते हैं; विभक्त वलय दिक्परिवर्तक उसे एक ही दिशा में घुमाता रहता है।", "r": "मोटर: विद्युत → यांत्रिक (वाम हस्त)। जनित्र: यांत्रिक → विद्युत (दक्षिण हस्त)।"}}, {"s": "Sound & Matter", "a": 1, "en": {"q": "Hydroelectric power is renewable, yet large dams are opposed by many people. What is the main environmental concern about building large dams?", "o": ["They release smoke and greenhouse gases", "They submerge land and displace local people", "They use up coal and petroleum reserves", "They produce harmful radioactive waste"], "e": "Large dams flood vast areas of forest and farmland, destroy habitats and displace local communities, and can upset river ecosystems. They do not burn fuel or produce radioactive waste.", "r": "Every energy source has a cost: dams – displacement; fossil fuels – pollution; nuclear – radioactive waste."}, "hi": {"q": "जलविद्युत नवीकरणीय है, फिर भी बड़े बाँधों का कई लोग विरोध करते हैं। बड़े बाँध बनाने की मुख्य पर्यावरणीय चिंता क्या है?", "o": ["ये धुआँ और ग्रीनहाउस गैसें छोड़ते हैं", "ये भूमि डुबो देते हैं और स्थानीय लोगों को विस्थापित करते हैं", "ये कोयले और पेट्रोलियम के भंडार खर्च करते हैं", "ये हानिकारक रेडियोधर्मी अपशिष्ट बनाते हैं"], "e": "बड़े बाँध वनों और खेतों के विशाल क्षेत्र डुबो देते हैं, आवास नष्ट करते हैं, स्थानीय समुदायों को विस्थापित करते हैं और नदी के पारितंत्र बिगाड़ सकते हैं। ये ईंधन नहीं जलाते और रेडियोधर्मी अपशिष्ट नहीं बनाते।", "r": "हर ऊर्जा स्रोत की कीमत: बाँध – विस्थापन; जीवाश्म ईंधन – प्रदूषण; नाभिकीय – रेडियोधर्मी अपशिष्ट।"}}];

function setLang(x){L=x;$('#lEN').classList.toggle('on',x==='en');$('#lHI').classList.toggle('on',x==='hi');document.documentElement.lang=x;render()}
$('#lEN').onclick=()=>setLang('en');$('#lHI').onclick=()=>setLang('hi');
function home(){mode=null;done=false;clearInterval(tick);$('#timer').classList.add('hide');render()}
function start(m){mode=m;cur=0;resp=Array(Q.length).fill(null);done=false;filt='all';clearInterval(tick);$('#timer').classList.add('hide');
 if(m==='test'){left=META.mins*60;$('#timer').classList.remove('hide');showTime();tick=setInterval(()=>{left--;showTime();if(left<=0){finish()}},1000)}
 render();window.scrollTo(0,0)}
function showTime(){const m=Math.max(0,Math.floor(left/60)),s=Math.max(0,left%60);$('#timer').textContent='⏱ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function finish(){done=true;clearInterval(tick);$('#timer').classList.add('hide');render();window.scrollTo(0,0)}
function stats(){let c=0,w=0,s=0,by={};Q.forEach((q,i)=>{const b=by[q.s]=by[q.s]||{n:0,c:0,w:0};b.n++;if(resp[i]===null){s++}else if(resp[i]===q.a){c++;b.c++}else{w++;b.w++}});return{c,w,s,by,score:+(c-w/3).toFixed(2)}}
function qcard(i,showAns,tag){const q=Q[i],d=q[L],r=resp[i];
 let h=`<div class="card"><div class="qhead"><span class="qno">${t('q')} ${i+1} / ${Q.length}</span><span>${tag||''} <span class="sec">${sec(q.s)}</span></span></div><div class="qt">${esc(d.q)}</div>`;
 d.o.forEach((o,j)=>{let c='';if(showAns){if(j===q.a)c='ok';else if(r===j)c='bad'}else if(r===j)c='sel';
  h+=`<button class="opt ${c}" data-j="${j}" ${showAns?'disabled':''}><span class="k">(${K[j]})</span><span>${esc(o)}</span></button>`});
 if(showAns)h+=`<div class="exp"><b>${t('ans')}: (${K[q.a]})</b> ${esc(d.e)}<div class="rm">💡 ${t('rem')}${esc(d.r)}</div></div>`;
 return h+'</div>'}
function render(){
 if(!mode){app.innerHTML=`<div class="card"><div class="sub">${META.kicker}</div><h1>${META.title}</h1><div class="sub">${L==='hi'?META.subhi:META.sub}</div>
 <div class="chips"><span>${Q.length} Qs</span><span>⏱ ${META.mins} min</span><span>+1 / −1/3</span><span>EN | हिंदी</span></div>
 <h2>${t('start')}</h2><div class="modes"><button class="mode" id="mT"><b>📝 ${t('test')}</b>${t('testd')}</button><button class="mode" id="mP"><b>🎯 ${t('prac')}</b>${t('pracd')}</button></div>
 <ul class="rules">${t('rules').map(x=>'<li>'+x+'</li>').join('')}</ul></div>`;$('#mT').onclick=()=>start('test');$('#mP').onclick=()=>start('prac');return}
 if(done)return result();
 const showAns=mode==='prac'&&resp[cur]!==null;
 let h=qcard(cur,showAns);
 h+=`<div class="nav"><button class="btn s" id="bP" ${cur===0?'disabled':''}>${t('prev')}</button>`+(mode==='test'?`<button class="btn s" id="bC">${t('clear')}</button>`:'')+(cur<Q.length-1?`<button class="btn p" id="bN">${t('next')}</button>`:`<button class="btn d" id="bF">${mode==='test'?t('submit'):t('finish')}</button>`)+`</div>`;
 h+=`<div class="card" style="margin-top:14px"><div class="qhead"><b>${t('pal')}</b>`+(mode==='prac'?`<span class="sec">${t('pscore')}: ${stats().score}</span>`:'')+`</div><div class="pal">${Q.map((q,i)=>{let c='';if(mode==='prac'&&resp[i]!==null)c=resp[i]===q.a?'ok':'bad';else if(resp[i]!==null)c='ans';return `<button class="${c} ${i===cur?'cur':''}" data-i="${i}">${i+1}</button>`}).join('')}</div>`+(mode==='test'?`<div class="nav"><span></span><button class="btn d" id="bS">${t('submit')}</button></div>`:'')+`</div>`;
 app.innerHTML=h;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(mode==='prac'&&resp[cur]!==null)return;resp[cur]=+b.dataset.j;render()});
 app.querySelectorAll('.pal button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render()});
 const go=d=>{cur+=d;render();window.scrollTo(0,0)};
 if($('#bP'))$('#bP').onclick=()=>go(-1);if($('#bN'))$('#bN').onclick=()=>go(1);
 if($('#bC'))$('#bC').onclick=()=>{resp[cur]=null;render()};
 const sub=()=>{if(confirm(t('confirm')))finish()};
 if($('#bS'))$('#bS').onclick=sub;
 if($('#bF'))$('#bF').onclick=mode==='test'?sub:()=>finish();
}
function result(){const st=stats(),att=st.c+st.w,acc=att?Math.round(st.c/att*100):0;
 let h=`<div class="card"><h2>${t('res')} · ${META.title}</h2><div class="score"><div><b>${st.score} / ${Q.length}</b>${t('sc')}</div><div><b style="color:var(--ok)">${st.c}</b>${t('cor')}</div><div><b style="color:var(--bad)">${st.w}</b>${t('wr')}</div><div><b>${st.s}</b>${t('sk')}</div></div>
 <p class="sub">${t('acc')}: ${acc}%</p><h2>${t('secw')}</h2><table><tr><th>${t('secn')}</th><th>Qs</th><th>${t('cor')}</th><th>${t('wr')}</th><th>${t('sc')}</th></tr>${Object.entries(st.by).map(([k,b])=>`<tr><td>${sec(k)}</td><td>${b.n}</td><td>${b.c}</td><td>${b.w}</td><td>${+(b.c-b.w/3).toFixed(2)}</td></tr>`).join('')}</table>
 <div class="nav"><button class="btn p" id="bR">${t('retry')}</button><button class="btn s" id="bH">${t('home')}</button></div></div>
 <div class="card"><h2>${t('sol')}</h2><div class="filters">${[['all',t('all')],['ok',t('cor')],['bad',t('wr')],['sk',t('sk')]].map(([k,n])=>`<button data-f="${k}" class="${filt===k?'on':''}">${n}</button>`).join('')}</div></div>`;
 Q.forEach((q,i)=>{const r=resp[i],s2=r===null?'sk':(r===q.a?'ok':'bad');if(filt!=='all'&&filt!==s2)return;
  const tg=s2==='ok'?`<span class="tag ok">✔ ${t('cor')}</span>`:s2==='bad'?`<span class="tag bad">✘ ${t('your')}: (${K[r]})</span>`:`<span class="tag sk">${t('skipped')}</span>`;
  h+=qcard(i,true,tg)});
 app.innerHTML=h;$('#bR').onclick=()=>start(mode);$('#bH').onclick=home;
 app.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filt=b.dataset.f;render()})}
render();
</script></body></html>
