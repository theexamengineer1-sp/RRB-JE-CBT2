button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
main{padding:18px 16px 40px}

.qno{font-weight:800;color:var(--navy)}

.opt.right{border-color:var(--ok);background:var(--ok-bg)}

.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}

.tools button.primary{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}

.hidden{display:none !important}
.result{background:var(--card);border:2px solid var(--orange);border-radius:12px;padding:16px;margin-bottom:18px}

.rgrid div{background:var(--opt);border-radius:8px;padding:8px 10px}
.rgrid b{display:block;font-size:1.3rem}
.result p{margin:10px 0 0;color:var(--muted);font-size:.9rem}
.start{position:fixed;inset:0;z-index:20;background:rgba(8,18,40,.78);display:flex;align-items:center;justify-content:center;padding:16px}

.start h2{margin:0 0 6px;font-size:1.3rem;color:var(--navy)}
@media (prefers-color-scheme: dark){.start h2{color:#8fb0f5}}
.start p{margin:0 0 16px;color:var(--muted);font-size:.92rem}
.start .big{display:block;width:100%;margin:10px 0;padding:14px;border-radius:10px;font:inherit;font-size:1.05rem;font-weight:800;cursor:pointer;border:2px solid var(--navy);background:var(--opt);color:var(--text)}
.start .big.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.start .big small{display:block;font-weight:500;font-size:.82rem;opacity:.9;margin-top:2px}
.start .seg{margin-top:10px}
.ex{margin-top:12px;background:var(--ex-bg);border:1px solid var(--ex-line);border-radius:8px;padding:12px 14px;font-size:.95rem}
.ex .ans{font-weight:800;color:var(--ok);margin-bottom:4px}
.ex .verdict-bad{color:var(--bad)}
.sec{margin:24px 0 12px;font-weight:800;color:var(--orange);font-size:1.05rem;border-bottom:2px solid var(--line);padding-bottom:4px}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:10px 16px 30px}
footer a{color:var(--orange)}
@media (prefers-reduced-motion: no-preference){.ex{animation:show .25s ease-out}

e:"In a <b>shaper</b> the <b>tool</b>, held in the tool head on a <b>horizontal ram</b>, reciprocates; the <b>job</b> on the table is fed sideways at the end of each return stroke. It produces flat, stepped and grooved surfaces on small and medium jobs.<br><b>Why not the others:</b> (a) in a <b>planer</b> the <b>job</b> reciprocates under a fixed tool – for large, heavy jobs; (c) a <b>slotter</b> is a vertical shaper – its ram moves up and down, for internal keyways and slots; (d) a <b>broaching machine</b> uses a multi-point broach and finishes the job in one stroke, with no step-by-step feed.<br><b>HOOK:</b> shaper → tool moves · planer → work moves · slotter → tool moves vertically.<br><b>PYQ:</b> size of a shaper = maximum stroke length (RRB-CBT2 2019)."},

e:"<b>शेपर</b> में <b>क्षैतिज रैम</b> पर टूल हेड में लगा <b>टूल</b> आगे-पीछे चलता है; टेबल पर लगे <b>जॉब</b> को हर वापसी स्ट्रोक के अंत में साइड में फ़ीड दी जाती है। इससे छोटे व मध्यम जॉब पर समतल, स्टेप व खाँचेदार सतहें बनती हैं।<br><b>अन्य क्यों नहीं:</b> (a) <b>प्लेनर</b> में स्थिर टूल के नीचे <b>जॉब</b> आगे-पीछे चलता है – बड़े, भारी जॉब हेतु; (c) <b>स्लॉटर</b> ऊर्ध्वाधर शेपर है – रैम ऊपर-नीचे चलता है, भीतरी की-वे व स्लॉट हेतु; (d) <b>ब्रोचिंग मशीन</b> मल्टी-पॉइंट ब्रोच से एक ही स्ट्रोक में जॉब पूरा करती है, स्टेप-दर-स्टेप फ़ीड नहीं।<br><b>याद रखें:</b> शेपर → टूल चलता है · प्लेनर → जॉब चलता है · स्लॉटर → टूल ऊर्ध्वाधर चलता है।<br><b>PYQ:</b> शेपर का आकार = अधिकतम स्ट्रोक लंबाई (RRB-CBT2 2019)।"}},

e:"For a tool with nose radius R, the feed marks are arcs of the nose, and the theoretical peak-to-valley height is<br><b>h = f² / 8R</b> = (0.2)² / (8 × 0.8) = 0.04 / 6.4 = 0.00625 mm = <b>6.25 µm</b>.<br><b>Distractor check:</b> (a) 3.1 µm = f²/16R (wrong constant); (d) 12.5 µm = f²/4R; (b) 25 µm = f²/2R.<br><b>What it teaches:</b> h ∝ f² and ∝ 1/R – halving the feed cuts roughness to one-fourth; doubling the nose radius halves it. So <b>finish improves with a lower feed, a larger nose radius and a higher speed</b> (Old Railway JE/SSE). A larger nose radius also raises tool life (it strengthens the tip), but too large a radius causes chatter.<br><b>PYQ link:</b> 'to keep the same finish when the feed is doubled, the nose radius must be made four times' (from h = f²/8R)."},
hi:{q:"0.8 mm नोज़ रेडियस वाला टर्निंग टूल 0.2 mm/rev फ़ीड पर काटता है। टर्न की गई सतह की सैद्धांतिक पीक-टू-वैली ऊँचाई लगभग है:",
o:["3.1 µm","25 µm","6.25 µm","12.5 µm"],
e:"नोज़ रेडियस R वाले टूल के फ़ीड निशान नोज़ के चाप होते हैं, और सैद्धांतिक पीक-टू-वैली ऊँचाई<br><b>h = f² / 8R</b> = (0.2)² / (8 × 0.8) = 0.04 / 6.4 = 0.00625 mm = <b>6.25 µm</b>।<br><b>गलत विकल्प कैसे बने:</b> (a) 3.1 µm = f²/16R (गलत स्थिरांक); (d) 12.5 µm = f²/4R; (b) 25 µm = f²/2R।<br><b>सीख:</b> h ∝ f² तथा ∝ 1/R – फ़ीड आधी करने पर खुरदरापन एक-चौथाई; नोज़ रेडियस दोगुना करने पर आधा। अतः <b>कम फ़ीड, बड़ा नोज़ रेडियस व अधिक स्पीड से फ़िनिश बेहतर</b> (पुराना रेलवे JE/SSE)। बड़ा नोज़ रेडियस टूल जीवन भी बढ़ाता है (टिप मज़बूत), पर बहुत बड़ा रेडियस चैटर लाता है।<br><b>PYQ संबंध:</b> 'फ़ीड दोगुनी होने पर वही फ़िनिश रखने हेतु नोज़ रेडियस चार गुना करना होगा' (h = f²/8R से)।"}},

o:["duplicating lathe","tool-room lathe","T-lathe","gap-bed lathe"],
e:"A <b>duplicating (copying or tracer) lathe</b> has a stylus that follows a master template or a master part; through a hydraulic or mechanical link the tool slide copies the same profile on each job. It gives identical stepped or contoured shafts without the operator measuring each step.<br><b>Why not the others:</b> (b) a <b>tool-room lathe</b> is a precision engine lathe with a wide speed range, for tools and gauges – one-off accurate work, not copying; (c) a <b>T-lathe</b> is a special lathe for large rotors and jet-engine parts; (d) a <b>gap-bed lathe</b> has a removable bed piece near the headstock to swing extra-large diameters.<br><b>Special-purpose lathes (notes):</b> wheel lathe – railway wheels and journals (RRB-CBT2 Jun'25); gap-bed – large diameters; T-lathe – rotors; duplicating – copying profiles. Today CNC lathes do this job by program."},
hi:{q:"एक वर्कशॉप को 200 स्टेप्ड शाफ़्ट टर्न करने हैं, जिनकी प्रोफ़ाइल मास्टर टेम्पलेट से बिल्कुल मेल खानी चाहिए। एक स्टाइलस टेम्पलेट को ट्रेस करता है और टूल उसकी नकल करता है। प्रयुक्त लेथ है:",
o:["डुप्लिकेटिंग लेथ","टूल-रूम लेथ","T-लेथ","गैप-बेड लेथ"],
e:"<b>डुप्लिकेटिंग (कॉपीइंग या ट्रेसर) लेथ</b> में एक स्टाइलस मास्टर टेम्पलेट या मास्टर पुर्ज़े का अनुसरण करता है; हाइड्रोलिक या यांत्रिक लिंक से टूल स्लाइड हर जॉब पर वही प्रोफ़ाइल कॉपी करती है। इससे ऑपरेटर को हर स्टेप मापे बिना एक-जैसे स्टेप्ड या कंटूर शाफ़्ट मिलते हैं।<br><b>अन्य क्यों नहीं:</b> (b) <b>टूल-रूम लेथ</b> विस्तृत स्पीड रेंज वाली परिशुद्ध इंजन लेथ है, टूल व गेज हेतु – एकल सटीक कार्य, नकल नहीं; (c) <b>T-लेथ</b> बड़े रोटर व जेट-इंजन पुर्ज़ों हेतु विशेष लेथ; (d) <b>गैप-बेड लेथ</b> में हेडस्टॉक के पास हटने योग्य बेड-टुकड़ा होता है, बहुत बड़े व्यास घुमाने हेतु।<br><b>विशेष लेथ (नोट्स):</b> व्हील लेथ – रेलवे पहिए व जर्नल (RRB-CBT2 Jun'25); गैप-बेड – बड़े व्यास; T-लेथ – रोटर; डुप्लिकेटिंग – प्रोफ़ाइल कॉपी। आज यह काम CNC लेथ प्रोग्राम से करती है।"}},

/* 4 */ {ans:3, lv:"p", tag:{en:"Tool materials",hi:"टूल पदार्थ"},
en:{q:"Stellite, a cast tool alloy, is mainly made of:",
o:["tungsten, chromium and vanadium","tungsten carbide and cobalt","aluminium oxide with a binder","cobalt, chromium and tungsten"],
e:"<b>Stellite</b> is a <b>cast cobalt-base alloy</b> – roughly 40–50% cobalt, 25–35% chromium and 15–20% tungsten, with about 2% carbon. It is cast to shape (it cannot be forged or heat-treated) and keeps its hardness up to about <b>800 °C</b> – between high-speed steel (about 600 °C) and cemented carbide (about 1000 °C). Taylor exponent n ≈ 0.18.<br><b>Why not the others:</b> (a) tungsten-chromium-vanadium in iron = <b>18-4-1 high-speed steel</b>; (b) tungsten carbide sintered with cobalt = <b>cemented carbide</b>; (c) aluminium oxide = <b>ceramic</b> tool.<br><b>Order of cutting-speed capability:</b> carbon steel &lt; HSS &lt; Stellite &lt; carbide &lt; ceramic &lt; CBN/diamond (Old Railway JE/SSE). Most important tool property = red (hot) hardness."},
hi:{q:"स्टेलाइट, एक ढलवाँ टूल मिश्रधातु, मुख्यतः किससे बनी होती है?",
o:["टंगस्टन, क्रोमियम और वैनेडियम","टंगस्टन कार्बाइड और कोबाल्ट","बाइंडर सहित एल्युमिनियम ऑक्साइड","कोबाल्ट, क्रोमियम और टंगस्टन"],
e:"<b>स्टेलाइट</b> एक <b>ढलवाँ कोबाल्ट-आधारित मिश्रधातु</b> है – लगभग 40–50% कोबाल्ट, 25–35% क्रोमियम, 15–20% टंगस्टन व लगभग 2% कार्बन। इसे ढालकर आकार दिया जाता है (फ़ोर्ज या ऊष्मा उपचार नहीं होता) और यह लगभग <b>800 °C</b> तक कठोरता रखती है – हाई-स्पीड स्टील (लगभग 600 °C) व सीमेंटेड कार्बाइड (लगभग 1000 °C) के बीच। टेलर घातांक n ≈ 0.18।<br><b>अन्य क्यों नहीं:</b> (a) लोहे में टंगस्टन-क्रोमियम-वैनेडियम = <b>18-4-1 हाई-स्पीड स्टील</b>; (b) कोबाल्ट के साथ सिंटर्ड टंगस्टन कार्बाइड = <b>सीमेंटेड कार्बाइड</b>; (c) एल्युमिनियम ऑक्साइड = <b>सिरेमिक</b> टूल।<br><b>कटिंग-स्पीड क्षमता का क्रम:</b> कार्बन स्टील &lt; HSS &lt; स्टेलाइट &lt; कार्बाइड &lt; सिरेमिक &lt; CBN/डायमंड (पुराना रेलवे JE/SSE)। टूल का सबसे महत्वपूर्ण गुण = रेड (हॉट) हार्डनेस।"}},

/* 5 */ {ans:0, lv:"p", num:1, tag:{en:"Numerical – material removal rate",hi:"न्यूमेरिकल – पदार्थ निष्कासन दर"},
en:{q:"A bar is turned at a cutting speed of 60 m/min, with a feed of 0.25 mm/rev and a depth of cut of 2 mm. The material removal rate is:",
o:["30,000 mm³/min","3,000 mm³/min","7,500 mm³/min","300,000 mm³/min"],
e:"In turning, the material removal rate is<br><b>MRR = f × d × V</b> (V in mm/min)<br>= 0.25 × 2 × (60 × 1000) = 0.5 × 60,000 = <b>30,000 mm³/min</b> (= 30 cm³/min).<br><b>Distractor check:</b> (b) 3,000 – a zero lost in the unit change; (d) 300,000 – an extra zero; (c) 7,500 = 0.25 × 0.5 × 60,000 (depth of cut taken as a radius 'halved' again).<br><b>Unit trap:</b> V must be changed from m/min to mm/min (× 1000) because f and d are in mm.<br><b>PYQ:</b> V = 100 m/min, feed 0.4 mm/rev, depth 1.5 mm → MRR = 60,000 mm³/min (Railway JE 2009).<br><b>Note:</b> MRR rises in direct proportion to each of f, d and V, but tool life falls fastest with V."},
hi:{q:"एक बार को 60 m/min कटिंग स्पीड, 0.25 mm/rev फ़ीड और 2 mm डेप्थ ऑफ़ कट पर टर्न किया जाता है। पदार्थ निष्कासन दर है:",
o:["30,000 mm³/min","3,000 mm³/min","7,500 mm³/min","300,000 mm³/min"],
e:"टर्निंग में पदार्थ निष्कासन दर<br><b>MRR = f × d × V</b> (V mm/min में)<br>= 0.25 × 2 × (60 × 1000) = 0.5 × 60,000 = <b>30,000 mm³/min</b> (= 30 cm³/min)।<br><b>गलत विकल्प कैसे बने:</b> (b) 3,000 – इकाई बदलते समय एक शून्य छूटा; (d) 300,000 – एक शून्य अधिक; (c) 7,500 = 0.25 × 0.5 × 60,000 (डेप्थ ऑफ़ कट को फिर से आधा किया)।<br><b>इकाई की चाल:</b> f व d mm में हैं, अतः V को m/min से mm/min (× 1000) में बदलना ज़रूरी।<br><b>PYQ:</b> V = 100 m/min, फ़ीड 0.4 mm/rev, गहराई 1.5 mm → MRR = 60,000 mm³/min (रेलवे JE 2009)।<br><b>नोट:</b> MRR, f, d व V तीनों के सीधे अनुपात में बढ़ता है, पर टूल जीवन V से सबसे तेज़ घटता है।"}},

/* 6 */ {ans:2, lv:"p", tag:{en:"Lathe accessories · match",hi:"लेथ सहायक उपकरण · मिलान"},
en:{q:"Match each lathe accessory (List-I) with its use (List-II):<br>P. Face plate<br>Q. Collet<br>R. Steady rest<br>S. Lathe carrier (dog)<br>1. grips small bar stock quickly and accurately<br>2. drives a job turned between centres<br>3. holds an irregular job that a chuck cannot grip<br>4. supports a long job at a fixed point on the bed",
o:["P-1, Q-3, R-4, S-2","P-3, Q-1, R-2, S-4","P-3, Q-1, R-4, S-2","P-4, Q-1, R-3, S-2"],
e:"<b>P – 3: Face plate</b> – a large disc with slots, screwed on the spindle nose; irregular castings, angle plates and jobs that no chuck can grip are bolted to it (balanced with counterweights).<br><b>Q – 1: Collet</b> – a split, hardened sleeve closed by a draw bar; holds small round, hexagonal or square bar stock quickly and very accurately (used on capstan, turret and tool-room lathes).<br><b>R – 4: Steady rest</b> – <b>clamped to the bed</b> at a fixed point; supports a long, slender job (or its end during facing, drilling or boring). The <b>follower rest</b> is fixed to the carriage and moves with the tool.<br><b>S – 2: Lathe carrier (dog)</b> – clamped on the job; its tail is pushed by the driving plate, so the job held <b>between centres</b> rotates with the spindle.<br><b>PYQs:</b> 'driving plate + lathe dog drive work between centres' (notes); 'number of jaws in a self-centring chuck → three' (Railway JE 2009)."},
hi:{q:"प्रत्येक लेथ सहायक उपकरण (सूची-I) का उसके उपयोग (सूची-II) से मिलान करें:<br>P. फ़ेस प्लेट<br>Q. कोलेट<br>R. स्टेडी रेस्ट<br>S. लेथ कैरियर (डॉग)<br>1. छोटे बार स्टॉक को जल्दी व सटीकता से पकड़ता है<br>2. सेंटरों के बीच टर्न होने वाले जॉब को घुमाता है<br>3. ऐसा अनियमित जॉब पकड़ता है जिसे चक नहीं पकड़ सकता<br>4. लंबे जॉब को बेड पर एक स्थिर बिंदु पर सहारा देता है",
o:["P-1, Q-3, R-4, S-2","P-3, Q-1, R-2, S-4","P-3, Q-1, R-4, S-2","P-4, Q-1, R-3, S-2"],
e:"<b>P – 3: फ़ेस प्लेट</b> – खाँचों वाली बड़ी डिस्क, स्पिंडल नोज़ पर कसी; अनियमित कास्टिंग, एंगल प्लेट व ऐसे जॉब जिन्हें कोई चक न पकड़े, इस पर बोल्ट किए जाते हैं (काउंटरवेट से संतुलित)।<br><b>Q – 1: कोलेट</b> – ड्रॉ बार से बंद होने वाली कटी हुई कठोर स्लीव; छोटे गोल, षट्भुज या वर्गाकार बार स्टॉक को जल्दी व बहुत सटीकता से पकड़ती है (कैपस्टन, टरेट व टूल-रूम लेथ पर)।<br><b>R – 4: स्टेडी रेस्ट</b> – एक स्थिर बिंदु पर <b>बेड से क्लैम्प</b>; लंबे, पतले जॉब (या फ़ेसिंग, ड्रिलिंग, बोरिंग में उसके सिरे) को सहारा देती है। <b>फ़ॉलोअर रेस्ट</b> कैरिज पर लगती है और टूल के साथ चलती है।<br><b>S – 2: लेथ कैरियर (डॉग)</b> – जॉब पर क्लैम्प; इसकी पूँछ को ड्राइविंग प्लेट धकेलती है, जिससे <b>सेंटरों के बीच</b> पकड़ा जॉब स्पिंडल के साथ घूमता है।<br><b>PYQ:</b> 'ड्राइविंग प्लेट + लेथ डॉग सेंटरों के बीच जॉब को घुमाते हैं' (नोट्स); 'सेल्फ़-सेंटरिंग चक में जॉ की संख्या → तीन' (रेलवे JE 2009)।"}},

/* 7 */ {ans:3, lv:"e", tag:{en:"Twist drill",hi:"ट्विस्ट ड्रिल"},
en:{q:"Chips leave a twist drill, and coolant reaches its cutting lips, mainly through the:",
o:["margin","web","body clearance","flutes"],
e:"The <b>flutes</b> are the two helical grooves along the body of a twist drill. They (i) form the rake face of the cutting lips, (ii) <b>carry the chips out</b> of the hole and (iii) <b>let the cutting fluid reach the lips</b>.<br><b>Why not the others:</b> (a) the <b>margin</b> is a narrow strip along the leading edge of the land – it sets the size and guides the drill in the hole; (b) the <b>web</b> is the central metal between the flutes – it gives strength and forms the chisel edge; (c) <b>body clearance</b> is the reduced diameter behind the margin – it cuts rubbing against the hole wall.<br><b>PYQs:</b> 'the grooves on a drill are called → flutes' (DMRC 2013); 'flutes on a twist drill → carry chips out and let coolant in' (notes repository).<br><b>Related:</b> standard point angle 118°; helix angle sets the rake at the lips."},
hi:{q:"ट्विस्ट ड्रिल से चिप्स बाहर निकलती हैं, और कूलेंट इसके कटिंग लिप्स तक मुख्यतः किसके द्वारा पहुँचता है?",
o:["मार्जिन","वेब","बॉडी क्लीयरेंस","फ़्लूट"],
e:"<b>फ़्लूट</b> ट्विस्ट ड्रिल की बॉडी पर बने दो हेलिकल खाँचे हैं। ये (i) कटिंग लिप्स का रेक फ़ेस बनाते हैं, (ii) छेद से <b>चिप्स बाहर ले जाते हैं</b> और (iii) <b>कटिंग फ़्लूइड को लिप्स तक पहुँचाते हैं</b>।<br><b>अन्य क्यों नहीं:</b> (a) <b>मार्जिन</b> लैंड के अग्र किनारे पर पतली पट्टी है – आकार तय करती है व छेद में ड्रिल को गाइड करती है; (b) <b>वेब</b> फ़्लूटों के बीच का केंद्रीय धातु भाग है – मज़बूती देता है व चिज़ल एज बनाता है; (c) <b>बॉडी क्लीयरेंस</b> मार्जिन के पीछे घटा हुआ व्यास है – छेद की दीवार से रगड़ घटाता है।<br><b>PYQ:</b> 'ड्रिल पर बने खाँचे कहलाते हैं → फ़्लूट' (DMRC 2013); 'ट्विस्ट ड्रिल के फ़्लूट → चिप्स बाहर व कूलेंट अंदर' (नोट्स रिपॉज़िटरी)।<br><b>संबंधित:</b> मानक पॉइंट कोण 118°; हेलिक्स कोण लिप्स पर रेक तय करता है।"}},

/* 8 */ {ans:1, lv:"p", num:1, tag:{en:"Numerical – angular indexing",hi:"न्यूमेरिकल – कोणीय इंडेक्सिंग"},
en:{q:"Using a dividing head with a 40 : 1 worm ratio, the index-crank movement needed to turn the job through 27° is:",
o:["4.5 turns","3 full turns","6.75 turns","1 turn and 13 holes in a 27-hole circle"],
e:"With a 40 : 1 worm, <b>40 crank turns = 1 job turn = 360°</b>, so <b>1 crank turn = 360°/40 = 9°</b>.<br>Crank turns = θ / 9° = 27 / 9 = <b>3 full turns</b>.<br><b>Distractor check:</b> (d) 40/27 = 1 13/27 – treating 27° as if it were 27 divisions (simple-indexing formula used by mistake); (a) 4.5 = 27/6 – taking 6° per turn; (c) 6.75 = 27/4 – a wrong ratio.<br><b>When the angle is not a multiple of 9°:</b> e.g. 13.5° → 13.5/9 = 1½ turns = 1 turn + 9 holes in an 18-hole circle. For minutes: 1 turn = 540′.<br><b>Compare:</b> simple indexing → crank turns = 40/N (Set 5); differential indexing → for numbers like 97 that no plate can give."},
hi:{q:"40 : 1 वर्म अनुपात वाले डिवाइडिंग हेड से जॉब को 27° घुमाने के लिए इंडेक्स-क्रैंक की आवश्यक गति है:",
o:["4.5 चक्कर","3 पूरे चक्कर","6.75 चक्कर","27-छेद वृत्त में 1 चक्कर और 13 छेद"],
e:"40 : 1 वर्म में <b>40 क्रैंक चक्कर = जॉब का 1 चक्कर = 360°</b>, अतः <b>1 क्रैंक चक्कर = 360°/40 = 9°</b>।<br>क्रैंक चक्कर = θ / 9° = 27 / 9 = <b>3 पूरे चक्कर</b>।<br><b>गलत विकल्प कैसे बने:</b> (d) 40/27 = 1 13/27 – 27° को 27 भाग मान लिया (गलती से सरल इंडेक्सिंग सूत्र); (a) 4.5 = 27/6 – प्रति चक्कर 6° मान लिया; (c) 6.75 = 27/4 – गलत अनुपात।<br><b>जब कोण 9° का गुणज न हो:</b> जैसे 13.5° → 13.5/9 = 1½ चक्कर = 18-छेद वृत्त में 1 चक्कर + 9 छेद। मिनट में: 1 चक्कर = 540′।<br><b>तुलना:</b> सरल इंडेक्सिंग → क्रैंक चक्कर = 40/N (सेट 5); डिफ़रेंशियल इंडेक्सिंग → 97 जैसी संख्याओं हेतु जो कोई प्लेट न दे।"}},

/* 9 */ {ans:0, lv:"h", tag:{en:"Types of chips · assertion–reason",hi:"चिप के प्रकार · कथन–कारण"},
en:{q:"Assertion (A): Grey cast iron usually gives discontinuous chips when machined.<br>Reason (R): The graphite flakes in its structure make it brittle, so the chip breaks easily.",
o:["Both A and R are true, and R explains A","Both are true, but R does not explain A","A is true, but R is false","A is false, but R is true"],
e:"<b>A is true:</b> grey cast iron gives small, segmented (discontinuous) chips.<br><b>R is true and explains A:</b> the <b>graphite flakes</b> act as tiny internal notches and make the metal <b>brittle</b>; the chip cannot deform much along the shear plane, so it fractures into segments – the flakes act as built-in chip breakers.<br><b>Chip types (recap):</b> continuous – ductile metal, high speed, large rake, good fluid; continuous with built-up edge – ductile metal, low speed, small rake, poor fluid; discontinuous – brittle metals (cast iron, brass) or ductile metals at very low speed with a small rake.<br><b>Linked facts:</b> cast iron is machined dry or with compressed air – graphite itself lubricates and fluids form a sludge with the dust (Set 4); machinability order: aluminium &gt; brass &gt; mild steel &gt; stainless steel (notes)."},
hi:{q:"कथन (A): मशीनिंग पर ग्रे कास्ट आयरन सामान्यतः असतत (डिसकंटीन्यूअस) चिप देता है।<br>कारण (R): इसकी संरचना में ग्रेफ़ाइट फ़्लेक इसे भंगुर बनाते हैं, इसलिए चिप आसानी से टूटती है।",
o:["A व R दोनों सत्य, R, A की व्याख्या करता है","दोनों सत्य हैं, पर R, A की व्याख्या नहीं करता","A सत्य है, पर R असत्य है","A असत्य है, पर R सत्य है"],
e:"<b>A सत्य:</b> ग्रे कास्ट आयरन छोटी, खंडित (असतत) चिप देता है।<br><b>R सत्य और A की व्याख्या:</b> <b>ग्रेफ़ाइट फ़्लेक</b> छोटे आंतरिक नॉच की तरह कार्य करते हैं और धातु को <b>भंगुर</b> बनाते हैं; चिप शियर प्लेन पर अधिक विकृत नहीं हो पाती, इसलिए खंडों में टूट जाती है – फ़्लेक अंतर्निहित चिप-ब्रेकर का काम करते हैं।<br><b>चिप प्रकार (दोहराव):</b> सतत – तन्य धातु, अधिक स्पीड, बड़ा रेक, अच्छा फ़्लूइड; बिल्ट-अप एज सहित सतत – तन्य धातु, कम स्पीड, छोटा रेक, खराब फ़्लूइड; असतत – भंगुर धातुएँ (कास्ट आयरन, पीतल) या बहुत कम स्पीड व छोटे रेक पर तन्य धातु।<br><b>जुड़े तथ्य:</b> कास्ट आयरन सूखा या संपीड़ित हवा से मशीन होता है – ग्रेफ़ाइट स्वयं स्नेहन करता है और फ़्लूइड धूल के साथ कीचड़ बनाता है (सेट 4); मशीनेबिलिटी क्रम: एल्युमिनियम &gt; पीतल &gt; माइल्ड स्टील &gt; स्टेनलेस स्टील (नोट्स)।"}},

/* 10 */ {ans:3, lv:"h", tag:{en:"Broaching",hi:"ब्रोचिंग"},
en:{q:"Push-type broaches are made much shorter than pull-type broaches mainly because a push broach:",
o:["cuts only soft, non-ferrous metals","has fewer finishing teeth to grind","is used only on manual presses","is in compression and may buckle"],
e:"A <b>push broach</b> is pushed through the job by a ram, so its body is loaded in <b>compression</b> – like a long column it would <b>buckle</b> if made long and slender. So push broaches are short, stubby and take only a small amount of stock (sizing a hole, small keyways), often on an arbor press.<br>A <b>pull broach</b> is gripped by the puller and pulled, so it is in <b>tension</b> – it can be long and carry many roughing, semi-finishing and finishing teeth, removing more metal in one pass.<br><b>Why not the others:</b> (a) push broaches cut steel too; (b) tooth count follows from length, not the other way round; (c) push broaching is also done on hydraulic machines.<br><b>PYQs:</b> 'broaching removes metal in one stroke' (Old Railway JE/SSE); 'the broach is gripped by the puller at the pilot' (RRB-CBT2 Apr'25-II)."},
hi:{q:"पुश-प्रकार के ब्रोच, पुल-प्रकार के ब्रोच से बहुत छोटे बनाए जाते हैं, मुख्यतः क्योंकि पुश ब्रोच:",
o:["केवल नरम, अलौह धातुएँ काटता है","में घिसने हेतु कम फ़िनिशिंग दाँत होते हैं","केवल हाथ से चलने वाले प्रेस पर चलता है","संपीडन में रहता है और मुड़ सकता है"],
e:"<b>पुश ब्रोच</b> को रैम द्वारा जॉब में से धकेला जाता है, इसलिए इसकी बॉडी <b>संपीडन</b> में रहती है – लंबे कॉलम की तरह, लंबा व पतला होने पर यह <b>बकल</b> हो जाएगा। अतः पुश ब्रोच छोटे, मोटे होते हैं और थोड़ा ही धातु हटाते हैं (छेद का साइज़ करना, छोटे की-वे), प्रायः आर्बर प्रेस पर।<br><b>पुल ब्रोच</b> को पुलर पकड़कर खींचता है, इसलिए यह <b>तनाव</b> में रहता है – यह लंबा हो सकता है और इसमें कई रफ़िंग, सेमी-फ़िनिशिंग व फ़िनिशिंग दाँत होते हैं, एक पास में अधिक धातु हटाता है।<br><b>अन्य क्यों नहीं:</b> (a) पुश ब्रोच स्टील भी काटते हैं; (b) दाँतों की संख्या लंबाई से तय होती है, उल्टा नहीं; (c) पुश ब्रोचिंग हाइड्रोलिक मशीन पर भी होती है।<br><b>PYQ:</b> 'ब्रोचिंग एक स्ट्रोक में धातु हटाती है' (पुराना रेलवे JE/SSE); 'पुलर ब्रोच को पायलट पर पकड़ता है' (RRB-CBT2 Apr'25-II)।"}},

/* 11 */ {ans:2, lv:"p", tag:{en:"Capstan lathe · scenario",hi:"कैपस्टन लेथ · परिस्थिति"},
en:{q:"A small workshop gets an order for 500 identical brass bushes, each needing drilling, boring, reaming and chamfering. To cut the idle time of changing tools after every step, the best machine is a:",
o:["centre lathe","speed lathe","capstan lathe","gap-bed lathe"],
e:"A <b>capstan lathe</b> carries a <b>hexagonal capstan head</b> on a ram in place of the tailstock, plus a square tool post on the cross-slide. All the tools – drill, boring bar, reamer, chamfer tool – are pre-set once; the operator simply <b>indexes</b> the head to the next tool, with stops setting each length. So setting time is spread over the batch and idle time per job is tiny – ideal for <b>repetitive production of identical small parts</b> from bar stock (brass bushes are a classic example).<br><b>Why not the others:</b> (a) a centre lathe needs each tool changed and set for every job – too slow for 500 parts; (b) a speed lathe has no feed mechanism – for wood, polishing and spinning; (d) a gap-bed lathe is for large-diameter jobs.<br><b>Capstan vs turret:</b> capstan = ram type, light bar work; turret = saddle type, heavy chucking work (RRB-CBT2 2019). <b>PYQ:</b> 'capstan lathe has no → tailstock' (SSC JE)."},
hi:{q:"एक छोटी वर्कशॉप को 500 एक-जैसे पीतल बुश का ऑर्डर मिलता है, हर बुश पर ड्रिलिंग, बोरिंग, रीमिंग और चैम्फ़रिंग होनी है। हर स्टेप के बाद टूल बदलने का खाली समय घटाने हेतु सर्वोत्तम मशीन है:",
o:["सेंटर लेथ","स्पीड लेथ","कैपस्टन लेथ","गैप-बेड लेथ"],
e:"<b>कैपस्टन लेथ</b> में टेलस्टॉक की जगह रैम पर <b>षट्भुज कैपस्टन हेड</b> होता है, साथ ही क्रॉस-स्लाइड पर वर्गाकार टूल पोस्ट। सभी टूल – ड्रिल, बोरिंग बार, रीमर, चैम्फ़र टूल – एक बार प्री-सेट हो जाते हैं; ऑपरेटर हेड को अगले टूल पर <b>इंडेक्स</b> करता है और स्टॉप हर लंबाई तय करते हैं। इससे सेटिंग समय पूरे बैच में बँट जाता है और प्रति जॉब खाली समय बहुत कम – बार स्टॉक से <b>एक-जैसे छोटे पुर्ज़ों के दोहराव उत्पादन</b> हेतु आदर्श (पीतल बुश क्लासिक उदाहरण)।<br><b>अन्य क्यों नहीं:</b> (a) सेंटर लेथ पर हर जॉब के लिए हर टूल बदलना व सेट करना पड़ता है – 500 पुर्ज़ों हेतु धीमा; (b) स्पीड लेथ में फ़ीड तंत्र नहीं – लकड़ी, पॉलिशिंग व स्पिनिंग हेतु; (d) गैप-बेड लेथ बड़े व्यास के जॉब हेतु।<br><b>कैपस्टन बनाम टरेट:</b> कैपस्टन = रैम प्रकार, हल्का बार कार्य; टरेट = सैडल प्रकार, भारी चकिंग कार्य (RRB-CBT2 2019)। <b>PYQ:</b> 'कैपस्टन लेथ में नहीं होता → टेलस्टॉक' (SSC JE)।"}},

/* 12 */ {ans:1, lv:"h", num:1, tag:{en:"Numerical – tool life",hi:"न्यूमेरिकल – टूल जीवन"},
en:{q:"A tool lasts 81 min at a cutting speed of 30 m/min, and only 1 min at 90 m/min. The tool-life exponent n is:",
o:["0.5","0.25","0.33","4"],
e:"By Taylor's tool-life equation, <b>V Tⁿ = C</b>, so V₁T₁ⁿ = V₂T₂ⁿ:<br>30 × 81ⁿ = 90 × 1ⁿ → 81ⁿ = 3.<br>Since 81 = 3⁴, 3⁴ⁿ = 3¹ → 4n = 1 → <b>n = 0.25</b>.<br>Check: C = 90 × 1 = 90; 30 × 81<sup>0.25</sup> = 30 × 3 = 90 ✓.<br><b>Distractor check:</b> (d) 4 = 1/n (inverted); (c) 0.33 = 30/90 (speed ratio taken as n); (a) 0.5 would need 81<sup>0.5</sup> = 9 = 3 – false.<br><b>Value check:</b> n = 0.25 lies in the <b>carbide</b> range (HSS 0.08–0.2, carbide 0.2–0.5, ceramic 0.4–0.6) – order of n: ceramic &gt; carbide &gt; HSS (Old Railway JE/SSE).<br><b>Note:</b> C equals the cutting speed for a tool life of 1 min."},
hi:{q:"एक टूल 30 m/min कटिंग स्पीड पर 81 min चलता है, और 90 m/min पर केवल 1 min। टूल-जीवन घातांक n है:",
o:["0.5","0.25","0.33","4"],
e:"टेलर के टूल-जीवन समीकरण <b>V Tⁿ = C</b> से V₁T₁ⁿ = V₂T₂ⁿ:<br>30 × 81ⁿ = 90 × 1ⁿ → 81ⁿ = 3।<br>चूँकि 81 = 3⁴, 3⁴ⁿ = 3¹ → 4n = 1 → <b>n = 0.25</b>।<br>जाँच: C = 90 × 1 = 90; 30 × 81<sup>0.25</sup> = 30 × 3 = 90 ✓।<br><b>गलत विकल्प कैसे बने:</b> (d) 4 = 1/n (उल्टा); (c) 0.33 = 30/90 (स्पीड अनुपात को n मान लिया); (a) 0.5 के लिए 81<sup>0.5</sup> = 9 = 3 होना चाहिए – गलत।<br><b>मान की जाँच:</b> n = 0.25 <b>कार्बाइड</b> की रेंज में है (HSS 0.08–0.2, कार्बाइड 0.2–0.5, सिरेमिक 0.4–0.6) – n का क्रम: सिरेमिक &gt; कार्बाइड &gt; HSS (पुराना रेलवे JE/SSE)।<br><b>नोट:</b> C = 1 min टूल जीवन वाली कटिंग स्पीड।"}},

/* 13 */ {ans:3, lv:"p", tag:{en:"Tailstock · Morse taper",hi:"टेलस्टॉक · मोर्स टेपर"},
en:{q:"Drill shanks and dead centres are held in the tailstock quill by a Morse taper because this taper is:",
o:["quick to release by hand","steep, so it centres fast","easy to grind on any lathe","self-holding under axial load"],
e:"The <b>Morse taper</b> is a <b>gentle taper of about 1 in 20</b> (included angle under 3°). When a drill or centre is pushed into the socket, friction on the long, slightly tapered surface locks it – it is <b>self-holding</b>; the axial thrust of drilling only seats it tighter, and it also centres the tool truly. A drift (or winding the quill back) releases it.<br><b>Why not the others:</b> (a) it is self-holding, so it needs a drift or ejector, not a hand pull; (b) <b>steep</b> tapers (e.g. 7 in 24 on milling spindles) are <b>self-releasing</b> and need a draw-in bar – the opposite case (Set 5); (c) grinding ease is not the reason.<br><b>Where used:</b> lathe spindle nose and tailstock barrel, Morse-taper-shank drills, reamers, drill-machine spindles (notes: spindle is hollow with a Morse taper, RRB-CBT2 Apr'25-I)."},
hi:{q:"ड्रिल शैंक और डेड सेंटर को टेलस्टॉक क्विल में मोर्स टेपर से पकड़ा जाता है, क्योंकि यह टेपर:",
o:["हाथ से जल्दी छूट जाता है","तीखा है, इसलिए जल्दी सेंटर करता है","किसी भी लेथ पर आसानी से घिसा जाता है","अक्षीय भार में स्वयं पकड़े रहता है"],
e:"<b>मोर्स टेपर</b> लगभग <b>1 में 20 का हल्का टेपर</b> है (सम्मिलित कोण 3° से कम)। ड्रिल या सेंटर को सॉकेट में धकेलने पर लंबी, हल्की टेपर सतह का घर्षण उसे लॉक कर देता है – यह <b>सेल्फ़-होल्डिंग</b> है; ड्रिलिंग का अक्षीय थ्रस्ट उसे और कसकर बैठाता है, साथ ही टूल सही केंद्र में रहता है। ड्रिफ़्ट (या क्विल को पीछे घुमाकर) इसे छुड़ाया जाता है।<br><b>अन्य क्यों नहीं:</b> (a) यह सेल्फ़-होल्डिंग है, अतः ड्रिफ़्ट या इजेक्टर चाहिए, हाथ से खींचना नहीं; (b) <b>तीखे</b> टेपर (जैसे मिलिंग स्पिंडल पर 7 में 24) <b>सेल्फ़-रिलीज़िंग</b> होते हैं और ड्रॉ-इन बार चाहिए – उल्टी स्थिति (सेट 5); (c) घिसने की सरलता कारण नहीं।<br><b>कहाँ प्रयुक्त:</b> लेथ स्पिंडल नोज़ व टेलस्टॉक बैरल, मोर्स-टेपर-शैंक ड्रिल, रीमर, ड्रिल मशीन स्पिंडल (नोट्स: स्पिंडल खोखला, मोर्स टेपर सहित, RRB-CBT2 Apr'25-I)।"}},

/* 14 */ {ans:1, lv:"p", tag:{en:"Planer",hi:"प्लेनर"},
en:{q:"Consider the following statements about a planer:<br>I. The job, fixed on the table, reciprocates under a stationary tool.<br>II. It is used for large, heavy jobs that a shaper cannot handle.<br>III. The tool is fed during the cutting stroke.<br>Which of these are correct?",
o:["I only","I and II only","II and III only","I, II and III"],
e:"<b>I – correct:</b> in a planer the long <b>table carrying the job reciprocates</b>; the tool on the cross-rail stays put during the stroke.<br><b>II – correct:</b> because the heavy job moves on a long bed while the tool is rigidly supported, the planer machines <b>large, heavy jobs</b> – lathe beds, machine columns, long guideways – too big for a shaper's ram.<br><b>III – wrong:</b> as in a shaper, the <b>feed is given intermittently at the end of the return stroke</b>, never during the cut; during the return the tool lifts on its clapper box to avoid rubbing.<br><b>More facts:</b> planer size = width × height × length of stroke (e.g. 750 × 750 × 2500 mm); several tool heads can cut at once; quick return by a reversible motor or hydraulic drive (notes). Shaper → tool reciprocates; slotter → tool reciprocates vertically."},
hi:{q:"प्लेनर के बारे में निम्न कथनों पर विचार करें:<br>I. टेबल पर कसा जॉब स्थिर टूल के नीचे आगे-पीछे चलता है।<br>II. यह उन बड़े, भारी जॉब हेतु प्रयुक्त होता है जिन्हें शेपर नहीं संभाल सकता।<br>III. टूल को कटिंग स्ट्रोक के दौरान फ़ीड दी जाती है।<br>इनमें से कौन-से सही हैं?",
o:["केवल I","केवल I और II","केवल II और III","I, II और III"],
e:"<b>I – सही:</b> प्लेनर में <b>जॉब वाली लंबी टेबल आगे-पीछे चलती है</b>; क्रॉस-रेल पर लगा टूल स्ट्रोक के दौरान स्थिर रहता है।<br><b>II – सही:</b> भारी जॉब लंबे बेड पर चलता है और टूल मज़बूती से टिका रहता है, इसलिए प्लेनर <b>बड़े, भारी जॉब</b> मशीन करता है – लेथ बेड, मशीन कॉलम, लंबे गाइडवे – जो शेपर के रैम हेतु बहुत बड़े हैं।<br><b>III – गलत:</b> शेपर की तरह <b>फ़ीड वापसी स्ट्रोक के अंत में रुक-रुक कर</b> दी जाती है, कट के दौरान कभी नहीं; वापसी में टूल क्लैपर बॉक्स पर उठ जाता है ताकि रगड़ न हो।<br><b>और तथ्य:</b> प्लेनर का आकार = चौड़ाई × ऊँचाई × स्ट्रोक लंबाई (जैसे 750 × 750 × 2500 mm); कई टूल हेड एक साथ काट सकते हैं; क्विक रिटर्न रिवर्सिबल मोटर या हाइड्रोलिक ड्राइव से (नोट्स)। शेपर → टूल चलता है; स्लॉटर → टूल ऊर्ध्वाधर चलता है।"}},

/* 15 */ {ans:2, lv:"p", num:1, tag:{en:"Numerical – cutting power",hi:"न्यूमेरिकल – कटिंग शक्ति"},
en:{q:"During turning, the cutting force is 1500 N and the cutting speed is 120 m/min. The power used in cutting is:",
o:["1.5 kW","180 kW","3 kW","12.5 W"],
e:"Cutting power = <b>cutting force × cutting speed</b> (speed in m/s).<br>V = 120 m/min = 120/60 = 2 m/s.<br>P = F<sub>c</sub> × V = 1500 × 2 = 3000 W = <b>3 kW</b>.<br><b>Distractor check:</b> (b) 180 kW = 1500 × 120 (m/min not changed to m/s); (d) 12.5 W = 1500/120 (divided instead of multiplied); (a) 1.5 kW = force read as kW.<br><b>Note:</b> only the cutting (tangential) force does work – the thrust and radial forces act in directions of almost no motion. Motor power = cutting power ÷ machine efficiency.<br><b>PYQ link:</b> power = F<sub>c</sub> × V with V = πDN/60000 m/s – e.g. 1200 N on a 100 mm job at 400 rpm → about 2.51 kW (notes, worked example)."},
hi:{q:"टर्निंग के दौरान कटिंग बल 1500 N और कटिंग स्पीड 120 m/min है। कटिंग में प्रयुक्त शक्ति है:",
o:["1.5 kW","180 kW","3 kW","12.5 W"],
e:"कटिंग शक्ति = <b>कटिंग बल × कटिंग स्पीड</b> (स्पीड m/s में)।<br>V = 120 m/min = 120/60 = 2 m/s।<br>P = F<sub>c</sub> × V = 1500 × 2 = 3000 W = <b>3 kW</b>।<br><b>गलत विकल्प कैसे बने:</b> (b) 180 kW = 1500 × 120 (m/min को m/s में नहीं बदला); (d) 12.5 W = 1500/120 (गुणा की जगह भाग); (a) 1.5 kW = बल को kW पढ़ लिया।<br><b>नोट:</b> केवल कटिंग (स्पर्शरेखीय) बल कार्य करता है – थ्रस्ट व रेडियल बल लगभग बिना गति वाली दिशा में लगते हैं। मोटर शक्ति = कटिंग शक्ति ÷ मशीन दक्षता।<br><b>PYQ संबंध:</b> शक्ति = F<sub>c</sub> × V, जहाँ V = πDN/60000 m/s – जैसे 100 mm जॉब पर 400 rpm पर 1200 N → लगभग 2.51 kW (नोट्स, हल उदाहरण)।"}},

/* 16 */ {ans:0, lv:"e", tag:{en:"Cutting fluids",hi:"कटिंग फ़्लूइड"},
en:{q:"The cutting fluid commonly used when machining aluminium is:",
o:["kerosene","sulphurised oil","plain water","compressed air"],
e:"<b>Kerosene</b> (or kerosene mixed with a little lard oil) is the classic fluid for <b>aluminium</b>: it has low viscosity and wets the surface well, it stops the soft, sticky aluminium from welding onto the tool (built-up edge), it gives a bright finish and it does not stain the metal.<br><b>Why not the others:</b> (b) sulphurised oil is for tough steels and heavy cuts – sulphur attacks and stains non-ferrous metals; (c) plain water wets poorly (high surface tension) and causes corrosion; (d) dry cutting or compressed air suits <b>cast iron</b>, not sticky aluminium.<br><b>PYQ:</b> 'fluid for shaping aluminium → kerosene' (RRB-CBT2 Jul'26).<br><b>Fluid–metal table:</b> aluminium → kerosene · brass, bronze → soluble oil or dry (never sulphurised) · cast iron → dry or compressed air · alloy steel → sulphurised mineral oil · high-speed carbide turning → soluble-oil emulsion by flooding."},
hi:{q:"एल्युमिनियम की मशीनिंग में सामान्यतः प्रयुक्त कटिंग फ़्लूइड है:",
o:["केरोसिन","सल्फ़राइज़्ड तेल","सादा पानी","संपीड़ित हवा"],
e:"<b>केरोसिन</b> (या थोड़े लार्ड तेल के साथ केरोसिन) <b>एल्युमिनियम</b> हेतु पारंपरिक फ़्लूइड है: इसकी श्यानता कम है और यह सतह को अच्छी तरह गीला करता है, नरम चिपचिपे एल्युमिनियम को टूल पर वेल्ड होने (बिल्ट-अप एज) से रोकता है, चमकदार फ़िनिश देता है और धातु पर दाग नहीं छोड़ता।<br><b>अन्य क्यों नहीं:</b> (b) सल्फ़राइज़्ड तेल कठोर स्टील व भारी कट हेतु है – सल्फ़र अलौह धातुओं पर दाग डालता है; (c) सादा पानी कम गीला करता है (उच्च पृष्ठ तनाव) और जंग लगाता है; (d) सूखी कटिंग या संपीड़ित हवा <b>कास्ट आयरन</b> हेतु है, चिपचिपे एल्युमिनियम हेतु नहीं।<br><b>PYQ:</b> 'एल्युमिनियम शेपिंग हेतु फ़्लूइड → केरोसिन' (RRB-CBT2 Jul'26)।<br><b>फ़्लूइड–धातु तालिका:</b> एल्युमिनियम → केरोसिन · पीतल, काँसा → सॉल्यूबल ऑयल या सूखा (सल्फ़राइज़्ड कभी नहीं) · कास्ट आयरन → सूखा या संपीड़ित हवा · मिश्र स्टील → सल्फ़राइज़्ड मिनरल ऑयल · तेज़ कार्बाइड टर्निंग → फ़्लडिंग द्वारा सॉल्यूबल-ऑयल इमल्शन।"}},

/* 17 */ {ans:3, lv:"h", tag:{en:"Gear manufacture",hi:"गियर निर्माण"},
en:{q:"Straight bevel gears in batch production are cut on a:",
o:["gear hobbing machine","gear shaper with a pinion cutter","broaching machine","bevel gear generator"],
e:"Bevel-gear teeth taper towards the cone apex – their depth and thickness change along the face. Such teeth are made on a <b>bevel gear generator</b> (a bevel gear planing or generating machine, e.g. Gleason type): two reciprocating tools, representing a crown gear, move towards the cone apex while the blank and the imaginary crown gear roll together, generating a correct tapered tooth.<br><b>Why not the others:</b> (a) <b>hobbing cannot cut internal or bevel gears</b> (Old Railway JE/SSE; Set 5) – the hob's helix lies on a cylinder; (b) a pinion-type shaper cutter cuts spur, helical and internal gears, not tapered teeth; (c) broaching gives internal splines and gear forms, not bevel teeth.<br><b>Quick map:</b> spur and helical (external) → hobbing; internal and cluster gears → shaping; bevel → bevel gear generator; one-off or repair → form milling with indexing.<br><b>PYQ:</b> 'gears used to connect intersecting shafts → bevel' (Railway JE 2014)."},
hi:{q:"बैच उत्पादन में सीधे बेवल गियर किस पर काटे जाते हैं?",
o:["गियर हॉबिंग मशीन","पिनियन कटर सहित गियर शेपर","ब्रोचिंग मशीन","बेवल गियर जेनरेटर"],
e:"बेवल गियर के दाँत शंकु के शीर्ष की ओर पतले होते जाते हैं – फ़ेस के साथ उनकी गहराई व मोटाई बदलती है। ऐसे दाँत <b>बेवल गियर जेनरेटर</b> (बेवल गियर प्लेनिंग या जेनरेटिंग मशीन, जैसे ग्लीसन प्रकार) पर बनते हैं: क्राउन गियर को दर्शाने वाले दो आगे-पीछे चलने वाले टूल शंकु शीर्ष की ओर चलते हैं, जबकि ब्लैंक व काल्पनिक क्राउन गियर साथ-साथ लुढ़कते हैं – सही टेपर दाँत जनरेट होता है।<br><b>अन्य क्यों नहीं:</b> (a) <b>हॉबिंग से आंतरिक या बेवल गियर नहीं कटते</b> (पुराना रेलवे JE/SSE; सेट 5) – हॉब की हेलिक्स बेलन पर होती है; (b) पिनियन-प्रकार शेपर कटर स्पर, हेलिकल व आंतरिक गियर काटता है, टेपर दाँत नहीं; (c) ब्रोचिंग भीतरी स्प्लाइन व गियर रूप देती है, बेवल दाँत नहीं।<br><b>त्वरित मानचित्र:</b> स्पर व हेलिकल (बाहरी) → हॉबिंग; आंतरिक व क्लस्टर गियर → शेपिंग; बेवल → बेवल गियर जेनरेटर; एकल या मरम्मत → इंडेक्सिंग सहित फ़ॉर्म मिलिंग।<br><b>PYQ:</b> 'प्रतिच्छेदी शाफ़्टों को जोड़ने वाले गियर → बेवल' (रेलवे JE 2014)।"}},

/* 18 */ {ans:2, lv:"p", tag:{en:"Coolant properties",hi:"कूलेंट गुण"},
en:{q:"Wetting agents are added to water-based coolants because plain water:",
o:["boils at too low a temperature","has a very low specific heat","has high surface tension and wets poorly","is too thick to flood the cutting zone"],
e:"Water is an excellent <b>coolant</b> – very high specific heat and good thermal conductivity – but its <b>high surface tension</b> makes it form beads instead of spreading, so it <b>wets the tool and work poorly</b> and cannot creep into the chip–tool contact. Wetting agents (surfactants) and emulsifiers lower the surface tension so the fluid spreads and penetrates; rust inhibitors are added because water also corrodes.<br><b>Why not the others:</b> (a) water boils at 100 °C, and the flood keeps the zone cool – boiling point is not the reason; (b) water's specific heat is the <b>highest</b> of common fluids – that is its strength; (d) water has very <b>low</b> viscosity – it is thin, not thick.<br><b>PYQ:</b> 'water is not a good cutting fluid because of its → high surface tension' (RRB-CBT2 Jul'26).<br><b>Linked:</b> soluble oil looks milky (oil droplets dispersed in water – Set 4); grease is not a water-based fluid."},
hi:{q:"पानी-आधारित कूलेंट में वेटिंग एजेंट मिलाए जाते हैं, क्योंकि सादा पानी:",
o:["बहुत कम तापमान पर ही उबल जाता है","की विशिष्ट ऊष्मा बहुत ही कम होती है","पृष्ठ तनाव अधिक होने से कम गीला करता है","कटिंग क्षेत्र भरने के लिए बहुत गाढ़ा है"],
e:"पानी एक उत्कृष्ट <b>शीतलक</b> है – बहुत अधिक विशिष्ट ऊष्मा व अच्छी तापीय चालकता – पर इसका <b>उच्च पृष्ठ तनाव</b> इसे फैलने के बजाय बूँदें बनाने देता है, इसलिए यह टूल व जॉब को <b>कम गीला करता है</b> और चिप–टूल संपर्क में घुस नहीं पाता। वेटिंग एजेंट (सर्फ़ैक्टेंट) व इमल्सीफ़ायर पृष्ठ तनाव घटाते हैं ताकि फ़्लूइड फैले व अंदर पहुँचे; जंग रोधक भी मिलाए जाते हैं क्योंकि पानी जंग लगाता है।<br><b>अन्य क्यों नहीं:</b> (a) पानी 100 °C पर उबलता है और फ़्लड क्षेत्र को ठंडा रखता है – क्वथनांक कारण नहीं; (b) पानी की विशिष्ट ऊष्मा सामान्य फ़्लूइड में <b>सबसे अधिक</b> है – यही इसकी ताकत है; (d) पानी की श्यानता बहुत <b>कम</b> है – यह पतला है, गाढ़ा नहीं।<br><b>PYQ:</b> 'पानी अच्छा कटिंग फ़्लूइड नहीं क्योंकि इसका → उच्च पृष्ठ तनाव' (RRB-CBT2 Jul'26)।<br><b>संबंधित:</b> सॉल्यूबल ऑयल दूधिया दिखता है (पानी में बिखरी तेल बूँदें – सेट 4); ग्रीस पानी-आधारित फ़्लूइड नहीं है।"}},

/* 19 */ {ans:3, lv:"p", num:1, tag:{en:"Numerical – chip thickness ratio",hi:"न्यूमेरिकल – चिप मोटाई अनुपात"},
en:{q:"In orthogonal cutting, a 200 mm length of uncut chip leaves the tool as a chip only 80 mm long. The chip thickness ratio is:",
o:["2.5","0.6","1.4","0.4"],
e:"Metal volume is conserved during cutting (width stays almost the same), so<br>t × L = t<sub>c</sub> × L<sub>c</sub> → <b>r = t / t<sub>c</sub> = L<sub>c</sub> / L</b>.<br>r = 80 / 200 = <b>0.4</b>.<br>The chip is shorter and thicker than the uncut layer – it has been compressed along the shear plane, so r is always less than 1.<br><b>Distractor check:</b> (a) 2.5 = 200/80 – the inverse (that is the chip <b>reduction</b> coefficient, 1/r); (b) 0.6 = 1 − 0.4; (c) 1.4 = 1 + 0.4.<br><b>Next step:</b> with the rake angle α, tan φ = r cos α / (1 − r sin α) gives the shear angle (Set 3). A larger r (thinner chip) means a larger shear angle, lower forces and less power."},
hi:{q:"ऑर्थोगोनल कटिंग में बिना कटी चिप की 200 mm लंबाई, टूल से केवल 80 mm लंबी चिप बनकर निकलती है। चिप मोटाई अनुपात है:",
o:["2.5","0.6","1.4","0.4"],
e:"कटिंग में धातु का आयतन संरक्षित रहता है (चौड़ाई लगभग समान), अतः<br>t × L = t<sub>c</sub> × L<sub>c</sub> → <b>r = t / t<sub>c</sub> = L<sub>c</sub> / L</b>।<br>r = 80 / 200 = <b>0.4</b>।<br>चिप बिना कटी परत से छोटी व मोटी होती है – शियर प्लेन पर दबी है, इसलिए r सदैव 1 से कम।<br><b>गलत विकल्प कैसे बने:</b> (a) 2.5 = 200/80 – उल्टा (यह चिप <b>रिडक्शन</b> गुणांक 1/r है); (b) 0.6 = 1 − 0.4; (c) 1.4 = 1 + 0.4।<br><b>अगला चरण:</b> रेक कोण α के साथ tan φ = r cos α / (1 − r sin α) से शियर कोण मिलता है (सेट 3)। अधिक r (पतली चिप) = बड़ा शियर कोण, कम बल व कम शक्ति।"}},

/* 20 */ {ans:1, lv:"p", tag:{en:"Shaper · stroke",hi:"शेपर · स्ट्रोक"},
en:{q:"A shaper operator needs a longer stroke for a longer job. He should:",
o:["raise the cross-rail and the table","move the crank pin outward on the bull gear","tilt the clapper box on the tool head","change the speed of the bull gear"],
e:"In the crank and slotted-lever quick-return drive, the crank pin on the <b>bull gear</b> slides in the slotted lever, which swings and drives the ram. The <b>farther the crank pin is from the bull-gear centre</b> (larger crank radius), the larger the swing of the lever and the <b>longer the ram stroke</b>. The stroke <b>position</b> is set separately by shifting the ram relative to its connecting block.<br><b>Why not the others:</b> (a) raising the table only suits the job height; (c) the clapper box lets the tool lift on the return stroke – it has no effect on stroke length; (d) bull-gear speed changes the strokes per minute (cutting speed), not the length.<br><b>PYQs:</b> 'stroke length of a shaper is increased by → increasing the centre distance of bull gear and crank pin' (Old Railway JE/SSE); 'size of a shaper = maximum stroke length' (RRB-CBT2 2019).<br><b>Note:</b> a longer stroke also changes the return-to-cut time ratio slightly."},
hi:{q:"एक शेपर ऑपरेटर को लंबे जॉब हेतु लंबा स्ट्रोक चाहिए। उसे करना चाहिए:",
o:["क्रॉस-रेल और टेबल को ऊपर उठाना","बुल गियर पर क्रैंक पिन बाहर खिसकाना","टूल हेड पर क्लैपर बॉक्स को झुकाना","बुल गियर की घूमने की स्पीड बदलना"],
e:"क्रैंक व स्लॉटेड-लीवर क्विक-रिटर्न ड्राइव में <b>बुल गियर</b> पर लगा क्रैंक पिन स्लॉटेड लीवर में फिसलता है, जो झूलकर रैम चलाता है। क्रैंक पिन <b>बुल-गियर केंद्र से जितना दूर</b> (बड़ा क्रैंक रेडियस), लीवर का झूलना उतना अधिक और <b>रैम स्ट्रोक उतना लंबा</b>। स्ट्रोक की <b>स्थिति</b> अलग से रैम को उसके कनेक्टिंग ब्लॉक के सापेक्ष खिसकाकर तय होती है।<br><b>अन्य क्यों नहीं:</b> (a) टेबल उठाना केवल जॉब की ऊँचाई के अनुसार है; (c) क्लैपर बॉक्स वापसी स्ट्रोक पर टूल को उठने देता है – स्ट्रोक लंबाई पर असर नहीं; (d) बुल-गियर स्पीड प्रति मिनट स्ट्रोक (कटिंग स्पीड) बदलती है, लंबाई नहीं।<br><b>PYQ:</b> 'शेपर की स्ट्रोक लंबाई बढ़ती है → बुल गियर व क्रैंक पिन की केंद्र-दूरी बढ़ाकर' (पुराना रेलवे JE/SSE); 'शेपर का आकार = अधिकतम स्ट्रोक लंबाई' (RRB-CBT2 2019)।<br><b>नोट:</b> लंबा स्ट्रोक वापसी-से-कट समय अनुपात को भी थोड़ा बदलता है।"}},

/* 21 */ {ans:0, lv:"h", tag:{en:"Tool materials · scenario",hi:"टूल पदार्थ · परिस्थिति"},
en:{q:"A shop switches from carbide to ceramic inserts for finish-turning hardened steel and is advised to cut dry rather than with an intermittent coolant. The main reason is that ceramics:",
o:["crack under sudden thermal shock","react chemically with all coolants","lose hardness when they get wet","need heat to keep the edge sharp"],
e:"<b>Ceramic</b> tools (sintered aluminium oxide, or Al₂O₃ with TiC – cermets) keep their hardness up to about <b>1200 °C</b> and run at very high speeds, but they are <b>brittle</b>, with poor thermal-shock resistance. An irregular or intermittent splash of coolant on a red-hot tip creates steep temperature gradients and <b>thermal cracks</b>, which chip the edge. So ceramics are usually run <b>dry</b> (or with a steady, generous flood, never on-off).<br><b>Why not the others:</b> (b) alumina is chemically very stable – that is one of its strengths; (c) water does not soften a ceramic; (d) the heat is a by-product, not a need – the real issue is the sudden change of temperature.<br><b>Ceramic facts (notes):</b> negative rake to keep the brittle tip in compression; Taylor n 0.4–0.6 (highest of common tools); best on cast iron and hardened steel; poor on aluminium (reaction and built-up edge)."},
hi:{q:"एक वर्कशॉप कठोर स्टील की फ़िनिश-टर्निंग के लिए कार्बाइड की जगह सिरेमिक इंसर्ट अपनाती है, और उसे रुक-रुक कर कूलेंट डालने के बजाय सूखी कटिंग की सलाह दी जाती है। मुख्य कारण यह है कि सिरेमिक:",
o:["अचानक तापीय झटके से चटक जाते हैं","सभी कूलेंट से रासायनिक क्रिया करते हैं","गीले होने पर कठोरता खो देते हैं","धार तेज़ रखने के लिए ऊष्मा चाहते हैं"],
e:"<b>सिरेमिक</b> टूल (सिंटर्ड एल्युमिनियम ऑक्साइड, या TiC सहित Al₂O₃ – सर्मेट) लगभग <b>1200 °C</b> तक कठोरता रखते हैं और बहुत अधिक स्पीड पर चलते हैं, पर ये <b>भंगुर</b> होते हैं और इनका तापीय-झटका प्रतिरोध कम है। लाल-गर्म टिप पर अनियमित या रुक-रुक कर कूलेंट पड़ने से तीव्र तापमान अंतर बनता है और <b>तापीय दरारें</b> आती हैं, जिससे धार टूटती है। अतः सिरेमिक प्रायः <b>सूखे</b> चलाए जाते हैं (या लगातार भरपूर फ़्लड से, चालू-बंद कभी नहीं)।<br><b>अन्य क्यों नहीं:</b> (b) एल्युमिना रासायनिक रूप से बहुत स्थिर है – यही इसकी ताकत है; (c) पानी सिरेमिक को नरम नहीं करता; (d) ऊष्मा उप-उत्पाद है, आवश्यकता नहीं – असली समस्या तापमान का अचानक बदलना है।<br><b>सिरेमिक तथ्य (नोट्स):</b> भंगुर टिप को संपीडन में रखने हेतु ऋणात्मक रेक; टेलर n 0.4–0.6 (सामान्य टूल में सबसे अधिक); कास्ट आयरन व कठोर स्टील पर सर्वोत्तम; एल्युमिनियम पर खराब (क्रिया व बिल्ट-अप एज)।"}},

/* 22 */ {ans:2, lv:"p", tag:{en:"Milling operations",hi:"मिलिंग संक्रियाएँ"},
en:{q:"A T-slot in a machine-tool table is milled by:",
o:["one pass of a form cutter alone","a dovetail cutter in a single pass","a plain slot first, then a T-slot cutter","a slitting saw, then an end mill"],
e:"A T-slot has a narrow vertical neck and a wider cavity below it. It is milled in <b>two steps</b>: (1) a <b>plain (vertical) slot</b> is cut to the full depth of the neck with an end mill or a side-and-face cutter; (2) a <b>T-slot cutter</b> – a small side-cutting disc on a thin neck shank – is then fed along the slot at the bottom to cut the wide part. The T-slot cutter cannot start without the first slot, as its shank must pass through the neck.<br><b>Why not the others:</b> (a) a form cutter alone cannot reach under the overhang; (b) a <b>dovetail cutter</b> makes angular (dovetail) slides, not T-slots; (d) a slitting saw cuts thin slots or parts the stock – the end mill would still not form the wide bottom.<br><b>Special slots (notes):</b> T-slot, dovetail and angular slots use special cutters; Woodruff keyway – its own cutter; closed keyway – end mill (Set 5)."},
hi:{q:"मशीन-टूल टेबल में T-स्लॉट किस प्रकार मिल किया जाता है?",
o:["केवल फ़ॉर्म कटर के एक पास से","एक ही पास में डवटेल कटर से","पहले सादा स्लॉट, फिर T-स्लॉट कटर","स्लिटिंग सॉ, फिर एंड मिल"],
e:"T-स्लॉट में एक पतली ऊर्ध्वाधर गर्दन और उसके नीचे चौड़ी गुहा होती है। इसे <b>दो चरणों</b> में मिल किया जाता है: (1) एंड मिल या साइड-एंड-फ़ेस कटर से गर्दन की पूरी गहराई तक <b>सादा (ऊर्ध्वाधर) स्लॉट</b> काटा जाता है; (2) फिर <b>T-स्लॉट कटर</b> – पतली गर्दन वाले शैंक पर छोटी साइड-कटिंग डिस्क – को स्लॉट के तल पर चलाकर चौड़ा भाग काटा जाता है। पहले स्लॉट के बिना T-स्लॉट कटर शुरू नहीं हो सकता, क्योंकि इसका शैंक गर्दन से गुज़रता है।<br><b>अन्य क्यों नहीं:</b> (a) केवल फ़ॉर्म कटर ओवरहैंग के नीचे नहीं पहुँच सकता; (b) <b>डवटेल कटर</b> कोणीय (डवटेल) स्लाइड बनाता है, T-स्लॉट नहीं; (d) स्लिटिंग सॉ पतले स्लॉट काटती या स्टॉक अलग करती है – एंड मिल फिर भी चौड़ा तल नहीं बनाएगी।<br><b>विशेष स्लॉट (नोट्स):</b> T-स्लॉट, डवटेल व कोणीय स्लॉट हेतु विशेष कटर; वुडरफ़ की-वे – अपना कटर; बंद की-वे – एंड मिल (सेट 5)।"}},

/* 23 */ {ans:3, lv:"p", num:1, tag:{en:"Numerical – drilling speed",hi:"न्यूमेरिकल – ड्रिलिंग स्पीड"},
en:{q:"A drill of 25 mm diameter runs at 280 rpm. Its cutting speed is about:",
o:["7 m/min","44 m/min","11 m/min","22 m/min"],
e:"Cutting speed is the peripheral speed at the outer corner of the drill lips:<br><b>V = πDN / 1000</b> = (3.1416 × 25 × 280) / 1000 = 21,991 / 1000 ≈ <b>22 m/min</b>.<br><b>Distractor check:</b> (a) 7 m/min = 25 × 280 / 1000 (π left out); (b) 44 m/min = π × 50 × 280 / 1000 (diameter doubled); (c) 11 m/min = π × 12.5 × 280 / 1000 (radius used instead of diameter).<br><b>Reverse use:</b> N = 1000V / πD – a 25 mm shaft at 50 m/min → about 637 rpm (RRB-CBT2 2019).<br><b>Note:</b> the speed falls to zero at the drill centre – one reason the chisel edge cuts poorly and pushes the metal (Set 4)."},
hi:{q:"25 mm व्यास की ड्रिल 280 rpm पर चलती है। इसकी कटिंग स्पीड लगभग है:",
o:["7 m/min","44 m/min","11 m/min","22 m/min"],
e:"कटिंग स्पीड ड्रिल लिप्स के बाहरी कोने पर परिधीय गति है:<br><b>V = πDN / 1000</b> = (3.1416 × 25 × 280) / 1000 = 21,991 / 1000 ≈ <b>22 m/min</b>।<br><b>गलत विकल्प कैसे बने:</b> (a) 7 m/min = 25 × 280 / 1000 (π छूटा); (b) 44 m/min = π × 50 × 280 / 1000 (व्यास दोगुना); (c) 11 m/min = π × 12.5 × 280 / 1000 (व्यास की जगह त्रिज्या)।<br><b>उल्टा प्रयोग:</b> N = 1000V / πD – 50 m/min पर 25 mm शाफ़्ट → लगभग 637 rpm (RRB-CBT2 2019)।<br><b>नोट:</b> ड्रिल के केंद्र पर स्पीड शून्य हो जाती है – एक कारण कि चिज़ल एज ठीक से नहीं काटती और धातु को धकेलती है (सेट 4)।"}},

/* 24 */ {ans:1, lv:"p", tag:{en:"Broach geometry",hi:"ब्रोच ज्यामिति"},
en:{q:"On a broach, the land behind each cutting edge is ground with a back-off angle mainly to:",
o:["give the chip room to curl","stop the land rubbing the job","make the teeth easier to resharpen","raise the rise per tooth"],
e:"The <b>back-off angle</b> is the <b>clearance</b> angle of a broach tooth – the land behind the cutting edge is ground to fall away from the machined surface, so only the edge touches the job and the land does <b>not rub</b>. Rubbing would raise heat and force, spoil the finish and wear the tooth.<br><b>Why not the others:</b> (a) room for the chip is given by the <b>gullet</b> (chip space) between teeth and the <b>hook (rake) angle</b> on the face; (c) broaches are resharpened on the face (hook), and the back-off is kept small precisely to preserve the size after regrinding; (d) the rise per tooth is set by the difference in tooth heights, not by the land angle.<br><b>Typical values:</b> hook angle 15–20° (steel), back-off 1–3° (roughing) and ½–1° (finishing).<br><b>PYQ:</b> 'angle that prevents rubbing of the broach tooth with the work → back-off angle' (notes repository; RRB-CBT2 2025 pattern)."},
hi:{q:"ब्रोच पर प्रत्येक कटिंग एज के पीछे की लैंड को बैक-ऑफ़ कोण से घिसा जाता है, मुख्यतः:",
o:["चिप को मुड़ने की जगह देने हेतु","लैंड को जॉब से रगड़ने से रोकने हेतु","दाँतों को दोबारा धार देना आसान करने हेतु","प्रति दाँत राइज़ बढ़ाने हेतु"],
e:"<b>बैक-ऑफ़ कोण</b> ब्रोच दाँत का <b>क्लीयरेंस</b> कोण है – कटिंग एज के पीछे की लैंड को मशीन की गई सतह से दूर झुकाकर घिसा जाता है, ताकि केवल एज जॉब को छुए और लैंड <b>न रगड़े</b>। रगड़ से ऊष्मा व बल बढ़ते, फ़िनिश बिगड़ती और दाँत घिसता।<br><b>अन्य क्यों नहीं:</b> (a) चिप की जगह दाँतों के बीच <b>गलेट</b> (चिप स्पेस) व फ़ेस पर <b>हुक (रेक) कोण</b> से मिलती है; (c) ब्रोच को फ़ेस (हुक) पर दोबारा धार दी जाती है, और बैक-ऑफ़ इसीलिए छोटा रखा जाता है कि धार देने के बाद साइज़ बना रहे; (d) प्रति दाँत राइज़ दाँतों की ऊँचाई के अंतर से तय होता है, लैंड कोण से नहीं।<br><b>सामान्य मान:</b> हुक कोण 15–20° (स्टील), बैक-ऑफ़ 1–3° (रफ़िंग) व ½–1° (फ़िनिशिंग)।<br><b>PYQ:</b> 'ब्रोच दाँत को जॉब से रगड़ने से रोकने वाला कोण → बैक-ऑफ़ कोण' (नोट्स रिपॉज़िटरी; RRB-CBT2 2025 पैटर्न)।"}},

/* 25 */ {ans:0, lv:"e", tag:{en:"Machinability",hi:"मशीनेबिलिटी"},
en:{q:"Among the following, the material with the poorest machinability is:",
o:["stainless steel","free-cutting brass","aluminium alloy","mild steel"],
e:"<b>Machinability</b> is the ease of machining – judged by tool life, cutting force and power, surface finish and chip control. <b>Austenitic stainless steel</b> is hard to machine: it <b>work-hardens</b> rapidly ahead of the tool, has low thermal conductivity (heat stays at the tool tip), is tough and gummy (built-up edge, long stringy chips). So it shortens tool life and needs sharp, positive-rake tools with good coolant.<br><b>Why not the others:</b> (b) free-cutting brass (with lead) is among the easiest metals – short chips, low force; (c) aluminium alloys machine very easily at high speed; (d) mild steel is moderate and is the common reference for machinability ratings.<br><b>Order (notes):</b> aluminium &gt; brass &gt; mild steel &gt; stainless steel. Free-cutting steels add sulphur or lead to improve machinability."},
hi:{q:"निम्न में से सबसे कम मशीनेबिलिटी वाला पदार्थ है:",
o:["स्टेनलेस स्टील","फ़्री-कटिंग पीतल","एल्युमिनियम मिश्रधातु","माइल्ड स्टील"],
e:"<b>मशीनेबिलिटी</b> मशीनिंग की सरलता है – टूल जीवन, कटिंग बल व शक्ति, सतह फ़िनिश व चिप नियंत्रण से आँकी जाती है। <b>ऑस्टेनिटिक स्टेनलेस स्टील</b> मशीन करना कठिन है: यह टूल के आगे तेज़ी से <b>वर्क-हार्डन</b> होता है, इसकी तापीय चालकता कम है (ऊष्मा टूल टिप पर रहती है), यह कठोर व चिपचिपा है (बिल्ट-अप एज, लंबी धागेदार चिप)। अतः टूल जीवन घटाता है और तेज़, धनात्मक-रेक टूल व अच्छा कूलेंट चाहिए।<br><b>अन्य क्यों नहीं:</b> (b) फ़्री-कटिंग पीतल (लेड सहित) सबसे आसान धातुओं में है – छोटी चिप, कम बल; (c) एल्युमिनियम मिश्रधातुएँ तेज़ स्पीड पर बहुत आसानी से मशीन होती हैं; (d) माइल्ड स्टील मध्यम है और मशीनेबिलिटी रेटिंग का सामान्य संदर्भ है।<br><b>क्रम (नोट्स):</b> एल्युमिनियम &gt; पीतल &gt; माइल्ड स्टील &gt; स्टेनलेस स्टील। फ़्री-कटिंग स्टील में मशीनेबिलिटी सुधारने हेतु सल्फ़र या लेड मिलाया जाता है।"}}
];

const LIMIT = 20*60;
let lang = "en";
let mode = "test";
let picked = new Array(Q.length).fill(null);
let showAll = false;
let submitted = false;
let autoSub = false;
let left = LIMIT;
let tick = null;
const L = ["a","b","c","d"];
const $ = id => document.getElementById(id);

function fmt(t){ const m=Math.floor(t/60), s=t%60; return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }

function startTimer(){
  stopTimer();
  if(mode!=="test" || submitted) return;
  tick = setInterval(()=>{
    left--;
    if(left<=0){ left=0; autoSub=true; doSubmit(); return; }
    paintTimer();
  },1000);
}
function stopTimer(){ if(tick){clearInterval(tick); tick=null;} }
function paintTimer(){
  const t=$("timer"), u=UI[lang];
  if(mode!=="test"){ t.classList.add("hidden"); return; }
  t.classList.remove("hidden");
  t.textContent = submitted ? u.taken+": "+fmt(LIMIT-left) : u.time+": "+fmt(left);
  t.classList.toggle("low", !submitted && left<=120);
}

function isRevealed(i){ return mode==="practice" ? (picked[i]!==null || showAll) : submitted; }

function render(){
  const u = UI[lang];
  document.documentElement.lang = lang;
  $("title").textContent = u.title;
  $("subtitle").textContent = u.sub;
  $("rules").textContent = mode==="test" ? u.rules : u.rulesP;
  $("foot").textContent = u.foot;
  $("mTest").textContent = u.test; $("mPrac").textContent = u.prac;
  $("mTest").setAttribute("aria-pressed", mode==="test");
  $("mPrac").setAttribute("aria-pressed", mode==="practice");
  $("bSubmit").textContent = u.submit;
  $("bSubmit").classList.toggle("hidden", !(mode==="test" && !submitted));
  $("bShow").textContent = showAll ? u.hide : u.show;
  $("bShow").classList.toggle("hidden", mode!=="practice");
  $("bReset").textContent = u.reset;
  $("bEn").setAttribute("aria-pressed", lang==="en");
  $("bHi").setAttribute("aria-pressed", lang==="hi");

  let html = "";
  Q.forEach((q,i)=>{
    if(q.num && i>0 && !Q[i-1].num) html += `<div class="sec">${u.num}</div>`;
    const d = q[lang], p = picked[i], rev = isRevealed(i);
    const lvClass = q.lv==="t" ? "lv-t" : q.lv==="h" ? "lv-h" : "";
    html += `<article class="q" id="q${i}">
      <div class="qhead"><span class="qno">Q${i+1}.</span><span class="chip">${q.tag[lang]}</span><span class="chip ${lvClass}">${u.lv[q.lv]}</span></div>
      <div class="qtext">${d.q}</div><div class="opts">`;
    d.o.forEach((o,j)=>{
      let cls = "opt";
      if(rev && j===q.ans) cls += " right";
      if(rev && p===j && p!==q.ans) cls += " wrong";
      if(!rev && p===j) cls += " sel";
      html += `<button class="${cls}" data-q="${i}" data-o="${j}" ${rev?"disabled":""} aria-pressed="${p===j}"><span class="l">(${L[j]})</span><span>${o}</span></button>`;
    });
    html += `</div>`;
    if(rev){
      let v = "";
      if(p!==null) v = p===q.ans ? `<div>${u.right}</div>` : `<div class="verdict-bad">${u.yours}</div>`;
      else if(mode==="test") v = `<div class="verdict-bad">${u.un}</div>`;
      html += `<div class="ex">${v}<div class="ans">${u.ans}: (${L[q.ans]})</div>${d.e}</div>`;
    }
    html += `</article>`;
  });
  $("list").innerHTML = html;
  stats(); paintTimer(); result();
}

function counts(){
  let c=0,w=0,a=0;
  picked.forEach((p,i)=>{ if(p!==null){a++; if(p===Q[i].ans)c++; else w++;} });
  return {c,w,a,s:(c-w/3).toFixed(2)};
}

function stats(){
  const u = UI[lang], k = counts();
  const hide = mode==="test" && !submitted;
  $("sAtt").textContent = `${u.att}: ${k.a}/${Q.length}`;
  $("sC").textContent = `${u.c}: ${k.c}`;
  $("sW").textContent = `${u.w}: ${k.w}`;
  $("sS").textContent = `${u.s}: ${k.s}`;
  ["sC","sW","sS"].forEach(id=>$(id).classList.toggle("hidden", hide));
}

function result(){
  const box = $("result");
  if(!(mode==="test" && submitted)){ box.innerHTML=""; return; }
  const u = UI[lang], k = counts();
  const acc = k.a ? Math.round(k.c*100/k.a) : 0;
  box.innerHTML = `<section class="result" aria-live="polite">
    <h2>${u.res}: ${k.s} / ${Q.length}</h2>
    <div class="rgrid">
      <div>${u.c}<b>${k.c}</b></div><div>${u.w}<b>${k.w}</b></div>
      <div>${u.un}<b>${Q.length-k.a}</b></div><div>${u.acc}<b>${acc}%</b></div>
      <div>${u.taken}<b>${fmt(LIMIT-left)}</b></div>
    </div>
    <p>${autoSub ? u.auto+" " : ""}${u.resNote}</p></section>`;
}

function doSubmit(){
  submitted = true; stopTimer(); render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function resetAll(){
  picked = new Array(Q.length).fill(null);
  showAll=false; submitted=false; autoSub=false; left=LIMIT;
  render(); startTimer(); window.scrollTo({top:0});
}

$("list").addEventListener("click", e=>{
  const b = e.target.closest(".opt");
  if(!b || b.disabled) return;
  const i = +b.dataset.q, j = +b.dataset.o;
  if(mode==="test"){ picked[i] = picked[i]===j ? null : j; }
  else { if(picked[i]!==null) return; picked[i] = j; }
  render();
  const btn = document.querySelector(`#q${i} .opt[data-o="${j}"]`) || document.querySelector(`#q${i} .opt`);
  if(btn) btn.focus({preventScroll:true});
});
$("bEn").onclick = ()=>{ lang="en"; render(); };
$("bHi").onclick = ()=>{ lang="hi"; render(); };
function setMode(m){
  if(m===mode) return;
  const dirty = picked.some(p=>p!==null) || submitted;
  if(dirty && !confirm(UI[lang].cMode)) return;
  mode = m; resetAll();
}
$("mTest").onclick = ()=>setMode("test");
$("mPrac").onclick = ()=>setMode("practice");
$("bSubmit").onclick = ()=>{ if(confirm(UI[lang].cSub)) doSubmit(); };
$("bShow").onclick = ()=>{ showAll=!showAll; render(); };
$("bReset").onclick = resetAll;

function paintStart(){
  const u=UI[lang];
  $("stTitle").textContent=u.title;
  $("stSub").textContent=u.stSub;
  $("stTest").innerHTML=u.stT+"<small>"+u.stTs+"</small>";
  $("stPrac").innerHTML=u.stP+"<small>"+u.stPs+"</small>";
  $("stEn").setAttribute("aria-pressed",lang==="en");
  $("stHi").setAttribute("aria-pressed",lang==="hi");
}
function begin(m){ mode=m; $("start").classList.add("hidden"); resetAll(); }
$("stTest").onclick=()=>begin("test");
$("stPrac").onclick=()=>begin("practice");
$("stEn").onclick=()=>{ lang="en"; render(); paintStart(); };
$("stHi").onclick=()=>{ lang="hi"; render(); paintStart(); };
$("bEn").addEventListener("click",paintStart);
$("bHi").addEventListener("click",paintStart);
render(); paintStart(); $("stTest").focus();
</script>
</body>
</html>
