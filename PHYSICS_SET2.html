<script>
const META={"title": "RRB JE CBT-2 · Physics · Mixed Set 2", "kicker": "THE EXAM ENGINEER · CBT-2 Physics Series", "sub": "25 most-likely questions based on RRB JE PYQs (CBT-1 & CBT-2 pattern).", "subhi": "RRB JE PYQs (CBT-1 और CBT-2 पैटर्न) पर आधारित 25 सर्वाधिक संभावित प्रश्न।", "mins": 25};
const Q=[{"s": "Mechanics", "a": 2, "en": {"q": "A delivery van's velocity–time graph is a straight line rising from the origin for the first 8 s and then becomes parallel to the time axis. Which statement correctly describes its motion?", "o": ["Uniform velocity first, then it comes to rest", "Increasing acceleration first, then retardation", "Uniform acceleration first, then uniform velocity", "At rest first, then uniform acceleration"], "e": "A straight line rising from the origin has a constant slope, so the acceleration is uniform. A line parallel to the time axis means the velocity does not change, so the motion becomes uniform (zero acceleration).", "r": "v–t graph: slope = acceleration, area = displacement."}, "hi": {"q": "एक डिलीवरी वैन का वेग–समय ग्राफ पहले 8 s तक मूल बिंदु से ऊपर उठती सीधी रेखा है और फिर समय-अक्ष के समांतर हो जाता है। उसकी गति का सही वर्णन कौन-सा कथन करता है?", "o": ["पहले एकसमान वेग, फिर वह रुक जाती है", "पहले बढ़ता त्वरण, फिर मंदन", "पहले एकसमान त्वरण, फिर एकसमान वेग", "पहले विराम, फिर एकसमान त्वरण"], "e": "मूल बिंदु से उठती सीधी रेखा की प्रवणता नियत है, अतः त्वरण एकसमान है। समय-अक्ष के समांतर रेखा का अर्थ वेग नहीं बदल रहा, अतः गति एकसमान (त्वरण शून्य) हो जाती है।", "r": "v–t ग्राफ: प्रवणता = त्वरण, क्षेत्रफल = विस्थापन।"}}, {"s": "Mechanics", "a": 2, "en": {"q": "A runner completes exactly one lap of a 400 m circular track and stops at the point where she started. Which pair correctly gives the distance covered and her displacement?", "o": ["Zero and 400 m", "400 m and 400 m", "400 m and zero", "200 m and zero"], "e": "Distance is the total path length = 400 m. Displacement is the straight line from the start point to the end point; she ends where she started, so displacement = 0. Her average velocity is also zero.", "r": "Distance can never be zero for a moving body; displacement can."}, "hi": {"q": "एक धाविका 400 m के वृत्ताकार ट्रैक का ठीक एक चक्कर पूरा करके उसी बिंदु पर रुकती है जहाँ से उसने शुरू किया था। तय दूरी और उसके विस्थापन का सही युग्म कौन-सा है?", "o": ["शून्य और 400 m", "400 m और 400 m", "400 m और शून्य", "200 m और शून्य"], "e": "दूरी = कुल पथ की लंबाई = 400 m। विस्थापन = प्रारंभिक से अंतिम बिंदु तक सीधी रेखा; वह वहीं रुकी जहाँ से चली, अतः विस्थापन = 0। उसका औसत वेग भी शून्य है।", "r": "चलती वस्तु की दूरी कभी शून्य नहीं होती; विस्थापन हो सकता है।"}}, {"s": "Mechanics", "a": 3, "en": {"q": "During a road test, a 2000 kg truck moving at 10 m/s gets a constant net forward force of 6000 N from its engine for 5 s. Ignoring friction, what speed does the truck reach at the end of this period?", "o": ["15 m/s", "40 m/s", "30 m/s", "25 m/s"], "e": "a = F/m = 6000/2000 = 3 m/s². v = u + at = 10 + 3 × 5 = 25 m/s.", "r": "Find acceleration from F = ma first, then use v = u + at."}, "hi": {"q": "सड़क परीक्षण के दौरान 10 m/s से चल रहे 2000 kg के ट्रक को इंजन से 5 s तक 6000 N का नियत नेट आगे का बल मिलता है। घर्षण नगण्य मानें, तो इस अवधि के अंत में ट्रक की चाल क्या होगी?", "o": ["15 m/s", "40 m/s", "30 m/s", "25 m/s"], "e": "a = F/m = 6000/2000 = 3 m/s²। v = u + at = 10 + 3 × 5 = 25 m/s।", "r": "पहले F = ma से त्वरण निकालें, फिर v = u + at लगाएँ।"}}, {"s": "Mechanics", "a": 0, "en": {"q": "In the long jump, an athlete runs a long distance before taking off. Which statement best explains why the run-up helps her jump farther?", "o": ["Inertia of motion carries her forward after take-off", "The run-up increases her mass and hence her force", "Running reduces the pull of gravity on her body", "Friction from the ground pushes her higher in the air"], "e": "The run-up gives her a large forward velocity. After take-off, her body tends to keep moving forward because of inertia of motion, so she covers a longer horizontal distance before landing.", "r": "Inertia of motion: a moving body tends to keep moving (passengers fall forward when a bus brakes)."}, "hi": {"q": "लंबी कूद में एथलीट उछलने से पहले लंबी दूरी तक दौड़ती है। दौड़ उसे अधिक दूर कूदने में क्यों मदद करती है, इसकी सबसे अच्छी व्याख्या कौन-सा कथन करता है?", "o": ["गति का जड़त्व उछलने के बाद उसे आगे ले जाता है", "दौड़ से उसका द्रव्यमान और इसलिए बल बढ़ता है", "दौड़ने से उसके शरीर पर गुरुत्व का खिंचाव घटता है", "ज़मीन का घर्षण उसे हवा में ऊपर धकेलता है"], "e": "दौड़ से उसे अधिक आगे का वेग मिलता है। उछलने के बाद गति के जड़त्व के कारण उसका शरीर आगे बढ़ता रहता है, इसलिए वह उतरने से पहले अधिक क्षैतिज दूरी तय करती है।", "r": "गति का जड़त्व: चलती वस्तु चलती रहना चाहती है (बस में ब्रेक पर यात्री आगे गिरते हैं)।"}}, {"s": "Mechanics", "a": 2, "en": {"q": "When a gun fires a bullet, the gun moves backward. Which statement about the forces on the bullet and the gun is correct?", "o": ["The force on the gun is larger, as the gun is heavier", "The force on the bullet is larger, as it moves faster", "Both forces are equal; the bullet is faster as it is lighter", "Both forces are equal, so both move with equal speed"], "e": "By Newton's third law, the gun pushes the bullet and the bullet pushes the gun with equal and opposite forces. Since a = F/m, the light bullet gets a very large velocity and the heavy gun only a small recoil velocity (momentum is conserved).", "r": "Equal forces do not mean equal speeds – lighter body, larger speed."}, "hi": {"q": "बंदूक से गोली चलने पर बंदूक पीछे की ओर हटती है। गोली और बंदूक पर लगने वाले बलों के बारे में कौन-सा कथन सही है?", "o": ["बंदूक पर बल अधिक है, क्योंकि वह भारी है", "गोली पर बल अधिक है, क्योंकि वह तेज़ चलती है", "दोनों बल बराबर हैं; गोली हल्की होने से तेज़ है", "दोनों बल बराबर हैं, इसलिए दोनों की चाल समान है"], "e": "न्यूटन के तीसरे नियम से बंदूक गोली को और गोली बंदूक को बराबर व विपरीत बल से धकेलती है। a = F/m होने से हल्की गोली को बहुत अधिक वेग और भारी बंदूक को कम प्रतिक्षेप वेग मिलता है (संवेग संरक्षित)।", "r": "बराबर बल का अर्थ बराबर चाल नहीं – हल्की वस्तु, अधिक चाल।"}}, {"s": "Mechanics", "a": 3, "en": {"q": "In a building, lift A raises a 500 N load through 20 m in 10 s. Lift B raises an identical load through the same height in 25 s. What is the difference between the power delivered by the two lifts?", "o": ["1400 W", "400 W", "1000 W", "600 W"], "e": "Work done by each lift = 500 × 20 = 10,000 J. Power of A = 10,000/10 = 1000 W; power of B = 10,000/25 = 400 W. Difference = 600 W.", "r": "Same work in less time means more power (P = W/t)."}, "hi": {"q": "एक इमारत में लिफ़्ट A 500 N भार को 20 m ऊपर 10 s में उठाती है। लिफ़्ट B उतना ही भार उतनी ही ऊँचाई तक 25 s में उठाती है। दोनों लिफ़्टों की शक्ति में अंतर क्या है?", "o": ["1400 W", "400 W", "1000 W", "600 W"], "e": "प्रत्येक लिफ़्ट का कार्य = 500 × 20 = 10,000 J। A की शक्ति = 10,000/10 = 1000 W; B की = 10,000/25 = 400 W। अंतर = 600 W।", "r": "समान कार्य कम समय में = अधिक शक्ति (P = W/t)।"}}, {"s": "Mechanics", "a": 0, "en": {"q": "A porter pushes a box 3 m along a smooth floor with a horizontal force equal to the box's weight. Later he lifts the same box vertically through 3 m. Which statement about the work done is correct?", "o": ["Equal work is done in both cases", "More work is done while lifting it up", "More work is done while pushing it along", "No work is done while pushing it along"], "e": "In both cases the force has the same size (equal to the weight) and acts along the displacement of 3 m, so W = F × s is the same. Work depends on force and displacement in its direction, not on whether the motion is horizontal or vertical.", "r": "W = F s cos θ – only the angle between force and displacement matters."}, "hi": {"q": "एक कुली डिब्बे को चिकने फ़र्श पर डिब्बे के भार के बराबर क्षैतिज बल से 3 m धकेलता है। बाद में वह उसी डिब्बे को 3 m ऊर्ध्वाधर ऊपर उठाता है। किए गए कार्य के बारे में कौन-सा कथन सही है?", "o": ["दोनों स्थितियों में बराबर कार्य होता है", "ऊपर उठाते समय अधिक कार्य होता है", "धकेलते समय अधिक कार्य होता है", "धकेलते समय कोई कार्य नहीं होता"], "e": "दोनों में बल का परिमाण समान (भार के बराबर) है और वह 3 m विस्थापन की दिशा में लगता है, अतः W = F × s समान है। कार्य बल और उसकी दिशा में विस्थापन पर निर्भर है, क्षैतिज या ऊर्ध्वाधर होने पर नहीं।", "r": "W = F s cos θ – केवल बल और विस्थापन के बीच का कोण मायने रखता है।"}}, {"s": "Mechanics", "a": 1, "en": {"q": "A worker carries a toolbox up a ladder to a platform 3 m high, then brings it down to a step 1 m high. Compared with its value on the platform, the toolbox's gravitational potential energy on the step is:", "o": ["more", "less", "the same", "zero"], "e": "Gravitational PE = mgh depends only on the height above the reference level. The step (1 m) is lower than the platform (3 m), so the PE on the step is less. It is not zero, because the step is still above the ground.", "r": "PE depends on present height only, not on the path followed."}, "hi": {"q": "एक मज़दूर औज़ार का बक्सा सीढ़ी से 3 m ऊँचे प्लेटफ़ॉर्म तक ले जाता है, फिर उसे 1 m ऊँचे पायदान पर उतार देता है। प्लेटफ़ॉर्म की तुलना में पायदान पर बक्से की गुरुत्वीय स्थितिज ऊर्जा है:", "o": ["अधिक", "कम", "समान", "शून्य"], "e": "गुरुत्वीय स्थितिज ऊर्जा = mgh, केवल संदर्भ तल से ऊँचाई पर निर्भर है। पायदान (1 m) प्लेटफ़ॉर्म (3 m) से नीचे है, अतः ऊर्जा कम। यह शून्य नहीं, क्योंकि पायदान अभी भी ज़मीन से ऊपर है।", "r": "स्थितिज ऊर्जा केवल वर्तमान ऊँचाई पर निर्भर, पथ पर नहीं।"}}, {"s": "Mechanics", "a": 2, "en": {"q": "A shopkeeper cracks walnuts with a nutcracker. The hinge is at one end, the walnut sits in the middle and the hand presses at the other end. In this lever:", "o": ["the effort lies between the fulcrum and the load", "the fulcrum lies between the load and the effort", "the load lies between the fulcrum and the effort", "the load and the effort act at the same point"], "e": "The hinge is the fulcrum, the walnut is the load in the middle and the hand applies effort at the far end. This is a Class II lever: the effort arm is always longer than the load arm, so the mechanical advantage is greater than 1.", "r": "Class II levers (nutcracker, wheelbarrow, bottle opener) always have MA > 1."}, "hi": {"q": "एक दुकानदार सरौते से अखरोट तोड़ता है। कब्ज़ा एक सिरे पर है, अखरोट बीच में है और हाथ दूसरे सिरे पर दबाता है। इस उत्तोलक में:", "o": ["प्रयास आलंब और भार के बीच है", "आलंब भार और प्रयास के बीच है", "भार आलंब और प्रयास के बीच है", "भार और प्रयास एक ही बिंदु पर लगते हैं"], "e": "कब्ज़ा आलंब है, बीच में अखरोट भार है और हाथ दूर के सिरे पर प्रयास लगाता है। यह वर्ग II उत्तोलक है: प्रयास-भुजा सदैव भार-भुजा से लंबी, अतः यांत्रिक लाभ 1 से अधिक।", "r": "वर्ग II उत्तोलक (सरौता, एक-पहिया ठेला, ओपनर) में MA सदैव > 1।"}}, {"s": "Sound & Matter", "a": 1, "en": {"q": "In an empty auditorium, a speaker's voice keeps lingering. After curtains, carpets and padded chairs are installed, the speech becomes clear. This happens because the soft materials:", "o": ["increase the speed of sound in the hall", "absorb sound and reduce reverberation", "raise the pitch of the speaker's voice", "reflect more sound back to the stage"], "e": "Hard bare surfaces reflect sound again and again, so it persists (reverberation) and words overlap. Soft, porous materials absorb sound energy, cut down the repeated reflections and make speech clear.", "r": "Reverberation = persistence of sound due to multiple reflections."}, "hi": {"q": "एक खाली सभागार में वक्ता की आवाज़ देर तक गूँजती रहती है। पर्दे, कालीन और गद्देदार कुर्सियाँ लगाने के बाद भाषण स्पष्ट हो जाता है। ऐसा इसलिए होता है क्योंकि मुलायम पदार्थ:", "o": ["हॉल में ध्वनि की चाल बढ़ा देते हैं", "ध्वनि सोखकर अनुरणन कम करते हैं", "वक्ता की आवाज़ का तारत्व बढ़ाते हैं", "अधिक ध्वनि मंच की ओर परावर्तित करते हैं"], "e": "कठोर खाली सतहें ध्वनि को बार-बार परावर्तित करती हैं, जिससे वह बनी रहती है (अनुरणन) और शब्द आपस में मिल जाते हैं। मुलायम, छिद्रयुक्त पदार्थ ध्वनि ऊर्जा सोखकर बार-बार के परावर्तन घटाते हैं।", "r": "अनुरणन = बहुल परावर्तन से ध्वनि का बने रहना।"}}, {"s": "Sound & Matter", "a": 2, "en": {"q": "On a hot, humid afternoon, the sound of a temple bell reaches a distant listener slightly sooner than on a cold, dry morning. This is because sound travels:", "o": ["slower in warm, moist air than in cold, dry air", "at the same speed whatever the weather may be", "faster in warm, moist air than in cold, dry air", "faster only when the wind blows towards him"], "e": "The speed of sound in air increases with temperature (about 0.6 m/s per °C) and also increases with humidity. So sound covers the same distance in less time on a hot, humid day.", "r": "Speed of sound rises with temperature and humidity; it does not depend on pressure."}, "hi": {"q": "गर्म, उमस भरी दोपहर में मंदिर की घंटी की आवाज़ दूर खड़े श्रोता तक ठंडी, शुष्क सुबह की तुलना में थोड़ा जल्दी पहुँचती है। इसका कारण है कि ध्वनि:", "o": ["गर्म, नम वायु में ठंडी, शुष्क वायु से धीमी चलती है", "मौसम कैसा भी हो, समान चाल से चलती है", "गर्म, नम वायु में ठंडी, शुष्क वायु से तेज़ चलती है", "केवल तब तेज़ चलती है जब हवा उसकी ओर बहे"], "e": "वायु में ध्वनि की चाल ताप के साथ (लगभग 0.6 m/s प्रति °C) और आर्द्रता के साथ भी बढ़ती है। इसलिए गर्म, उमस भरे दिन ध्वनि उतनी ही दूरी कम समय में तय करती है।", "r": "ध्वनि की चाल ताप और आर्द्रता से बढ़ती है; दाब पर निर्भर नहीं।"}}, {"s": "Light", "a": 0, "en": {"q": "A dentist uses a small mirror to see an enlarged, upright image of a patient's tooth. Which mirror is used, and where is the tooth placed?", "o": ["Concave mirror, tooth between pole and focus", "Convex mirror, tooth beyond centre of curvature", "Concave mirror, tooth at centre of curvature", "Plane mirror, tooth placed at any distance"], "e": "Only a concave mirror can give an enlarged, erect (virtual) image, and only when the object is between the pole and the focus. A convex mirror always gives a smaller image; a plane mirror gives a same-size image.", "r": "Concave mirror, object within F → virtual, erect, enlarged (shaving and dentist mirrors)."}, "hi": {"q": "एक दंत चिकित्सक रोगी के दाँत का बड़ा और सीधा प्रतिबिंब देखने के लिए छोटा दर्पण प्रयोग करता है। कौन-सा दर्पण प्रयुक्त होता है और दाँत कहाँ रखा जाता है?", "o": ["अवतल दर्पण, दाँत ध्रुव और फोकस के बीच", "उत्तल दर्पण, दाँत वक्रता केंद्र से परे", "अवतल दर्पण, दाँत वक्रता केंद्र पर", "समतल दर्पण, दाँत किसी भी दूरी पर"], "e": "केवल अवतल दर्पण बड़ा, सीधा (आभासी) प्रतिबिंब देता है, और वह भी तभी जब वस्तु ध्रुव और फोकस के बीच हो। उत्तल दर्पण सदैव छोटा प्रतिबिंब देता है; समतल दर्पण समान आकार का।", "r": "अवतल दर्पण, वस्तु F के अंदर → आभासी, सीधा, बड़ा (शेविंग और दंत दर्पण)।"}}, {"s": "Light", "a": 1, "en": {"q": "A student traces rays through rectangular glass slabs of different thickness, keeping the angle of incidence the same. The sideways shift of the emergent ray will be greater for the:", "o": ["thinner slab, as light travels less in glass", "thicker slab, as light travels more in glass", "both slabs, as the shift does not depend on thickness", "slab with the brighter light falling on it"], "e": "The emergent ray is parallel to the incident ray but displaced sideways (lateral shift). For the same angle of incidence, the shift increases with the thickness of the slab because the ray travels a longer path inside the glass.", "r": "Glass slab: emergent ray ∥ incident ray; lateral shift grows with thickness and angle of incidence."}, "hi": {"q": "एक छात्र अलग-अलग मोटाई की आयताकार काँच की सिल्लियों से किरणें खींचता है और आपतन कोण समान रखता है। निर्गत किरण का पार्श्व विस्थापन किसके लिए अधिक होगा?", "o": ["पतली सिल्ली, क्योंकि प्रकाश काँच में कम चलता है", "मोटी सिल्ली, क्योंकि प्रकाश काँच में अधिक चलता है", "दोनों सिल्लियों के लिए, विस्थापन मोटाई पर निर्भर नहीं", "जिस सिल्ली पर अधिक चमकीला प्रकाश पड़े"], "e": "निर्गत किरण आपतित किरण के समांतर पर पार्श्व रूप से विस्थापित होती है। समान आपतन कोण पर विस्थापन सिल्ली की मोटाई के साथ बढ़ता है, क्योंकि किरण काँच में लंबा पथ तय करती है।", "r": "काँच की सिल्ली: निर्गत ∥ आपतित; पार्श्व विस्थापन मोटाई और आपतन कोण के साथ बढ़ता है।"}}, {"s": "Light", "a": 0, "en": {"q": "A pencil partly dipped in a glass of water looks bent at the water surface. This happens because the light coming from the immersed part:", "o": ["bends away from the normal on leaving water", "bends towards the normal on leaving water", "gets totally reflected at the water surface", "travels faster in water than in the air"], "e": "Light from the dipped part goes from water (denser) into air (rarer), so it bends away from the normal. The eye traces the rays back in straight lines, so the immersed part appears raised and the pencil looks bent.", "r": "Denser → rarer: away from the normal. Same reason a pool looks shallower."}, "hi": {"q": "पानी के गिलास में आंशिक रूप से डूबी पेंसिल पानी की सतह पर मुड़ी हुई दिखती है। इसका कारण है कि डूबे भाग से आने वाला प्रकाश:", "o": ["पानी से निकलते समय अभिलंब से दूर मुड़ता है", "पानी से निकलते समय अभिलंब की ओर मुड़ता है", "पानी की सतह पर पूर्ण परावर्तित हो जाता है", "पानी में वायु की तुलना में तेज़ चलता है"], "e": "डूबे भाग का प्रकाश पानी (सघन) से वायु (विरल) में जाता है, अतः अभिलंब से दूर मुड़ता है। आँख किरणों को सीधी रेखा में पीछे मानती है, इसलिए डूबा भाग ऊपर उठा और पेंसिल मुड़ी दिखती है।", "r": "सघन → विरल: अभिलंब से दूर। इसी कारण तालाब उथला दिखता है।"}}, {"s": "Light", "a": 1, "en": {"q": "An object is placed 30 cm in front of a convex lens of focal length 20 cm. Which option correctly describes the image formed?", "o": ["12 cm away, virtual and erect", "60 cm away, real and inverted", "60 cm away, virtual and erect", "12 cm away, real and inverted"], "e": "1/v − 1/u = 1/f ⇒ 1/v = 1/20 − 1/30 = 1/60 ⇒ v = +60 cm (on the other side, real). m = v/u = 60/(−30) = −2, so the image is inverted and twice the size (object between F and 2F).", "r": "Convex lens: object between F and 2F → real, inverted, enlarged image beyond 2F (projector)."}, "hi": {"q": "एक वस्तु 20 cm फोकस दूरी वाले उत्तल लेंस के सामने 30 cm पर रखी है। बने प्रतिबिंब का सही वर्णन कौन-सा विकल्प करता है?", "o": ["12 cm दूर, आभासी और सीधा", "60 cm दूर, वास्तविक और उल्टा", "60 cm दूर, आभासी और सीधा", "12 cm दूर, वास्तविक और उल्टा"], "e": "1/v − 1/u = 1/f ⇒ 1/v = 1/20 − 1/30 = 1/60 ⇒ v = +60 cm (दूसरी ओर, वास्तविक)। m = v/u = 60/(−30) = −2, अतः प्रतिबिंब उल्टा और दोगुना (वस्तु F और 2F के बीच)।", "r": "उत्तल लेंस: वस्तु F और 2F के बीच → 2F से परे वास्तविक, उल्टा, बड़ा प्रतिबिंब (प्रोजेक्टर)।"}}, {"s": "Light", "a": 1, "en": {"q": "In an experiment, a ray of light falls on a glass block exactly along the normal, so the angle of incidence is 0°. What happens to the ray as it enters the glass?", "o": ["It bends towards the normal", "It passes through without bending", "It bends away from the normal", "It is totally reflected back"], "e": "When i = 0°, Snell's law gives r = 0°, so the ray goes straight through without bending. Its speed and wavelength decrease inside glass, but its direction does not change.", "r": "A ray along the normal is never deviated; only its speed changes."}, "hi": {"q": "एक प्रयोग में प्रकाश की किरण काँच के गुटके पर ठीक अभिलंब के अनुदिश पड़ती है, अर्थात आपतन कोण 0° है। काँच में प्रवेश करते समय किरण का क्या होता है?", "o": ["यह अभिलंब की ओर मुड़ती है", "यह बिना मुड़े सीधी निकल जाती है", "यह अभिलंब से दूर मुड़ती है", "यह पूर्ण रूप से वापस परावर्तित होती है"], "e": "i = 0° होने पर स्नेल के नियम से r = 0°, अतः किरण बिना मुड़े सीधी जाती है। काँच में उसकी चाल और तरंगदैर्ध्य घटते हैं, पर दिशा नहीं बदलती।", "r": "अभिलंब के अनुदिश किरण कभी विचलित नहीं होती; केवल चाल बदलती है।"}}, {"s": "Light", "a": 2, "en": {"q": "A person can read comfortably only when the book is at least 50 cm away. To read at the normal distance of 25 cm, what power of lens does he need?", "o": ["−2 D", "+4 D", "+2 D", "+0.5 D"], "e": "This is hypermetropia (near point 50 cm). The lens must form a virtual image at 50 cm of a book kept at 25 cm: 1/f = 1/v − 1/u = 1/(−50) − 1/(−25) = 1/50 cm⁻¹ ⇒ f = +50 cm ⇒ P = 100/50 = +2 D (convex).", "r": "Hypermetropia → convex lens; myopia → concave lens."}, "hi": {"q": "एक व्यक्ति किताब को कम से कम 50 cm दूर रखने पर ही आराम से पढ़ पाता है। सामान्य 25 cm दूरी पर पढ़ने के लिए उसे कितनी क्षमता का लेंस चाहिए?", "o": ["−2 D", "+4 D", "+2 D", "+0.5 D"], "e": "यह दीर्घदृष्टि है (निकट बिंदु 50 cm)। लेंस को 25 cm पर रखी किताब का आभासी प्रतिबिंब 50 cm पर बनाना है: 1/f = 1/v − 1/u = 1/(−50) − 1/(−25) = 1/50 cm⁻¹ ⇒ f = +50 cm ⇒ P = +2 D (उत्तल)।", "r": "दीर्घदृष्टि → उत्तल लेंस; निकटदृष्टि → अवतल लेंस।"}}, {"s": "Light", "a": 3, "en": {"q": "Standing in the morning sunlight, a person feels warmth on the skin. Which part of the Sun's radiation is mainly responsible for this heating effect?", "o": ["Ultraviolet rays", "Visible light only", "X-rays", "Infrared rays"], "e": "Infrared radiation is heat radiation: it is absorbed by the skin and objects and raises their temperature. Ultraviolet rays cause sunburn and tanning, and X-rays from the Sun do not reach the ground.", "r": "Infrared = heat rays; ultraviolet is absorbed mostly by the ozone layer."}, "hi": {"q": "सुबह की धूप में खड़े व्यक्ति को त्वचा पर गर्माहट महसूस होती है। सूर्य के विकिरण का कौन-सा भाग इस तापीय प्रभाव के लिए मुख्य रूप से उत्तरदायी है?", "o": ["पराबैंगनी किरणें", "केवल दृश्य प्रकाश", "X-किरणें", "अवरक्त किरणें"], "e": "अवरक्त विकिरण ऊष्मीय विकिरण है: त्वचा और वस्तुएँ इसे सोखकर गर्म होती हैं। पराबैंगनी किरणें सनबर्न और टैनिंग करती हैं, और सूर्य की X-किरणें ज़मीन तक नहीं पहुँचतीं।", "r": "अवरक्त = ऊष्मा किरणें; पराबैंगनी को अधिकतर ओज़ोन परत सोख लेती है।"}}, {"s": "Light", "a": 0, "en": {"q": "Sunlight entering a dark, dusty room through a small hole in the roof shows a bright visible path. This path becomes visible because:", "o": ["dust particles scatter the light towards our eyes", "light travels slower inside a closed room", "air in the room refracts the light upward", "the hole splits the light into many colours"], "e": "Tiny dust and smoke particles scatter the light sideways into our eyes, so the path of the beam becomes visible. This is the Tyndall effect, also seen in forests when sunlight passes through mist.", "r": "Tyndall effect: scattering by colloid-size particles (dust, smoke, milk, fog)."}, "hi": {"q": "छत के छोटे छेद से अँधेरे, धूल भरे कमरे में आने वाली धूप का चमकीला पथ दिखाई देता है। यह पथ दिखाई देता है क्योंकि:", "o": ["धूल के कण प्रकाश को हमारी आँखों की ओर बिखेरते हैं", "बंद कमरे में प्रकाश धीमा चलता है", "कमरे की वायु प्रकाश को ऊपर अपवर्तित करती है", "छेद प्रकाश को कई रंगों में बाँट देता है"], "e": "धूल और धुएँ के सूक्ष्म कण प्रकाश को बगल की ओर हमारी आँखों में बिखेरते हैं, इसलिए पुंज का पथ दिखता है। यह टिंडल प्रभाव है, जो जंगल में धुंध से गुजरती धूप में भी दिखता है।", "r": "टिंडल प्रभाव: कोलॉइड आकार के कणों (धूल, धुआँ, दूध, कोहरा) से प्रकीर्णन।"}}, {"s": "Electricity & Magnetism", "a": 1, "en": {"q": "In a hand-held fan with a speed regulator, turning the knob to \"high\" makes the motor run faster, though the battery voltage is unchanged. This is because turning the knob:", "o": ["raises the circuit resistance, so more current flows", "lowers the circuit resistance, so more current flows", "increases the battery voltage directly", "reduces the current but increases the power"], "e": "By Ohm's law I = V/R. With V fixed, lowering the resistance in the circuit increases the current, so more power (P = VI) reaches the motor and it runs faster.", "r": "Fixed voltage: less resistance → more current → more power."}, "hi": {"q": "स्पीड रेगुलेटर वाले हाथ के पंखे में नॉब को \"high\" पर करने से मोटर तेज़ चलती है, जबकि बैटरी की वोल्टता नहीं बदलती। इसका कारण है कि नॉब घुमाने से:", "o": ["परिपथ का प्रतिरोध बढ़ता है, इसलिए अधिक धारा बहती है", "परिपथ का प्रतिरोध घटता है, इसलिए अधिक धारा बहती है", "बैटरी की वोल्टता सीधे बढ़ जाती है", "धारा घटती है पर शक्ति बढ़ जाती है"], "e": "ओम के नियम से I = V/R। V नियत होने पर परिपथ का प्रतिरोध घटने से धारा बढ़ती है, अतः मोटर तक अधिक शक्ति (P = VI) पहुँचती है और वह तेज़ चलती है।", "r": "नियत वोल्टता: कम प्रतिरोध → अधिक धारा → अधिक शक्ति।"}}, {"s": "Electricity & Magnetism", "a": 3, "en": {"q": "A voltmeter is always designed with a very high resistance. What is the main reason for this?", "o": ["So that it heats up quickly during use", "So that it can be joined in series with a load", "So that the full circuit current passes through it", "So that it draws almost no current from the circuit"], "e": "A voltmeter is connected in parallel across a component. If its resistance is very high, it takes almost no current, so it does not disturb the circuit and reads the true potential difference.", "r": "Voltmeter: high resistance, in parallel. Ammeter: low resistance, in series."}, "hi": {"q": "वोल्टमीटर को सदैव बहुत अधिक प्रतिरोध वाला बनाया जाता है। इसका मुख्य कारण क्या है?", "o": ["ताकि उपयोग में वह जल्दी गर्म हो", "ताकि उसे लोड के साथ श्रेणी में जोड़ा जा सके", "ताकि परिपथ की पूरी धारा उससे गुजरे", "ताकि वह परिपथ से लगभग कोई धारा न ले"], "e": "वोल्टमीटर किसी अवयव के समांतर जोड़ा जाता है। उसका प्रतिरोध बहुत अधिक हो तो वह लगभग कोई धारा नहीं लेता, परिपथ को प्रभावित नहीं करता और सही विभवांतर पढ़ता है।", "r": "वोल्टमीटर: अधिक प्रतिरोध, समांतर में। अमीटर: कम प्रतिरोध, श्रेणी में।"}}, {"s": "Electricity & Magnetism", "a": 1, "en": {"q": "A nichrome wire 1 m long with a cross-sectional area of 2 × 10⁻⁷ m² has a resistance of 5.5 Ω. What is the resistivity of nichrome?", "o": ["2.75 × 10⁻⁷ Ω m", "1.1 × 10⁻⁶ Ω m", "1.1 × 10⁻⁷ Ω m", "5.5 × 10⁻⁶ Ω m"], "e": "ρ = RA/L = 5.5 × 2 × 10⁻⁷ / 1 = 11 × 10⁻⁷ = 1.1 × 10⁻⁶ Ω m. This high resistivity is why nichrome is used in heater elements.", "r": "Resistivity unit is Ω m; it depends only on the material and temperature."}, "hi": {"q": "1 m लंबे और 2 × 10⁻⁷ m² अनुप्रस्थ काट वाले नाइक्रोम तार का प्रतिरोध 5.5 Ω है। नाइक्रोम की प्रतिरोधकता क्या है?", "o": ["2.75 × 10⁻⁷ Ω m", "1.1 × 10⁻⁶ Ω m", "1.1 × 10⁻⁷ Ω m", "5.5 × 10⁻⁶ Ω m"], "e": "ρ = RA/L = 5.5 × 2 × 10⁻⁷ / 1 = 11 × 10⁻⁷ = 1.1 × 10⁻⁶ Ω m। अधिक प्रतिरोधकता के कारण ही नाइक्रोम हीटर अवयव में प्रयुक्त होता है।", "r": "प्रतिरोधकता का मात्रक Ω m; यह केवल पदार्थ और ताप पर निर्भर।"}}, {"s": "Electricity & Magnetism", "a": 2, "en": {"q": "A horizontal wire carries current from west to east in a uniform magnetic field pointing vertically upward. In which direction does the magnetic force act on the wire?", "o": ["Towards the north", "Vertically upward", "Towards the south", "Vertically downward"], "e": "Fleming's left-hand rule: forefinger (field) up, middle finger (current) east – the thumb (force) points towards the south. The force is perpendicular to both the current and the field.", "r": "Fleming's left hand: First finger – Field, seCond finger – Current, thuMb – Motion (force)."}, "hi": {"q": "एक क्षैतिज तार में धारा पश्चिम से पूर्व की ओर बह रही है और वह ऊर्ध्वाधर ऊपर की ओर दिष्ट एकसमान चुंबकीय क्षेत्र में है। तार पर चुंबकीय बल किस दिशा में लगेगा?", "o": ["उत्तर की ओर", "ऊर्ध्वाधर ऊपर", "दक्षिण की ओर", "ऊर्ध्वाधर नीचे"], "e": "फ्लेमिंग का वाम-हस्त नियम: तर्जनी (क्षेत्र) ऊपर, मध्यमा (धारा) पूर्व – अंगूठा (बल) दक्षिण की ओर। बल धारा और क्षेत्र दोनों के लंबवत होता है।", "r": "फ्लेमिंग वाम-हस्त: तर्जनी – क्षेत्र, मध्यमा – धारा, अंगूठा – गति (बल)।"}}, {"s": "Electricity & Magnetism", "a": 1, "en": {"q": "A current-carrying solenoid hangs freely and settles in the north–south direction like a bar magnet. If the direction of the current in the solenoid is reversed:", "o": ["the solenoid becomes a stronger magnet", "its north and south poles get interchanged", "the field inside the solenoid becomes zero", "it stops behaving like a magnet at all"], "e": "The polarity of each face depends on the direction of current (anticlockwise = N, clockwise = S). Reversing the current swaps the poles, so the solenoid turns around by 180°; its strength stays the same.", "r": "Strength of a solenoid depends on turns, current and core – not on the direction of current."}, "hi": {"q": "एक धारावाही परिनालिका स्वतंत्र रूप से लटकाने पर छड़ चुंबक की तरह उत्तर–दक्षिण दिशा में रुकती है। यदि परिनालिका में धारा की दिशा उलट दी जाए:", "o": ["परिनालिका अधिक प्रबल चुंबक बन जाएगी", "उसके उत्तरी और दक्षिणी ध्रुव आपस में बदल जाएँगे", "परिनालिका के अंदर क्षेत्र शून्य हो जाएगा", "वह चुंबक की तरह व्यवहार करना बंद कर देगी"], "e": "हर सिरे की ध्रुवता धारा की दिशा पर निर्भर है (वामावर्त = N, दक्षिणावर्त = S)। धारा उलटने से ध्रुव बदल जाते हैं और परिनालिका 180° घूम जाती है; प्रबलता वही रहती है।", "r": "परिनालिका की प्रबलता फेरों, धारा और क्रोड पर निर्भर – धारा की दिशा पर नहीं।"}}, {"s": "Mechanics", "a": 0, "en": {"q": "A wooden block floats in water with three-fifths of its volume below the surface. Taking the density of water as 1000 kg/m³, what is the density of the wood?", "o": ["600 kg/m³", "400 kg/m³", "1000 kg/m³", "1667 kg/m³"], "e": "For a floating body, fraction submerged = density of body / density of liquid. So density of wood = (3/5) × 1000 = 600 kg/m³.", "r": "A body floats when its density is less than that of the liquid; ice (920) floats with 92% inside water."}, "hi": {"q": "एक लकड़ी का गुटका पानी में अपने आयतन का तीन-पाँचवाँ भाग सतह के नीचे रखकर तैरता है। पानी का घनत्व 1000 kg/m³ लें, तो लकड़ी का घनत्व क्या है?", "o": ["600 kg/m³", "400 kg/m³", "1000 kg/m³", "1667 kg/m³"], "e": "तैरती वस्तु के लिए डूबा भाग = वस्तु का घनत्व / द्रव का घनत्व। अतः लकड़ी का घनत्व = (3/5) × 1000 = 600 kg/m³।", "r": "वस्तु तब तैरती है जब उसका घनत्व द्रव से कम हो; बर्फ़ (920) 92% अंदर रहकर तैरती है।"}}];
const T={en:{start:'Choose a mode',test:'Test mode',testd:'Timed exam: '+META.mins+' min, +1 / −1/3, result and solutions at the end.',prac:'Practice mode',pracd:'No timer. See the answer and explanation right after each question.',rules:['1 mark for a correct answer, 1/3 mark deducted for a wrong one, 0 for skipped.','The test submits automatically when time runs out.','Switch between English and हिंदी at any time.'],q:'Question',prev:'← Previous',next:'Next →',clear:'Clear',submit:'Submit test',confirm:'Submit the test now?',res:'Result',sc:'Score',cor:'Correct',wr:'Wrong',sk:'Skipped',acc:'Accuracy',secw:'Section-wise',secn:'Section',all:'All',sol:'Solutions',ans:'Answer',rem:'Remember: ',your:'Your answer',retry:'Try again',home:'Home',pscore:'Practice score',finish:'Finish',skipped:'Not answered',pal:'Question palette'},
hi:{start:'मोड चुनें',test:'टेस्ट मोड',testd:'समयबद्ध परीक्षा: '+META.mins+' मिनट, +1 / −1/3, अंत में परिणाम और हल।',prac:'प्रैक्टिस मोड',pracd:'कोई टाइमर नहीं। हर प्रश्न के बाद तुरंत उत्तर और व्याख्या देखें।',rules:['सही उत्तर पर 1 अंक, गलत पर 1/3 अंक कटेगा, छोड़े गए पर 0।','समय समाप्त होते ही टेस्ट अपने आप सबमिट होगा।','कभी भी English और हिंदी के बीच बदलें।'],q:'प्रश्न',prev:'← पिछला',next:'अगला →',clear:'हटाएँ',submit:'टेस्ट सबमिट करें',confirm:'क्या अभी टेस्ट सबमिट करें?',res:'परिणाम',sc:'अंक',cor:'सही',wr:'गलत',sk:'छोड़े',acc:'सटीकता',secw:'खंडवार',secn:'खंड',all:'सभी',sol:'हल',ans:'उत्तर',rem:'याद रखें: ',your:'आपका उत्तर',retry:'फिर से प्रयास',home:'होम',pscore:'प्रैक्टिस स्कोर',finish:'समाप्त',skipped:'उत्तर नहीं दिया',pal:'प्रश्न पैलेट'}};
const SECHI={'Mechanics':'यांत्रिकी','Light':'प्रकाश','Electricity & Magnetism':'विद्युत और चुंबकत्व','Sound & Matter':'ध्वनि और पदार्थ'};
let L='en',mode=null,cur=0,resp=[],done=false,left=META.mins*60,tick=null,filt='all';
const $=s=>document.querySelector(s),app=$('#app');
const t=k=>T[L][k],sec=s=>L==='hi'?(SECHI[s]||s):s,K='abcd';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function setLang(x){L=x;$('#lEN').classList.toggle('on',x==='en');$('#lHI').classList.toggle('on',x==='hi');document.documentElement.lang=x;render()}
$('#lEN').onclick=()=>setLang('en');$('#lHI').onclick=()=>setLang('hi');
function home(){mode=null;done=false;clearInterval(tick);$('#timer').classList.add('hide');render()}
function start(m){mode=m;cur=0;resp=Array(Q.length).fill(null);done=false;filt='all';clearInterval(tick);$('#timer').classList.add('hide');
 if(m==='test'){left=META.mins*60;$('#timer').classList.remove('hide');showTime();tick=setInterval(()=>{left--;showTime();if(left<=0){finish()}},1000)}
 render();window.scrollTo(0,0)}
function showTime(){const m=Math.max(0,Math.floor(left/60)),s=Math.max(0,left%60);$('#timer').textContent='⏱ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function finish(){done=true;clearInterval(tick);$('#timer').classList.add('hide');render();window.scrollTo(0,0)}
function stats(){let c=0,w=0,s=0,by={};Q.forEach((q,i)=>{const b=by[q.s]=by[q.s]||{n:0,c:0,w:0};b.n++;if(resp[i]===null){s++}else if(resp[i]===q.a){c++;b.c++}else{w++;b.w++}});return{c,w,s,by,score:+(c-w/3).toFixed(2)}}
function qcard(i,showAns,tag){const q=Q[i],d=q[L],r=resp[i];
 let h=`<div class="card"><div class="qhead"><span class="qno">${t('q')} ${i+1} / ${Q.length}</span><span>${tag||''} <span class="sec">${sec(q.s)}</span></span></div><div class="qt">${esc(d.q)}</div>`;
 d.o.forEach((o,j)=>{let c='';if(showAns){if(j===q.a)c='ok';else if(r===j)c='bad'}else if(r===j)c='sel';
  h+=`<button class="opt ${c}" data-j="${j}" ${showAns?'disabled':''}><span class="k">(${K[j]})</span><span>${esc(o)}</span></button>`});
 if(showAns)h+=`<div class="exp"><b>${t('ans')}: (${K[q.a]})</b> ${esc(d.e)}<div class="rm">💡 ${t('rem')}${esc(d.r)}</div></div>`;
 return h+'</div>'}
function render(){
 if(!mode){app.innerHTML=`<div class="card"><div class="sub">${META.kicker}</div><h1>${META.title}</h1><div class="sub">${L==='hi'?META.subhi:META.sub}</div>
 <div class="chips"><span>${Q.length} Qs</span><span>⏱ ${META.mins} min</span><span>+1 / −1/3</span><span>EN | हिंदी</span></div>
 <h2>${t('start')}</h2><div class="modes"><button class="mode" id="mT"><b>📝 ${t('test')}</b>${t('testd')}</button><button class="mode" id="mP"><b>🎯 ${t('prac')}</b>${t('pracd')}</button></div>
 <ul class="rules">${t('rules').map(x=>'<li>'+x+'</li>').join('')}</ul></div>`;$('#mT').onclick=()=>start('test');$('#mP').onclick=()=>start('prac');return}
 if(done)return result();
 const showAns=mode==='prac'&&resp[cur]!==null;
 let h=qcard(cur,showAns);
 h+=`<div class="nav"><button class="btn s" id="bP" ${cur===0?'disabled':''}>${t('prev')}</button>`+(mode==='test'?`<button class="btn s" id="bC">${t('clear')}</button>`:'')+(cur<Q.length-1?`<button class="btn p" id="bN">${t('next')}</button>`:`<button class="btn d" id="bF">${mode==='test'?t('submit'):t('finish')}</button>`)+`</div>`;
 h+=`<div class="card" style="margin-top:14px"><div class="qhead"><b>${t('pal')}</b>`+(mode==='prac'?`<span class="sec">${t('pscore')}: ${stats().score}</span>`:'')+`</div><div class="pal">${Q.map((q,i)=>{let c='';if(mode==='prac'&&resp[i]!==null)c=resp[i]===q.a?'ok':'bad';else if(resp[i]!==null)c='ans';return `<button class="${c} ${i===cur?'cur':''}" data-i="${i}">${i+1}</button>`}).join('')}</div>`+(mode==='test'?`<div class="nav"><span></span><button class="btn d" id="bS">${t('submit')}</button></div>`:'')+`</div>`;
 app.innerHTML=h;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(mode==='prac'&&resp[cur]!==null)return;resp[cur]=+b.dataset.j;render()});
 app.querySelectorAll('.pal button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render()});
 const go=d=>{cur+=d;render();window.scrollTo(0,0)};
 if($('#bP'))$('#bP').onclick=()=>go(-1);if($('#bN'))$('#bN').onclick=()=>go(1);
 if($('#bC'))$('#bC').onclick=()=>{resp[cur]=null;render()};
 const sub=()=>{if(confirm(t('confirm')))finish()};
 if($('#bS'))$('#bS').onclick=sub;
 if($('#bF'))$('#bF').onclick=mode==='test'?sub:()=>finish();
}
function result(){const st=stats(),att=st.c+st.w,acc=att?Math.round(st.c/att*100):0;
 let h=`<div class="card"><h2>${t('res')} · ${META.title}</h2><div class="score"><div><b>${st.score} / ${Q.length}</b>${t('sc')}</div><div><b style="color:var(--ok)">${st.c}</b>${t('cor')}</div><div><b style="color:var(--bad)">${st.w}</b>${t('wr')}</div><div><b>${st.s}</b>${t('sk')}</div></div>
 <p class="sub">${t('acc')}: ${acc}%</p><h2>${t('secw')}</h2><table><tr><th>${t('secn')}</th><th>Qs</th><th>${t('cor')}</th><th>${t('wr')}</th><th>${t('sc')}</th></tr>${Object.entries(st.by).map(([k,b])=>`<tr><td>${sec(k)}</td><td>${b.n}</td><td>${b.c}</td><td>${b.w}</td><td>${+(b.c-b.w/3).toFixed(2)}</td></tr>`).join('')}</table>
 <div class="nav"><button class="btn p" id="bR">${t('retry')}</button><button class="btn s" id="bH">${t('home')}</button></div></div>
 <div class="card"><h2>${t('sol')}</h2><div class="filters">${[['all',t('all')],['ok',t('cor')],['bad',t('wr')],['sk',t('sk')]].map(([k,n])=>`<button data-f="${k}" class="${filt===k?'on':''}">${n}</button>`).join('')}</div></div>`;
 Q.forEach((q,i)=>{const r=resp[i],s2=r===null?'sk':(r===q.a?'ok':'bad');if(filt!=='all'&&filt!==s2)return;
  const tg=s2==='ok'?`<span class="tag ok">✔ ${t('cor')}</span>`:s2==='bad'?`<span class="tag bad">✘ ${t('your')}: (${K[r]})</span>`:`<span class="tag sk">${t('skipped')}</span>`;
  h+=qcard(i,true,tg)});
 app.innerHTML=h;$('#bR').onclick=()=>start(mode);$('#bH').onclick=home;
 app.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filt=b.dataset.f;render()})}
render();
</script></body></html>
